"],["Speed up and steer back onto the road quickly","เร่งและหักกลับขึ้นถนนเร็วๆ"]],"e":"Handbook, Right Wheels Off Pavement: foot off gas, hold wheel firmly in a straight line, brake lightly, turn back at a slow speed when clear (signal).","et":"คู่มือ: ถอนคันเร่ง จับพวงมาลัยตรง เบรกเบาๆ กลับขึ้นถนนช้าๆ เมื่อปลอดภัย","k":"text"},{"c":"rules","i":"","q":"Your gas pedal sticks while driving. What should you do FIRST after taking your foot off the pedal?","qt":"คันเร่งค้างขณะขับ หลังถอนเท้าแล้ว ควรทำอะไรก่อน?","o":[["Shift to neutral (automatic) or press the clutch (manual)","เข้าเกียร์ว่าง (อัตโนมัติ) หรือเหยียบคลัตช์ (ธรรมดา)"],["Turn off the engine immediately","ดับเครื่องทันที"],["Slam on the brakes","เหยียบเบรกอย่างแรง"],["Pull the parking brake hard at full speed","ดึงเบรกมือแรงๆ ขณะเร็ว"]],"e":"Handbook, Jammed Gas Pedal: shift to neutral or press clutch, press (don't slam) brakes, steer to a safe place. Don't shut off the engine unless needed—you would lose steering ability.","et":"คู่มือ: เข้าเกียร์ว่าง/เหยียบคลัตช์ เบรกเบาๆ ไม่ดับเครื่องเว้นแต่จำเป็น เพราะจะบังคับเลี้ยวยาก","k":"text"},{"c":"rules","i":"","q":"The traffic signals at an intersection are dark because of a power outage. How should you proceed?","qt":"ไฟจราจรที่ทางแยกดับเพราะไฟฟ้าดับ ควรทำอย่างไร?","o":[["Treat it as a four-way stop: stop, then go in order of arrival","ถือเป็นทางแยกหยุดสี่ทาง: หยุด แล้วไปตามลำดับที่มาถึง"],["Slow down and proceed like a flashing yellow light","ชะลอและไปเหมือนไฟเหลืองกะพริบ"],["Main-road traffic keeps going; side-street traffic stops","รถถนนหลักไปต่อ รถถนนรองหยุด"],["Treat it as a yield sign for everyone","ถือเป็นป้ายให้ทางสำหรับทุกคน"]],"e":"Handbook, Traffic Signals/Power Outage: treat the intersection as a four-way stop.","et":"คู่มือ: ไฟดับให้ถือเป็นทางแยกหยุดสี่ทาง","k":"text"},{"c":"rules","i":"sc_uncontrolled","q":"You and another driver arrive at a four-way stop at the same time. The other car is on your LEFT. What should you do?","qt":"คุณกับรถอีกคันถึงทางแยกหยุดสี่ทางพร้อมกัน รถอีกคันอยู่ทางซ้ายของคุณ ควรทำอย่างไร?","o":[["You go first; the driver on the left yields to the driver on the right","คุณไปก่อน คนทางซ้ายต้องให้ทางคนทางขวา"],["Let the car on your left go first","ให้รถทางซ้ายไปก่อน"],["Whoever is going straight always goes first","คนที่ไปตรงไปก่อนเสมอ"],["The larger vehicle goes first","รถใหญ่กว่าไปก่อน"]],"e":"Handbook, Intersections: if vehicles arrive at about the same time, each driver yields to the driver on their right.","et":"คู่มือ: ถ้ามาถึงพร้อมกัน ให้ทางรถทางขวา","k":"text"},{"c":"rules","i":"","q":"At a TWO-way stop, you are turning left and the driver across from you (also stopped) is going straight. Who should yield?","qt":"ที่ทางแยกหยุดสองทาง คุณจะเลี้ยวซ้าย และรถฝั่งตรงข้าม (หยุดเช่นกัน) จะไปตรง ใครต้องให้ทาง?","o":[["You; the turning vehicle yields to the vehicle going straight","คุณ รถที่เลี้ยวต้องให้ทางรถที่ไปตรง"],["The driver going straight","คนที่ไปตรง"],["Whoever stopped last","คนที่หยุดทีหลัง"],["The driver on the left","คนทางซ้าย"]],"e":"Handbook, Intersections: at a two-way stop, the turning vehicle yields to the vehicle going straight.","et":"คู่มือ: ที่ทางแยกหยุดสองทาง รถที่เลี้ยวให้ทางรถที่ไปตรง","k":"text"},{"c":"rules","i":"","q":"At an open intersection (no signs or signals), you must yield if:","qt":"ที่ทางแยกเปิด (ไม่มีป้ายหรือสัญญาณ) คุณต้องให้ทางเมื่อ:","o":[["A vehicle is already in the intersection","มีรถอยู่ในทางแยกแล้ว"],["You are on a state highway and the other car is on a secondary road","คุณอยู่บนทางหลวงรัฐและอีกคันอยู่ถนนรอง"],["You are on a paved road and the other is on a dirt road","คุณอยู่ถนนลาดยางและอีกคันอยู่ถนนดิน"],["You are going straight and the other is turning left","คุณไปตรงและอีกคันเลี้ยวซ้าย"]],"e":"Handbook, Open Intersections: yield if a vehicle is already in the intersection, you enter or cross a state highway from a secondary road, you enter a paved road from an unpaved road, or you turn left with a vehicle approaching from the opposite direction.","et":"คู่มือ: ให้ทางเมื่อมีรถอยู่ในทางแยก เมื่อเข้า/ข้ามทางหลวงรัฐจากถนนรอง เมื่อจากถนนไม่ลาดยางสู่ถนนลาดยาง หรือเลี้ยวซ้ายขณะมีรถสวน","k":"text"},{"c":"rules","i":"","q":"You are entering a paved road from a dirt (unpaved) road at an intersection with no signs. You must:","qt":"คุณจะออกจากถนนดินสู่ถนนลาดยางที่ทางแยกไม่มีป้าย คุณต้อง:","o":[["Yield to vehicles on the paved road","ให้ทางรถบนถนนลาดยาง"],["Go first because you are on the right","ไปก่อนเพราะอยู่ทางขวา"],["Go first if you arrived first, regardless of road type","ไปก่อนถ้ามาถึงก่อน ไม่ว่าถนนแบบใด"],["Honk and enter carefully","บีบแตรแล้วเข้าระวังๆ"]],"e":"Handbook, Open Intersections: you must yield if you are entering a paved road from an unpaved road.","et":"คู่มือ: ต้องให้ทางเมื่อออกจากถนนไม่ลาดยางสู่ถนนลาดยาง","k":"text"},{"c":"rules","i":"","q":"You hear a siren and see an ambulance with flashing lights coming up behind you. Florida law requires you to:","qt":"คุณได้ยินไซเรนและเห็นรถพยาบาลเปิดไฟกะพริบมาข้างหลัง กฎหมายฟลอริดากำหนดให้:","o":[["Pull over to the closest edge of the roadway and stop until it passes, without blocking an intersection","ชิดขอบถนนที่ใกล้ที่สุดและหยุดจนกว่าจะผ่าน โดยไม่ขวางทางแยก"],["Slow to 20 mph below the speed limit and keep driving","ลดความเร็ว 20 ไมล์ต่ำกว่าจำกัดแล้วขับต่อ"],["Speed up to stay ahead of it","เร่งหนีไปข้างหน้า"],["Stop immediately in your lane, even in an intersection","หยุดทันทีในเลน แม้อยู่ในทางแยก"]],"e":"Handbook, Emergency Vehicles: yield; pull over to the closest edge of the roadway immediately and stop until the emergency vehicle has passed. Do not block intersections.","et":"คู่มือ: ชิดขอบถนนที่ใกล้ที่สุดทันทีและหยุดจนรถฉุกเฉินผ่าน อย่าขวางทางแยก","k":"text"},{"c":"rules","i":"sc_moveover","q":"You are on a four-lane interstate. A tow truck with flashing lights is stopped on the right shoulder. Traffic beside you prevents you from changing lanes. The limit is 70 mph. What must you do?","qt":"คุณอยู่บนทางด่วนสี่เลน รถลากเปิดไฟกะพริบจอดบนไหล่ทางขวา รถข้างๆ ทำให้เปลี่ยนเลนไม่ได้ จำกัด 70 ไมล์/ชม. ต้องทำอย่างไร?","o":[["Slow down to 50 mph","ลดความเร็วเหลือ 50 ไมล์/ชม."],["Slow down to 55 mph","ลดเหลือ 55 ไมล์/ชม."],["Slow down to 60 mph","ลดเหลือ 60 ไมล์/ชม."],["Nothing; the Move Over Law does not apply to tow trucks","ไม่ต้องทำอะไร กฎ Move Over ไม่ใช้กับรถลาก"]],"e":"Handbook, Move Over Law: tow trucks are covered. If you cannot move over safely, slow to 20 MPH below the posted limit (70 − 20 = 50).","et":"คู่มือ: รถลากได้รับความคุ้มครอง ถ้าย้ายเลนไม่ได้ ให้ลด 20 ไมล์ต่ำกว่าจำกัด (70−20=50)","k":"text"},{"c":"rules","i":"","q":"On a two-lane road posted at 45 mph, you approach a stopped sanitation truck with flashing lights. You must slow to:","qt":"บนถนนสองเลนจำกัด 45 ไมล์/ชม. คุณเข้าใกล้รถเก็บขยะจอดเปิดไฟกะพริบ ต้องลดความเร็วเหลือ:","o":[["25 mph","25 ไมล์/ชม."],["35 mph","35 ไมล์/ชม."],["30 mph","30 ไมล์/ชม."],["5 mph","5 ไมล์/ชม."]],"e":"Handbook, Move Over Law (two-lane roadway): slow to 20 MPH below the posted limit (45 − 20 = 25); 5 MPH only if the limit is 20 MPH or less.","et":"คู่มือ: ถนนสองเลน ลด 20 ไมล์ต่ำกว่าจำกัด (45−20=25) ใช้ 5 ไมล์/ชม. เมื่อจำกัด 20 หรือน้อยกว่า","k":"text"},{"c":"rules","i":"","q":"On a residential street posted at 20 mph, a utility truck is stopped with its warning lights flashing. Under the Move Over Law you must travel at:","qt":"บนถนนในหมู่บ้านจำกัด 20 ไมล์/ชม. มีรถสาธารณูปโภคจอดเปิดไฟเตือน ตามกฎ Move Over ต้องขับที่:","o":[["5 mph","5 ไมล์/ชม."],["10 mph","10 ไมล์/ชม."],["15 mph","15 ไมล์/ชม."],["0 mph; you must stop","0 คือต้องหยุด"]],"e":"Handbook, Move Over Law: if the speed limit is 20 MPH or less, you must travel at 5 MPH.","et":"คู่มือ: ถ้าจำกัด 20 ไมล์/ชม. หรือน้อยกว่า ต้องขับ 5 ไมล์/ชม.","k":"text"},{"c":"rules","i":"","q":"A disabled car is stopped on the shoulder with its hazard lights on and a person standing beside it. Does Florida's Move Over Law apply?","qt":"รถเสียจอดบนไหล่ทาง เปิดไฟฉุกเฉินและมีคนยืนข้างรถ กฎ Move Over ของฟลอริดาใช้หรือไม่?","o":[["Yes; move over a lane or slow to 20 mph below the limit","ใช้ ต้องย้ายเลนหรือลด 20 ไมล์ต่ำกว่าจำกัด"],["No; it only applies to police and ambulances","ไม่ ใช้กับตำรวจและรถพยาบาลเท่านั้น"],["No; it only applies to vehicles with red or blue lights","ไม่ ใช้กับรถไฟแดง/น้ำเงินเท่านั้น"],["Only if the driver waves you over","ใช้เฉพาะเมื่อคนขับโบกมือ"]],"e":"Handbook, Move Over Law: also protects disabled vehicles stopped and displaying hazard lights, using flares or signage, or where persons are visibly present.","et":"คู่มือ: คุ้มครองรถเสียที่เปิดไฟฉุกเฉิน ใช้พลุ/ป้าย หรือมีคนอยู่ให้เห็น","k":"text"},{"c":"rules","i":"","q":"You are in the LEFT lane of a multi-lane road and a driver in the right lane needs to move over for a stopped police car. You should:","qt":"คุณอยู่เลนซ้ายของถนนหลายเลน รถเลนขวาต้องย้ายเลนหลบรถตำรวจที่จอด คุณควร:","o":[["Be prepared to let that driver move into your lane","เตรียมให้รถคันนั้นย้ายเข้าเลนคุณ"],["Speed up to close the gap so they cannot merge","เร่งปิดช่องไม่ให้เข้า"],["Stop in your lane until the police car leaves","หยุดในเลนจนรถตำรวจออกไป"],["Move onto the left shoulder","ขับขึ้นไหล่ทางซ้าย"]],"e":"Handbook, Move Over Law: drivers not in the lane closest to the stationary vehicle should be prepared to allow those who are about to move over into their lane.","et":"คู่มือ: ผู้ขับที่ไม่ได้อยู่เลนใกล้รถที่จอดควรเตรียมให้รถอื่นย้ายเข้ามา","k":"text"},{"c":"rules","i":"","q":"A funeral procession is passing through an intersection. The lead car went through on green, and now your light is green but the procession is still crossing. You should:","qt":"ขบวนศพกำลังผ่านทางแยก รถนำผ่านไปตอนไฟเขียว ตอนนี้ไฟคุณเขียวแต่ขบวนยังผ่านอยู่ คุณควร:","o":[["Yield and wait; vehicles in the procession may continue through regardless of the signal","ให้ทางและรอ รถในขบวนผ่านต่อได้โดยไม่สนสัญญาณ"],["Go, because you have a green light","ไป เพราะไฟเขียว"],["Drive between the procession vehicles carefully","ขับแทรกระหว่างรถในขบวนอย่างระวัง"],["Honk to let them know your light is green","บีบแตรบอกว่าไฟคุณเขียว"]],"e":"Handbook, Funeral Processions: when the lead vehicle enters an intersection, the remaining vehicles may follow through regardless of traffic control devices; yield and don't drive between them.","et":"คู่มือ: เมื่อรถนำเข้าทางแยก รถที่เหลือผ่านตามได้โดยไม่สนสัญญาณ ให้ทางและห้ามแทรก","k":"text"},{"c":"rules","i":"sc_busdivided","q":"A school bus is stopped with its stop arm out on the other side of a divided highway. The median is a grass strip about 10 feet wide. You are going the opposite direction. You must:","qt":"รถโรงเรียนจอดกางป้ายหยุดอยู่อีกฝั่งของทางหลวงที่มีเกาะกลางเป็นหญ้ากว้างประมาณ 10 ฟุต คุณขับสวนทาง ต้อง:","o":[["Proceed with caution; you are not required to stop","ไปต่ออย่างระวัง ไม่ต้องหยุด"],["Stop until the stop arm is withdrawn","หยุดจนกว่าป้ายหยุดจะพับ"],["Stop, then proceed at 10 mph","หยุดแล้วไปต่อ 10 ไมล์/ชม."],["Stop only if children are visible","หยุดเฉพาะเมื่อเห็นเด็ก"]],"e":"Handbook, School Buses: if the highway is divided by a raised barrier or an unpaved median at least five feet wide, traffic moving in the opposite direction does not have to stop.","et":"คู่มือ: ถ้ามีแผงกั้นยกสูงหรือเกาะกลางไม่ลาดยางกว้างอย่างน้อย 5 ฟุต รถสวนทางไม่ต้องหยุด","k":"text"},{"c":"rules","i":"sc_bus2way","q":"A school bus stops with its stop arm out on a five-lane road whose center lane is a painted two-way left-turn lane. You are coming from the opposite direction. You must:","qt":"รถโรงเรียนจอดกางป้ายบนถนนห้าเลนที่เลนกลางเป็นเลนเลี้ยวซ้ายแบบทาสี คุณมาจากทิศตรงข้าม ต้อง:","o":[["Stop; painted lines are not a barrier","หยุด เส้นทาสีไม่ถือเป็นแผงกั้น"],["Keep going; five lanes count as a divided highway","ไปต่อ ห้าเลนถือเป็นทางแบ่ง"],["Slow to 20 mph and pass","ลดเหลือ 20 ไมล์/ชม. แล้วผ่าน"],["Stop only if you are in the lane next to the center lane","หยุดเฉพาะถ้าอยู่เลนติดเลนกลาง"]],"e":"Handbook, School Buses: painted lines or pavement markings are not considered barriers; on a road paved across, traffic in both directions must stop.","et":"คู่มือ: เส้นทาสีไม่ถือเป็นแผงกั้น ถนนลาดยางตลอดแนวต้องหยุดทั้งสองทิศ","k":"text"},{"c":"rules","i":"","q":"You are driving BEHIND a school bus on a divided highway with a raised concrete median. The bus stops and extends its stop arm. You must:","qt":"คุณขับตามหลังรถโรงเรียนบนทางหลวงมีเกาะกลางคอนกรีตยกสูง รถโรงเรียนจอดกางป้ายหยุด คุณต้อง:","o":[["Stop and remain stopped until the stop signal is withdrawn","หยุดและรอจนป้ายหยุดพับ"],["Pass on the left, since a median divides the road","แซงซ้ายได้เพราะมีเกาะกลาง"],["Slow to 5 mph and pass carefully","ลดเหลือ 5 ไมล์/ชม. แล้วผ่านระวังๆ"],["Stop, then pass once the doors close","หยุด แล้วแซงเมื่อประตูปิด"]],"e":"Handbook, School Buses: you must always stop if you are moving in the same direction as the bus.","et":"คู่มือ: ต้องหยุดเสมอถ้าขับทิศทางเดียวกับรถโรงเรียน","k":"text"},{"c":"fines","i":"","q":"Passing a stopped school bus (no injury) adds how many points to your Florida driving record?","qt":"การแซงรถโรงเรียนที่จอดอยู่ (ไม่มีผู้บาดเจ็บ) ได้แต้มกี่แต้ม?","o":[["4 points","4 แต้ม"],["3 points","3 แต้ม"],["6 points","6 แต้ม"],["2 points","2 แต้ม"]],"e":"Handbook, Points table: passing a stopped school bus 4 points; resulting in serious injury or death 6 points.","et":"คู่มือ: แซงรถโรงเรียนที่จอด 4 แต้ม; ทำให้บาดเจ็บสาหัส/เสียชีวิต 6 แต้ม","k":"text"},{"c":"rules","i":"","q":"A crossing guard and children are in the crosswalk in a school zone. Where must you stop?","qt":"มีครูจราจรและเด็กอยู่ในทางม้าลายในเขตโรงเรียน ต้องหยุดที่ใด?","o":[["At the stop line, not in the crosswalk","ที่เส้นหยุด ไม่ใช่ในทางม้าลาย"],["Just inside the crosswalk so you can go quickly","ล้ำเข้าทางม้าลายเล็กน้อยเพื่อไปได้เร็ว"],["Anywhere, as long as you slow to 20 mph","ที่ใดก็ได้ถ้าลดเหลือ 20 ไมล์/ชม."],["50 feet before the crosswalk","50 ฟุตก่อนทางม้าลาย"]],"e":"Handbook, School Crossings: when children or crossing guards are present in a crosswalk, you must yield and stop at the stop line and not in the crosswalk.","et":"คู่มือ: เมื่อมีเด็กหรือครูจราจรในทางม้าลาย ต้องหยุดที่เส้นหยุด ไม่ใช่ในทางม้าลาย","k":"text"},{"c":"rules","i":"sc_rrgates","q":"When you must stop for a train at a railroad crossing, how close to the crossing may you stop?","qt":"เมื่อต้องหยุดให้รถไฟที่จุดตัด หยุดใกล้จุดตัดได้แค่ไหน?","o":[["No closer than 15 feet (stop within 15 to 50 feet)","ไม่ใกล้กว่า 15 ฟุต (หยุดในระยะ 15–50 ฟุต)"],["No closer than 5 feet","ไม่ใกล้กว่า 5 ฟุต"],["No closer than 10 feet","ไม่ใกล้กว่า 10 ฟุต"],["No closer than 100 feet","ไม่ใกล้กว่า 100 ฟุต"]],"e":"Handbook, Railroad Crossings: do not stop on the tracks or within 15 feet of the crossing. (Florida law: stop within 50 feet but not less than 15 feet from the nearest rail.)","et":"คู่มือ: ห้ามหยุดบนรางหรือภายใน 15 ฟุต (กฎหมาย: หยุดภายใน 50 ฟุตแต่ไม่น้อยกว่า 15 ฟุต)","k":"text"},{"c":"rules","i":"","q":"At a railroad crossing with flashing lights, the gate is rising but the lights are still flashing. You should:","qt":"ที่จุดตัดรถไฟมีไฟกะพริบ ไม้กั้นกำลังยกขึ้นแต่ไฟยังกะพริบ คุณควร:","o":[["Stay stopped; it is illegal to drive around or under a gate that is opening or closing","หยุดรอ ห้ามขับอ้อมหรือลอดไม้กั้นที่กำลังเปิด/ปิด"],["Go, because the gate is going up","ไปได้เพราะไม้กั้นยกขึ้น"],["Go if no train is visible in either direction","ไปถ้ามองไม่เห็นรถไฟ"],["Drive around the gate slowly","ขับอ้อมไม้กั้นช้าๆ"]],"e":"Handbook, Railroad Gates: it's against the law to drive around or under a crossing gate—either down or while being opened or closed.","et":"คู่มือ: ผิดกฎหมายที่จะขับอ้อมหรือลอดไม้กั้น ทั้งขณะลงอยู่หรือกำลังเปิด/ปิด","k":"text"},{"c":"rules","i":"R15-1","q":"You approach this crossbuck sign with no lights or gates. No train is in sight. You must:","qt":"คุณเข้าใกล้ป้ายกากบาทรถไฟนี้ที่ไม่มีไฟหรือไม้กั้น มองไม่เห็นรถไฟ คุณต้อง:","o":[["Slow down, look and listen, and be ready to stop; yield to any train","ลดความเร็ว มองและฟัง พร้อมหยุด ให้ทางรถไฟ"],["Always come to a complete stop, like a stop sign","หยุดสนิททุกครั้งเหมือนป้ายหยุด"],["Speed up to cross quickly","เร่งข้ามเร็วๆ"],["Proceed without slowing; no train is in sight","ไปต่อโดยไม่ชะลอ"]],"e":"Handbook: crossbuck signs are yield signs; slow down and be ready to stop. You must stop if devices flash, a gate is down, a flagger warns, or a train is clearly visible.","et":"คู่มือ: ป้ายกากบาทคือป้ายให้ทาง ชะลอและพร้อมหยุด ต้องหยุดถ้าไฟกะพริบ ไม้กั้นลง มีคนโบก หรือเห็นรถไฟ","k":"text"},{"c":"rules","i":"","q":"Traffic is backed up across a railroad track ahead, and there is no room for your car on the other side. You should:","qt":"รถติดยาวข้ามรางรถไฟข้างหน้า และไม่มีที่ว่างพอฝั่งตรงข้าม คุณควร:","o":[["Wait before the crossing until there is room to clear the tracks completely","รอก่อนถึงจุดตัดจนมีที่พอข้ามพ้นรางได้"],["Stop on the tracks; traffic will move soon","หยุดบนรางเดี๋ยวรถก็ขยับ"],["Drive onto the tracks and stop just past the first rail","ขับขึ้นรางแล้วหยุดพ้นรางแรก"],["Use the shoulder to go around the line","ใช้ไหล่ทางอ้อมแถว"]],"e":"Handbook, Railroad Crossings: do not stop on the railroad tracks; the DO NOT STOP ON TRACKS sign reinforces this.","et":"คู่มือ: ห้ามหยุดบนรางรถไฟ","k":"text"},{"c":"fines","i":"","q":"You may not park within how many feet of a railroad crossing?","qt":"ห้ามจอดรถภายในกี่ฟุตจากจุดตัดทางรถไฟ?","o":[["50 feet","50 ฟุต"],["15 feet","15 ฟุต"],["30 feet","30 ฟุต"],["20 feet","20 ฟุต"]],"e":"Handbook, Parking: it's against the law to park within 50 feet of a railroad crossing.","et":"คู่มือ: ห้ามจอดภายใน 50 ฟุตจากจุดตัดรถไฟ","k":"text"},{"c":"fines","i":"","q":"Which list of Florida no-parking distances is correct?","qt":"ระยะห้ามจอดในฟลอริดาข้อใดถูกต้อง?","o":[["Fire hydrant 15 ft; intersection 20 ft; stop sign 30 ft","หัวดับเพลิง 15; ทางแยก 20; ป้ายหยุด 30 ฟุต"],["Fire hydrant 10 ft; intersection 20 ft; stop sign 30 ft","หัวดับเพลิง 10; ทางแยก 20; ป้ายหยุด 30"],["Fire hydrant 15 ft; intersection 30 ft; stop sign 20 ft","หัวดับเพลิง 15; ทางแยก 30; ป้ายหยุด 20"],["Fire hydrant 20 ft; intersection 15 ft; stop sign 50 ft","หัวดับเพลิง 20; ทางแยก 15; ป้ายหยุด 50"]],"e":"Handbook, Parking: within 15 ft of a fire hydrant, 20 ft of an intersection, 30 ft of any flashing signal, stop sign or traffic signal, 50 ft of a railroad crossing.","et":"คู่มือ: หัวดับเพลิง 15, ทางแยก 20, ไฟกะพริบ/ป้ายหยุด/สัญญาณไฟ 30, จุดตัดรถไฟ 50 ฟุต","k":"text"},{"c":"fines","i":"","q":"You may not park within how many feet of an intersection?","qt":"ห้ามจอดภายในกี่ฟุตจากทางแยก?","o":[["20 feet","20 ฟุต"],["15 feet","15 ฟุต"],["25 feet","25 ฟุต"],["30 feet","30 ฟุต"]],"e":"Handbook, Parking: within 20 feet of an intersection.","et":"คู่มือ: ห้ามจอดภายใน 20 ฟุตจากทางแยก","k":"text"},{"c":"fines","i":"","q":"You may not park within how many feet of a traffic signal, stop sign, or flashing signal?","qt":"ห้ามจอดภายในกี่ฟุตจากสัญญาณไฟจราจร ป้ายหยุด หรือไฟกะพริบ?","o":[["30 feet","30 ฟุต"],["20 feet","20 ฟุต"],["15 feet","15 ฟุต"],["50 feet","50 ฟุต"]],"e":"Handbook, Parking: within 30 feet of any flashing signal, stop sign, or traffic signal.","et":"คู่มือ: ห้ามจอดภายใน 30 ฟุตจากไฟกะพริบ ป้ายหยุด หรือสัญญาณไฟ","k":"text"},{"c":"fines","i":"","q":"On a state highway between 8 a.m. and 6 p.m., you may not park within how many feet of a rural mailbox?","qt":"บนทางหลวงรัฐ ช่วง 8 โมงเช้าถึง 6 โมงเย็น ห้ามจอดภายในกี่ฟุตจากตู้ไปรษณีย์ชนบท?","o":[["30 feet","30 ฟุต"],["15 feet","15 ฟุต"],["20 feet","20 ฟุต"],["50 feet","50 ฟุต"]],"e":"Handbook, Parking: within 30 feet of a rural mailbox on a state highway (8 am–6 pm).","et":"คู่มือ: ห้ามจอดภายใน 30 ฟุตจากตู้ไปรษณีย์ชนบทบนทางหลวงรัฐ (8:00–18:00)","k":"text"},{"c":"fines","i":"","q":"You may not park within how many feet of the entrance to a fire, ambulance, or rescue station?","qt":"ห้ามจอดภายในกี่ฟุตจากทางเข้าสถานีดับเพลิง รถพยาบาล หรือกู้ภัย?","o":[["20 feet","20 ฟุต"],["15 feet","15 ฟุต"],["30 feet","30 ฟุต"],["50 feet","50 ฟุต"]],"e":"Handbook, Parking: within 20 feet of the entrance to a fire, ambulance, or rescue station.","et":"คู่มือ: ห้ามจอดภายใน 20 ฟุตจากทางเข้าสถานีดับเพลิง/รถพยาบาล/กู้ภัย","k":"text"},{"c":"rules","i":"","q":"You are parking UPHILL on a street WITH a curb. Which way should you turn your front wheels?","qt":"คุณจอดขึ้นเนินบนถนนที่มีขอบทาง ควรหันล้อหน้าไปทางใด?","o":[["Away from the curb (to the left)","ออกจากขอบทาง (ไปทางซ้าย)"],["Toward the curb (to the right)","เข้าหาขอบทาง (ไปทางขวา)"],["Straight ahead","ตรง"],["Toward the curb, the same as downhill","เข้าหาขอบทาง เหมือนลงเนิน"]],"e":"Handbook, Parking on Hills: uphill with curb—turn wheels away from curb; downhill—turn wheels to curb; uphill without curb—turn wheels to the right.","et":"คู่มือ: ขึ้นเนินมีขอบ—หันล้อออกจากขอบ; ลงเนิน—หันเข้าขอบ; ขึ้นเนินไม่มีขอบ—หันขวา","k":"text"},{"c":"rules","i":"","q":"You are parking UPHILL on a road with NO curb. Turn your front wheels:","qt":"คุณจอดขึ้นเนินบนถนนไม่มีขอบทาง ให้หันล้อหน้า:","o":[["To the right (toward the edge of the road)","ไปทางขวา (เข้าหาขอบถนน)"],["To the left (toward traffic)","ไปทางซ้าย (เข้าหาการจราจร)"],["Straight ahead","ตรง"],["Away from the edge of the road","ออกจากขอบถนน"]],"e":"Handbook, Parking on Hills: uphill without curb—turn wheels to the right so the car rolls away from traffic.","et":"คู่มือ: ขึ้นเนินไม่มีขอบ—หันล้อไปทางขวา ให้รถไหลออกจากการจราจร","k":"text"},{"c":"rules","i":"","q":"Your vehicle breaks down on a limited access highway (interstate). Florida rules say you must:","qt":"รถเสียบนทางด่วน (Interstate) กฎฟลอริดาให้:","o":[["Move it completely off the pavement; it may stay no more than 6 hours","ย้ายออกจากผิวทางทั้งหมด จอดได้ไม่เกิน 6 ชั่วโมง"],["Leave it in the right lane with hazard lights on","ทิ้งไว้ในเลนขวาเปิดไฟฉุกเฉิน"],["Back up along the shoulder to the last exit","ถอยตามไหล่ทางไปทางออกล่าสุด"],["Move it onto the median and leave it up to 24 hours","ย้ายไปเกาะกลางและทิ้งได้ 24 ชั่วโมง"]],"e":"Handbook, Limited Access Highways: if your vehicle breaks down, move it completely off the pavement (no more than six hours). Never park on the median.","et":"คู่มือ: ย้ายรถออกจากผิวทางทั้งหมด (ไม่เกิน 6 ชั่วโมง) ห้ามจอดบนเกาะกลาง","k":"text"},{"c":"rules","i":"","q":"You see red reflectors facing you on the lane lines. This means:","qt":"คุณเห็นแผ่นสะท้อนแสงสีแดงหันมาทางคุณบนเส้นแบ่งเลน หมายความว่า:","o":[["You are on the wrong side of the road; get into the proper lane or turn around immediately","คุณอยู่ผิดฝั่ง ต้องเข้าเลนที่ถูกหรือกลับรถทันที"],["You are approaching a toll plaza","กำลังเข้าใกล้ด่านเก็บเงิน"],["The lane is an HOV lane","เลนนี้คือเลน HOV"],["A work zone begins ahead","เขตก่อสร้างเริ่มข้างหน้า"]],"e":"Handbook, Red Reflectors on Lane Lines: they always mean you are facing traffic the wrong way.","et":"คู่มือ: แผ่นสะท้อนแดงหมายถึงคุณขับย้อนศร","k":"text"},{"c":"rules","i":"","q":"The ONLY time you may back up on an interstate entrance or exit ramp is when:","qt":"ครั้งเดียวที่คุณถอยบนทางลาดขึ้น/ลงทางด่วนได้คือ:","o":[["You see a WRONG WAY or DO NOT ENTER sign or red reflectors","เห็นป้าย WRONG WAY หรือ DO NOT ENTER หรือแผ่นสะท้อนแดง"],["You took the wrong exit","ออกผิดทาง"],["Traffic on the ramp is stopped","รถบนทางลาดหยุดนิ่ง"],["You are within 100 feet of the start of the ramp","อยู่ห่างจุดเริ่มทางลาดไม่ถึง 100 ฟุต"]],"e":"Handbook: never back up on a ramp; the ONLY exception is if you see a WRONG WAY or DO NOT ENTER sign or red reflectors—then back up or turn around.","et":"คู่มือ: ห้ามถอยบนทางลาด ยกเว้นเห็นป้าย WRONG WAY/DO NOT ENTER หรือแผ่นสะท้อนแดง","k":"text"},{"c":"rules","i":"","q":"You are on the interstate in the right lane and a car is merging from the on-ramp. You should:","qt":"คุณขับเลนขวาบนทางด่วน มีรถกำลังเข้าจากทางลาด ควร:","o":[["Adjust your speed or move over so it can enter safely","ปรับความเร็วหรือย้ายเลนให้เขาเข้าได้อย่างปลอดภัย"],["Speed up so it has to merge behind you","เร่งให้เขาต้องเข้าข้างหลัง"],["Stop in the right lane to let it in","หยุดในเลนขวาให้เข้า"],["Hold your speed; merging cars must always stop and wait","คงความเร็ว รถที่เข้าต้องหยุดรอเสมอ"]],"e":"Handbook, Limited Access Highway reminders: while in the right lane, watch for cars entering; adjust your speed or move over so they can enter safely.","et":"คู่มือ: ในเลนขวา ระวังรถเข้า ปรับความเร็วหรือย้ายเลน","k":"text"},{"c":"rules","i":"","q":"When parking on a public street and leaving your car, Florida law requires you to:","qt":"เมื่อจอดบนถนนสาธารณะและออกจากรถ กฎหมายฟลอริดากำหนดให้:","o":[["Stop the engine, set the brake, and remove the key","ดับเครื่อง ดึงเบรกมือ และถอดกุญแจ"],["Leave the engine running if gone less than 5 minutes","ติดเครื่องไว้ได้ถ้าไปไม่เกิน 5 นาที"],["Turn on your hazard lights","เปิดไฟฉุกเฉิน"],["Leave the key in case it must be moved","ทิ้งกุญแจไว้เผื่อต้องย้ายรถ"]],"e":"Handbook, Parking: set the parking brake, shift to Park, turn off the engine and lock the vehicle; Florida law requires that you take the keys out before leaving it.","et":"คู่มือ: ดึงเบรกมือ เข้าเกียร์ P ดับเครื่อง ล็อกรถ และต้องถอดกุญแจก่อนออกจากรถ","k":"text"},{"c":"rules","i":"","q":"Florida law requires you to signal for at least how far before turning?","qt":"กฎหมายฟลอริดากำหนดให้เปิดไฟเลี้ยวอย่างน้อยกี่ฟุตก่อนเลี้ยว?","o":[["100 feet","100 ฟุต"],["50 feet","50 ฟุต"],["200 feet","200 ฟุต"],["300 feet","300 ฟุต"]],"e":"Handbook, Turning: you must give a turn signal at least 100 feet BEFORE making your turn.","et":"คู่มือ: ต้องเปิดไฟเลี้ยวอย่างน้อย 100 ฟุตก่อนเลี้ยว","k":"text"},{"c":"rules","i":"","q":"The driver ahead of you turns on a left turn signal to tell you it is safe to pass. In Florida this is:","qt":"คนขับข้างหน้าเปิดไฟเลี้ยวซ้ายเพื่อบอกว่าคุณแซงได้ ในฟลอริดาการกระทำนี้:","o":[["Against the law","ผิดกฎหมาย"],["Required on two-lane roads","จำเป็นบนถนนสองเลน"],["Allowed only at night","ทำได้เฉพาะกลางคืน"],["Allowed for trucks only","ทำได้เฉพาะรถบรรทุก"]],"e":"Handbook, Turning: it's against the law to use your directional signals to tell drivers behind you that they can pass.","et":"คู่มือ: ห้ามใช้ไฟเลี้ยวบอกรถข้างหลังว่าแซงได้","k":"text"},{"c":"rules","i":"","q":"Hand signals must be given from which side of the vehicle?","qt":"สัญญาณมือต้องให้จากด้านใดของรถ?","o":[["The left side","ด้านซ้าย"],["The right side","ด้านขวา"],["Either side","ด้านใดก็ได้"],["The side you are turning toward","ด้านที่จะเลี้ยวไป"]],"e":"Handbook, Turning: hand signals must be given from the left side of the vehicle (bicyclists may use the right arm for a right turn).","et":"คู่มือ: สัญญาณมือต้องให้จากด้านซ้ายของรถ","k":"text"},{"c":"rules","i":"","q":"On a two-lane road you must NOT pass within how many feet of an intersection, bridge, tunnel, or railroad crossing?","qt":"บนถนนสองเลน ห้ามแซงภายในกี่ฟุตจากทางแยก สะพาน อุโมงค์ หรือจุดตัดรถไฟ?","o":[["100 feet","100 ฟุต"],["50 feet","50 ฟุต"],["200 feet","200 ฟุต"],["500 feet","500 ฟุต"]],"e":"Handbook, You Must Not Pass: within 100 feet of an intersection, bridge, viaduct, tunnel, or railroad crossing.","et":"คู่มือ: ห้ามแซงภายใน 100 ฟุตจากทางแยก สะพาน อุโมงค์ จุดตัดรถไฟ","k":"text"},{"c":"rules","i":"","q":"You must not pass on a hill or curve where you cannot see at least how far ahead?","qt":"ห้ามแซงบนเนินหรือทางโค้งที่มองไม่เห็นข้างหน้าอย่างน้อยกี่ฟุต?","o":[["500 feet","500 ฟุต"],["100 feet","100 ฟุต"],["200 feet","200 ฟุต"],["1,000 feet","1,000 ฟุต"]],"e":"Handbook, You Must Not Pass: on hills or curves where you can't see at least 500 feet ahead.","et":"คู่มือ: ห้ามแซงบนเนิน/โค้งที่มองไม่เห็นอย่างน้อย 500 ฟุต","k":"text"},{"c":"rules","i":"","q":"After passing on a two-lane road, you must be back on the right side before coming within how many feet of an oncoming vehicle?","qt":"หลังแซงบนถนนสองเลน ต้องกลับฝั่งขวาก่อนเข้าใกล้รถสวนทางกี่ฟุต?","o":[["200 feet","200 ฟุต"],["100 feet","100 ฟุต"],["300 feet","300 ฟุต"],["500 feet","500 ฟุต"]],"e":"Handbook, Passing: you must return to the right side of the road before coming within 200 feet of any approaching vehicle.","et":"คู่มือ: ต้องกลับฝั่งขวาก่อนเข้าใกล้รถสวนทาง 200 ฟุต","k":"text"},{"c":"rules","i":"","q":"After passing a car, when should you return to the right lane?","qt":"หลังแซงรถ เมื่อใดควรกลับเข้าเลนขวา?","o":[["When you can see the tires of the passed vehicle in your rear-view mirror","เมื่อเห็นยางรถคันที่แซงในกระจกมองหลัง"],["As soon as your front bumper is past its front bumper","ทันทีที่กันชนหน้าคุณพ้นกันชนหน้าเขา"],["When the passed driver flashes their lights","เมื่อคนที่ถูกแซงกะพริบไฟ"],["When you can see its side mirror next to you","เมื่อเห็นกระจกข้างเขาข้างๆ คุณ"]],"e":"Handbook, Passing step 5: do not return until you can see the tires of the vehicle you passed in your rear-view mirror; signal first.","et":"คู่มือ: อย่ากลับเลนจนเห็นยางรถที่แซงในกระจกมองหลัง และเปิดไฟก่อน","k":"text"},{"c":"rules","i":"","q":"Another driver is passing you on a two-lane road. What should you do?","qt":"มีรถกำลังแซงคุณบนถนนสองเลน ควรทำอย่างไร?","o":[["Do not speed up; move to the right side of your lane","อย่าเร่ง ขยับชิดขวาของเลน"],["Speed up slightly so the pass is shorter","เร่งเล็กน้อยให้แซงเร็วขึ้น"],["Move to the left side of your lane","ขยับชิดซ้ายของเลน"],["Brake hard so they can get in quickly","เบรกแรงให้เขาเข้าเร็ว"]],"e":"Handbook, Being Passed: do not increase your speed; move to the right side of your lane.","et":"คู่มือ: อย่าเพิ่มความเร็ว ขยับชิดขวาของเลน","k":"text"},{"c":"rules","i":"","q":"You are driving in the left lane of a multi-lane highway at the speed limit, and a faster car comes up behind you. Florida law says you must:","qt":"คุณขับเลนซ้ายบนทางหลวงหลายเลนที่ความเร็วจำกัด มีรถเร็วกว่ามาข้างหลัง กฎหมายฟลอริดาให้:","o":[["Move out of the left lane when it is safe","ออกจากเลนซ้ายเมื่อปลอดภัย"],["Stay in the left lane because you are at the speed limit","อยู่เลนซ้ายต่อเพราะขับตามจำกัด"],["Tap your brakes to warn the driver","แตะเบรกเตือน"],["Speed up above the limit to keep pace","เร่งเกินจำกัดให้ทัน"]],"e":"Handbook: Florida law states a driver must move out of the left lane when being overtaken from behind by a vehicle traveling at a faster speed.","et":"คู่มือ: ต้องออกจากเลนซ้ายเมื่อมีรถเร็วกว่าตามมา","k":"text"},{"c":"rules","i":"","q":"Passing on the RIGHT is legal only when:","qt":"การแซงทางขวาถูกกฎหมายเฉพาะเมื่อ:","o":[["There are two or more lanes moving in your direction, or the vehicle ahead is turning left","มีสองเลนขึ้นไปในทิศเดียวกัน หรือรถข้างหน้ากำลังเลี้ยวซ้าย"],["The shoulder is paved and wide enough","ไหล่ทางลาดยางและกว้างพอ"],["The vehicle ahead is going under the speed limit","รถข้างหน้าขับช้ากว่าจำกัด"],["You signal and tap your horn first","เปิดไฟและแตะแตรก่อน"]],"e":"Handbook, Passing on the Right: only legal with two or more lanes moving in the same direction or when the vehicle you are passing is making a left turn.","et":"คู่มือ: แซงขวาได้เมื่อมีสองเลนขึ้นไปทิศเดียวกัน หรือรถคันหน้าเลี้ยวซ้าย","k":"text"},{"c":"rules","i":"sc_ped","q":"A car in the lane next to you has stopped at a crosswalk on a multi-lane road. You should:","qt":"รถในเลนข้างคุณหยุดที่ทางม้าลายบนถนนหลายเลน คุณควร:","o":[["Stop too; a pedestrian may be crossing in front of it","หยุดด้วย อาจมีคนเดินข้ามหน้ารถคันนั้น"],["Pass it carefully at reduced speed","แซงอย่างระวังด้วยความเร็วต่ำ"],["Tap your horn and continue","แตะแตรแล้วไปต่อ"],["Change to the far lane and pass","เปลี่ยนไปเลนไกลแล้วแซง"]],"e":"Handbook, You Must Not Pass: at crosswalks where a vehicle has stopped to allow a pedestrian to cross.","et":"คู่มือ: ห้ามแซงที่ทางม้าลายที่มีรถหยุดให้คนข้าม","k":"text"},{"c":"rules","i":"","q":"When passing a bicyclist, Florida law requires a minimum clearance of:","qt":"เมื่อแซงจักรยาน กฎหมายฟลอริดากำหนดระยะห่างอย่างน้อย:","o":[["3 feet","3 ฟุต"],["2 feet","2 ฟุต"],["4 feet","4 ฟุต"],["5 feet","5 ฟุต"]],"e":"Handbook, Sharing the Road: Florida law requires that you give bicyclists a minimum of three feet of clearance.","et":"คู่มือ: ต้องเว้นระยะจากจักรยานอย่างน้อย 3 ฟุต","k":"text"},{"c":"rules","i":"pm_dyellow","q":"This road has double solid yellow center lines. A bicyclist is riding slowly ahead and there is no oncoming traffic. Which is true?","qt":"ถนนนี้มีเส้นเหลืองทึบคู่ มีจักรยานขี่ช้าๆ ข้างหน้าและไม่มีรถสวน ข้อใดถูก?","o":[["You may cross to pass the bicyclist when it is safe","ข้ามเส้นเพื่อแซงจักรยานได้เมื่อปลอดภัย"],["You may never cross double yellow lines for any reason","ห้ามข้ามเส้นเหลืองคู่ไม่ว่ากรณีใด"],["You may pass any slow vehicle if no one is coming","แซงรถช้าคันไหนก็ได้ถ้าไม่มีรถสวน"],["You must follow the bicyclist until the line becomes broken white","ต้องตามจักรยานจนเป็นเส้นขาวประ"]],"e":"Handbook, Double Yellow Lines: vehicles must not pass/cross; they may turn left or pass a bicyclist when it is safe to do so.","et":"คู่มือ: ห้ามแซงข้ามเส้นเหลืองคู่ ยกเว้นเลี้ยวซ้ายหรือแซงจักรยานเมื่อปลอดภัย","k":"text"},{"c":"rules","i":"pm_solidbroken","q":"The yellow center line is BROKEN on your side and SOLID on the other side. This means:","qt":"เส้นกลางสีเหลืองเป็นเส้นประฝั่งคุณ และเส้นทึบฝั่งตรงข้าม หมายความว่า:","o":[["You may pass when safe; oncoming traffic may not","คุณแซงได้เมื่อปลอดภัย รถสวนแซงไม่ได้"],["Neither direction may pass","ห้ามแซงทั้งสองทิศ"],["Only oncoming traffic may pass","รถสวนเท่านั้นแซงได้"],["Both directions may pass","แซงได้ทั้งสองทิศ"]],"e":"Handbook: double yellow lines—broken on your side, solid on the left: passing is permitted in your lane when safe.","et":"คู่มือ: เส้นประฝั่งคุณ ทึบอีกฝั่ง: คุณแซงได้เมื่อปลอดภัย","k":"text"},{"c":"rules","i":"pm_whitesolid","q":"A single SOLID white line separates two lanes going your direction. Which is correct?","qt":"เส้นขาวทึบเส้นเดียวแบ่งสองเลนทิศเดียวกับคุณ ข้อใดถูก?","o":[["Do not cross it unless you must to avoid a hazard","อย่าข้ามเว้นแต่จำเป็นต้องหลบอันตราย"],["It separates traffic moving in opposite directions","แบ่งรถสวนทาง"],["You may cross it freely, like a broken line","ข้ามได้อิสระเหมือนเส้นประ"],["Crossing it is never allowed, even to avoid a hazard","ห้ามข้ามเด็ดขาดแม้หลบอันตราย"]],"e":"Handbook, White Lane Lines: single solid white—do not cross unless you must to avoid a hazard (also discourages lane changes near intersections); double solid white—lane changes not allowed.","et":"คู่มือ: เส้นขาวทึบ—อย่าข้ามเว้นแต่หลบอันตราย; ขาวทึบคู่—ห้ามเปลี่ยนเลน","k":"text"},{"c":"rules","i":"","q":"Double SOLID WHITE lines separate your lane from the lane beside you (both going your direction). You may:","qt":"เส้นขาวทึบคู่แบ่งเลนคุณกับเลนข้าง (ทิศเดียวกัน) คุณ:","o":[["Not change lanes across them","ห้ามเปลี่ยนเลนข้ามเส้น"],["Change lanes after signaling","เปลี่ยนเลนได้หลังเปิดไฟ"],["Cross them only to pass","ข้ามได้เพื่อแซงเท่านั้น"],["Cross them only at night","ข้ามได้เฉพาะกลางคืน"]],"e":"Handbook, White Lane Lines: double solid white lines—crossing/changing lanes is not allowed.","et":"คู่มือ: เส้นขาวทึบคู่—ห้ามข้าม/เปลี่ยนเลน","k":"text"},{"c":"rules","i":"pm_yellowedge","q":"On a divided highway or one-way street, a single solid YELLOW line along the road marks:","qt":"บนทางหลวงแบ่งหรือถนนเดินรถทางเดียว เส้นเหลืองทึบเส้นเดียวตามขอบถนนแสดง:","o":[["The left edge of the roadway","ขอบซ้ายของถนน"],["The right edge of the roadway","ขอบขวาของถนน"],["A no-passing zone for oncoming traffic","เขตห้ามแซงของรถสวน"],["A bicycle lane","เลนจักรยาน"]],"e":"Handbook, Edge Lines: single solid yellow marks the left edge on divided highways and one-way streets; single solid white marks the right edge.","et":"คู่มือ: เหลืองทึบ—ขอบซ้าย (ทางแบ่ง/ทางเดียว); ขาวทึบ—ขอบขวา","k":"text"},{"c":"rules","i":"","q":"On a three-lane or five-lane highway, the center lane is used:","qt":"บนทางหลวงสามหรือห้าเลน เลนกลางใช้สำหรับ:","o":[["Only for turning left","เลี้ยวซ้ายเท่านั้น"],["For passing in either direction","แซงได้ทั้งสองทิศ"],["For slow vehicles","รถช้า"],["As an acceleration lane for long distances","เลนเร่งความเร็วระยะไกล"]],"e":"Handbook, Traffic Lanes: the center lane of a three-lane or five-lane highway is used only for turning left.","et":"คู่มือ: เลนกลางของทางหลวงสาม/ห้าเลนใช้เลี้ยวซ้ายเท่านั้น","k":"text"},{"c":"rules","i":"","q":"On a road with four or more lanes carrying two-way traffic, you should drive:","qt":"บนถนนสี่เลนขึ้นไปที่เดินรถสองทาง ควรขับ:","o":[["In the right lanes, except when overtaking and passing","เลนขวา ยกเว้นขณะแซง"],["In the left lanes, which are faster","เลนซ้ายซึ่งเร็วกว่า"],["In any lane, as long as you stay under the limit","เลนใดก็ได้ถ้าไม่เกินจำกัด"],["In the lane closest to the center line","เลนที่ติดเส้นกลางถนน"]],"e":"Handbook: if the road has four or more lanes with two-way traffic, drive in the right lanes except when overtaking and passing.","et":"คู่มือ: ถนนสี่เลนขึ้นไปสองทาง ให้ขับเลนขวา ยกเว้นขณะแซง","k":"text"},{"c":"rules","i":"","q":"You are stopped at a red light on a one-way street and want to turn LEFT onto another one-way street whose traffic moves to the left. You may:","qt":"คุณหยุดไฟแดงบนถนนทางเดียว และจะเลี้ยวซ้ายเข้าถนนทางเดียวที่รถวิ่งไปทางซ้าย คุณ:","o":[["Turn after stopping, if no sign prohibits it, yielding to pedestrians and traffic","เลี้ยวได้หลังหยุด ถ้าไม่มีป้ายห้าม โดยให้ทางคนเดินและรถ"],["Never turn left on red in Florida","ห้ามเลี้ยวซ้ายไฟแดงในฟลอริดาเลย"],["Turn without stopping because it is one-way","เลี้ยวได้โดยไม่หยุดเพราะเป็นทางเดียว"],["Turn only when a green arrow appears","เลี้ยวได้เมื่อมีลูกศรเขียวเท่านั้น"]],"e":"Handbook, Red Light: you may turn left from a one-way street onto a one-way street that has traffic moving to the left (after stopping; yield).","et":"คู่มือ: เลี้ยวซ้ายจากถนนทางเดียวสู่ถนนทางเดียวที่รถไปทางซ้ายได้ (หลังหยุดและให้ทาง)","k":"text"},{"c":"rules","i":"sig_redarrow","q":"A steady RED ARROW is lit for the right-turn lane. There is no NO TURN ON RED sign. What may you do?","qt":"ลูกศรแดงติดค้างสำหรับเลนเลี้ยวขวา ไม่มีป้ายห้ามเลี้ยวไฟแดง คุณทำอะไรได้?","o":[["Stop, then turn right when the way is clear, yielding to pedestrians and traffic","หยุด แล้วเลี้ยวขวาเมื่อทางว่าง ให้ทางคนเดินและรถ"],["Turn right without stopping","เลี้ยวขวาโดยไม่ต้องหยุด"],["You may not turn right until the arrow turns green","เลี้ยวขวาไม่ได้จนลูกศรเป็นเขียว"],["Turn right only if a police officer waves you on","เลี้ยวเฉพาะเมื่อตำรวจโบก"]],"e":"Handbook, Red Arrow: after stopping, you may turn right if there is not a NO TURN ON RED sign and the way is clear; yield to pedestrians and oncoming traffic.","et":"คู่มือ: ลูกศรแดง—หลังหยุด เลี้ยวขวาได้ถ้าไม่มีป้ายห้ามและทางว่าง","k":"text"},{"c":"rules","i":"sig_fya","q":"You want to turn left and see a FLASHING YELLOW ARROW. Oncoming traffic has:","qt":"คุณจะเลี้ยวซ้ายและเห็นลูกศรเหลืองกะพริบ รถฝั่งตรงข้ามได้:","o":[["A green light, so you must yield to them and to pedestrians","ไฟเขียว คุณต้องให้ทางพวกเขาและคนเดิน"],["A red light, so your turn is protected","ไฟแดง การเลี้ยวของคุณได้รับการป้องกัน"],["A flashing red light","ไฟแดงกะพริบ"],["A yellow light, so you should hurry","ไฟเหลือง ควรรีบเลี้ยว"]],"e":"Handbook, Flashing Yellow Arrow: turns allowed; the oncoming traffic has a green light. Yield to oncoming traffic and pedestrians.","et":"คู่มือ: ลูกศรเหลืองกะพริบ—รถสวนได้ไฟเขียว ต้องให้ทาง","k":"text"},{"c":"rules","i":"sig_greenarrow","q":"A green arrow is lit together with a red light. To make the turn you must:","qt":"ลูกศรเขียวติดพร้อมไฟแดง เพื่อเลี้ยวคุณต้อง:","o":[["Be in the proper lane and yield to vehicles and pedestrians still in the intersection","อยู่ในเลนที่ถูก และให้ทางรถและคนเดินที่ยังอยู่ในทางแยก"],["Stop first, as for a red light","หยุดก่อนเหมือนไฟแดง"],["Wait for the red light to go out","รอไฟแดงดับ"],["Turn from any lane","เลี้ยวจากเลนใดก็ได้"]],"e":"Handbook, Green Arrow: if the red light is illuminated at the same time, you must be in the proper lane; yield to vehicles and pedestrians in the intersection.","et":"คู่มือ: ลูกศรเขียวพร้อมไฟแดง—ต้องอยู่เลนที่ถูก และให้ทางผู้ที่อยู่ในทางแยก","k":"text"},{"c":"rules","i":"sig_flashred","q":"You approach a FLASHING RED signal at an intersection. Which is correct?","qt":"คุณเข้าใกล้สัญญาณไฟแดงกะพริบที่ทางแยก ข้อใดถูก?","o":[["Treat it like a stop sign: stop completely, then go when safe","ถือเหมือนป้ายหยุด: หยุดสนิทแล้วไปเมื่อปลอดภัย"],["Treat it like a yield sign: slow down and go if clear","ถือเหมือนป้ายให้ทาง: ชะลอแล้วไปถ้าว่าง"],["Wait until it turns green","รอจนเป็นเขียว"],["Slow down and proceed with caution without stopping","ชะลอแล้วไปอย่างระวังโดยไม่หยุด"]],"e":"Handbook, Flashing Red Light: treat it like a stop sign; stop and proceed when safe. (Flashing yellow = proceed with caution.)","et":"คู่มือ: ไฟแดงกะพริบ = ป้ายหยุด; ไฟเหลืองกะพริบ = ไปอย่างระวัง","k":"text"},{"c":"rules","i":"","q":"At a pedestrian hybrid beacon, the signal shows a FLASHING RED light and no pedestrian is present. You may:","qt":"ที่สัญญาณคนข้ามแบบไฮบริด ไฟแดงกะพริบอยู่และไม่มีคนเดิน คุณ:","o":[["Proceed with caution if no pedestrian is present and the intersection is clear","ไปอย่างระวังถ้าไม่มีคนเดินและทางว่าง"],["Never proceed until the signal goes dark","ห้ามไปจนสัญญาณดับ"],["Speed up to clear before it turns solid red","เร่งให้พ้นก่อนเป็นแดงค้าง"],["Proceed without slowing or looking","ไปต่อโดยไม่ชะลอหรือมอง"]],"e":"Handbook, Pedestrian Hybrid Beacon: flashing yellow = slow (button pushed); steady yellow = prepare to stop; steady red = stop for pedestrian; flashing red = proceed with caution if no pedestrian is present and it is clear.","et":"คู่มือ: เหลืองกะพริบ=ชะลอ; เหลืองค้าง=เตรียมหยุด; แดงค้าง=หยุด; แดงกะพริบ=ไปอย่างระวังถ้าว่าง","k":"text"},{"c":"rules","i":"","q":"Approaching a pedestrian hybrid beacon, you see a FLASHING YELLOW light. This means:","qt":"เข้าใกล้สัญญาณคนข้ามแบบไฮบริด เห็นไฟเหลืองกะพริบ หมายความว่า:","o":[["A pedestrian has pushed the button; slow down and be ready to stop","มีคนกดปุ่มข้าม ชะลอและพร้อมหยุด"],["The crosswalk is closed","ทางม้าลายปิด"],["You must stop and wait for green","ต้องหยุดรอไฟเขียว"],["You may proceed at normal speed","ไปต่อได้ตามปกติ"]],"e":"Handbook, Pedestrian Hybrid Beacon: flashing yellow indicates a pedestrian activated the push button; approach at a speed that lets you stop.","et":"คู่มือ: เหลืองกะพริบคือมีคนกดปุ่ม ชะลอให้หยุดได้","k":"text"},{"c":"rules","i":"","q":"At a drawbridge, the signal shows a FLASHING YELLOW light. This means:","qt":"ที่สะพานยก สัญญาณแสดงไฟเหลืองกะพริบ หมายความว่า:","o":[["The drawbridge is in operation; slow down and prepare to stop","สะพานกำลังทำงาน ชะลอและเตรียมหยุด"],["The bridge is closed to boats; proceed at normal speed","สะพานปิดสำหรับเรือ ไปได้ตามปกติ"],["Speed up to cross before it opens","เร่งข้ามก่อนยก"],["Treat it like a four-way stop","ถือเป็นทางแยกหยุดสี่ทาง"]],"e":"Handbook, Drawbridge Signs & Signals: when the yellow light is flashing, the drawbridge is in operation—slow down and prepare to stop. Red = stop at the stop line.","et":"คู่มือ: เหลืองกะพริบ = สะพานกำลังทำงาน ชะลอและเตรียมหยุด; แดง = หยุดที่เส้นหยุด","k":"text"},{"c":"rules","i":"","q":"You must stop for a red light at an intersection with no stop line and no crosswalk. Where do you stop?","qt":"คุณต้องหยุดไฟแดงที่ทางแยกที่ไม่มีเส้นหยุดและไม่มีทางม้าลาย หยุดที่ไหน?","o":[["Before entering the intersection","ก่อนเข้าทางแยก"],["Even with the traffic signal pole","ตรงเสาสัญญาณไฟ"],["Just past the edge of the cross street","เลยขอบถนนที่ตัดผ่านเล็กน้อย"],["Wherever you can see best, even inside the intersection","ที่ที่มองเห็นดีที่สุด แม้อยู่ในทางแยก"]],"e":"Handbook: stop at the stop line; if none, before the crosswalk; if none, before entering the intersection.","et":"คู่มือ: หยุดที่เส้นหยุด ถ้าไม่มี ก่อนทางม้าลาย ถ้าไม่มี ก่อนเข้าทางแยก","k":"text"},{"c":"rules","i":"","q":"The light turns green, but traffic ahead is backed up so you would be stuck in the intersection. You should:","qt":"ไฟเขียวแล้ว แต่รถข้างหน้าติดจนคุณจะค้างกลางทางแยก คุณควร:","o":[["Wait behind the stop line until there is room to clear the intersection","รอหลังเส้นหยุดจนมีที่พอผ่านพ้นทางแยก"],["Enter the intersection; you have a green light","เข้าทางแยกเพราะไฟเขียว"],["Enter partway and stop in the crosswalk","เข้าครึ่งทางและหยุดบนทางม้าลาย"],["Enter and wait; cross traffic must go around you","เข้าไปรอ รถทางตัดต้องอ้อมคุณ"]],"e":"Handbook, Green Light: go only if the intersection is clear (DO NOT BLOCK INTERSECTION).","et":"คู่มือ: ไฟเขียวไปได้เมื่อทางแยกว่างเท่านั้น (ห้ามขวางทางแยก)","k":"text"},{"c":"rules","i":"sc_roundabout","q":"You are approaching a roundabout. Which is correct?","qt":"คุณกำลังเข้าวงเวียน ข้อใดถูก?","o":[["Yield to traffic already in the roundabout and to pedestrians; travel counterclockwise","ให้ทางรถในวงเวียนและคนเดิน วิ่งทวนเข็มนาฬิกา"],["Traffic in the roundabout must yield to you","รถในวงเวียนต้องให้ทางคุณ"],["Travel clockwise around the island","วิ่งตามเข็มนาฬิกา"],["Stop inside the roundabout to let others enter","หยุดในวงเวียนให้คนอื่นเข้า"]],"e":"Handbook, Roundabouts: yield to traffic in the roundabout and pedestrians, travel counterclockwise, don't stop in the circle.","et":"คู่มือ: ให้ทางรถในวงเวียนและคนเดิน วิ่งทวนเข็ม ไม่หยุดในวง","k":"text"},{"c":"rules","i":"","q":"A large truck ahead is signaling a right turn and swinging wide to the left. You are behind it. You should:","qt":"รถบรรทุกใหญ่ข้างหน้าเปิดไฟเลี้ยวขวาและเบี่ยงกว้างไปซ้าย คุณอยู่ข้างหลัง ควร:","o":[["Stay back; do not drive between the truck and the curb","รออยู่ข้างหลัง อย่าแทรกระหว่างรถบรรทุกกับขอบทาง"],["Pass on its right while it swings left","แซงขวาขณะมันเบี่ยงซ้าย"],["Pass on its left at the same time","แซงซ้ายพร้อมกัน"],["Pull up beside it so the driver can see you","ขับขึ้นไปข้างๆ ให้คนขับเห็น"]],"e":"Handbook, Sharing the Road with CMVs: they often swing wide to the left to make a right turn; do not drive between the CMV and the curb.","et":"คู่มือ: รถบรรทุกเบี่ยงซ้ายเพื่อเลี้ยวขวา อย่าขับแทรกระหว่างรถกับขอบทาง","k":"text"},{"c":"rules","i":"","q":"You are passing a large commercial truck on the highway. Which is correct?","qt":"คุณกำลังแซงรถบรรทุกใหญ่บนทางหลวง ข้อใดถูก?","o":[["Pass on the left, signal, and blink your headlights to let the driver know you are passing","แซงซ้าย เปิดไฟเลี้ยว และกะพริบไฟหน้าบอกคนขับว่ากำลังแซง"],["Pass on the right, where the driver can see you best","แซงขวาที่คนขับเห็นชัดสุด"],["Slow down and ride beside the truck so the driver can see you","ชะลอขับข้างรถบรรทุกให้คนขับเห็น"],["Pull back in front as soon as your rear bumper clears its cab","ตัดกลับทันทีที่ท้ายรถพ้นหัวรถ"]],"e":"Handbook, Passing CMVs: move into the passing lane only if clear, signal, let the driver know by blinking your headlights, pass on the left for maximum visibility, and don't linger in the No-Zone.","et":"คู่มือ: แซงซ้าย เปิดไฟเลี้ยว กะพริบไฟหน้าบอก อย่าค้างในจุดบอด","k":"text"},{"c":"rules","i":"","q":"You must dim your high beams for an oncoming vehicle when it is within:","qt":"ต้องลดไฟสูงสำหรับรถสวนเมื่ออยู่ในระยะ:","o":[["500 feet","500 ฟุต"],["300 feet","300 ฟุต"],["1,000 feet","1,000 ฟุต"],["200 feet","200 ฟุต"]],"e":"Handbook, Night Driving: do not use high beams within 500 feet of an oncoming vehicle; within 300 feet of a vehicle ahead.","et":"คู่มือ: ห้ามใช้ไฟสูงภายใน 500 ฟุตจากรถสวน และ 300 ฟุตจากรถข้างหน้า","k":"text"},{"c":"rules","i":"","q":"At night you come up behind another car going the same direction. You must dim to low beams within:","qt":"กลางคืนคุณตามหลังรถทิศเดียวกัน ต้องลดเป็นไฟต่ำในระยะ:","o":[["300 feet","300 ฟุต"],["500 feet","500 ฟุต"],["200 feet","200 ฟุต"],["100 feet","100 ฟุต"]],"e":"Handbook, Night Driving: do not use high beams within 300 feet of the vehicle ahead of you.","et":"คู่มือ: ห้ามใช้ไฟสูงภายใน 300 ฟุตจากรถข้างหน้า","k":"text"},{"c":"rules","i":"","q":"Low-beam headlights let you see objects about how far ahead?","qt":"ไฟต่ำช่วยให้มองเห็นวัตถุข้างหน้าประมาณกี่ฟุต?","o":[["150 feet","150 ฟุต"],["450 feet","450 ฟุต"],["300 feet","300 ฟุต"],["100 feet","100 ฟุต"]],"e":"Handbook, Equipment table: low beams show objects 150 feet ahead; high beams 450 feet.","et":"คู่มือ: ไฟต่ำมองเห็น 150 ฟุต ไฟสูง 450 ฟุต","k":"text"},{"c":"rules","i":"","q":"High-beam headlights reveal objects up to about how far ahead?","qt":"ไฟสูงช่วยให้มองเห็นวัตถุได้ประมาณกี่ฟุต?","o":[["450 feet","450 ฟุต"],["150 feet","150 ฟุต"],["300 feet","300 ฟุต"],["1,000 feet","1,000 ฟุต"]],"e":"Handbook, Night Driving: high beams reveal objects up to at least 450 feet.","et":"คู่มือ: ไฟสูงมองเห็นได้อย่างน้อย 450 ฟุต","k":"text"},{"c":"rules","i":"","q":"Your brake lights must be visible from how far in the daytime?","qt":"ไฟเบรกต้องมองเห็นได้จากระยะเท่าไรในเวลากลางวัน?","o":[["300 feet","300 ฟุต"],["500 feet","500 ฟุต"],["1,000 feet","1,000 ฟุต"],["200 feet","200 ฟุต"]],"e":"Handbook, Equipment: brake lights visible from 300 feet in the daytime; turn signals 500 ft; taillights 1,000 ft; horn heard 200 ft.","et":"คู่มือ: ไฟเบรก 300 ฟุต; ไฟเลี้ยว 500; ไฟท้าย 1,000; แตร 200 ฟุต","k":"text"},{"c":"rules","i":"","q":"Your directional (turn) signals must be visible from:","qt":"ไฟเลี้ยวต้องมองเห็นได้จากระยะ:","o":[["500 feet","500 ฟุต"],["300 feet","300 ฟุต"],["200 feet","200 ฟุต"],["1,000 feet","1,000 ฟุต"]],"e":"Handbook, Equipment table: directional signals visible from 500 feet.","et":"คู่มือ: ไฟเลี้ยวมองเห็นได้จาก 500 ฟุต","k":"text"},{"c":"rules","i":"","q":"Your horn must be able to be heard from at least:","qt":"แตรรถต้องได้ยินจากระยะอย่างน้อย:","o":[["200 feet","200 ฟุต"],["100 feet","100 ฟุต"],["300 feet","300 ฟุต"],["500 feet","500 ฟุต"]],"e":"Handbook, Equipment table: horn heard from a distance of 200 feet.","et":"คู่มือ: แตรได้ยินจาก 200 ฟุต","k":"text"},{"c":"rules","i":"","q":"Driving in thick fog or wildfire smoke, which lights should you use?","qt":"ขับในหมอกหนาหรือควันไฟป่า ควรใช้ไฟแบบใด?","o":[["Low-beam headlights","ไฟหน้าต่ำ"],["High-beam headlights","ไฟหน้าสูง"],["Parking lights only","ไฟหรี่อย่างเดียว"],["Fog lights only, with headlights off","ไฟตัดหมอกอย่างเดียว ปิดไฟหน้า"]],"e":"Handbook, Low Visibility: you must turn on headlights (parking lights are not a substitute) and drive on low beam; high beams reflect off the fog.","et":"คู่มือ: ต้องเปิดไฟหน้าต่ำ ไฟหรี่ใช้แทนไม่ได้ ไฟสูงสะท้อนหมอก","k":"text"},{"c":"rules","i":"","q":"You turn on your windshield wipers because it is raining. You must also:","qt":"คุณเปิดที่ปัดน้ำฝนเพราะฝนตก คุณต้อง:","o":[["Turn on your headlights","เปิดไฟหน้า"],["Turn on your hazard lights","เปิดไฟฉุกเฉิน"],["Turn on your high beams","เปิดไฟสูง"],["Turn on your parking lights","เปิดไฟหรี่"]],"e":"Handbook, Rain: when you turn on your windshield wipers, turn on your headlights. Parking lights are not a substitute.","et":"คู่มือ: เปิดที่ปัดน้ำฝนต้องเปิดไฟหน้าด้วย ไฟหรี่ใช้แทนไม่ได้","k":"text"},{"c":"rules","i":"","q":"Before passing on a two-lane road, how should you let the other driver know?","qt":"ก่อนแซงบนถนนสองเลน ควรบอกคนขับอีกคันอย่างไร?","o":[["Tap the horn in the day or flash headlights at night","แตะแตรตอนกลางวันหรือกะพริบไฟตอนกลางคืน"],["Flash high beams in the day and honk at night","กะพริบไฟสูงกลางวัน บีบแตรกลางคืน"],["Turn on your hazard lights","เปิดไฟฉุกเฉิน"],["Use your right turn signal","เปิดไฟเลี้ยวขวา"]],"e":"Handbook, Passing step 4: tap your horn (day) or flash your headlights (night) to let the other driver know you are passing.","et":"คู่มือ: แตะแตร (กลางวัน) หรือกะพริบไฟ (กลางคืน) เพื่อบอกว่ากำลังแซง","k":"text"},{"c":"fines","i":"","q":"A 19-year-old driver is stopped and has a breath alcohol level of 0.03. Under Florida's Zero Tolerance law:","qt":"คนขับอายุ 19 ถูกเรียกตรวจ มีแอลกอฮอล์ในลมหายใจ 0.03 ตามกฎ Zero Tolerance:","o":[["The license is suspended for 6 months","ใบขับขี่ถูกพัก 6 เดือน"],["Nothing happens; the DUI limit is 0.08","ไม่มีอะไร ขีดจำกัด DUI คือ 0.08"],["Nothing happens unless the level is 0.05 or higher","ไม่มีอะไรเว้นแต่ 0.05 ขึ้นไป"],["The license is suspended for 1 year","ใบขับขี่ถูกพัก 1 ปี"]],"e":"Handbook, Zero Tolerance: any driver under 21 with a BAL of .02 or higher will automatically have their driving privilege suspended for six months.","et":"คู่มือ: ผู้ขับอายุต่ำกว่า 21 ที่มี BAL .02 ขึ้นไป จะถูกพักใบขับขี่ 6 เดือนอัตโนมัติ","k":"text"},{"c":"fines","i":"","q":"A driver under 21 with a blood alcohol level of .05 or higher must, in addition to the suspension:","qt":"ผู้ขับอายุต่ำกว่า 21 ที่มีแอลกอฮอล์ .05 ขึ้นไป นอกจากถูกพักใบขับขี่แล้วต้อง:","o":[["Attend a substance abuse course","เข้าอบรมเรื่องสารเสพติด"],["Serve 10 days in jail","ติดคุก 10 วัน"],["Retake the road test only","สอบขับใหม่เท่านั้น"],["Install an ignition interlock for 5 years","ติดตั้งเครื่องตรวจแอลกอฮอล์ 5 ปี"]],"e":"Handbook, Zero Tolerance: any driver under 21 with a BAL of .05 or higher is required to attend a substance abuse course.","et":"คู่มือ: ผู้ขับต่ำกว่า 21 ที่ BAL .05 ขึ้นไป ต้องเข้าอบรมเรื่องสารเสพติด","k":"text"},{"c":"fines","i":"","q":"At the time of a DUI arrest, your license is administratively suspended if your breath or blood alcohol level is at least:","qt":"เมื่อถูกจับ DUI ใบขับขี่จะถูกพักทันทีถ้าแอลกอฮอล์ในลมหายใจหรือเลือดอย่างน้อย:","o":[[".08",".08"],[".02",".02"],[".05",".05"],[".15",".15"]],"e":"Handbook: at the time of arrest, your license will be administratively suspended if you have a BAL of .08 or above, or refuse to submit to a test.","et":"คู่มือ: ถูกพักทันทีเมื่อ BAL .08 ขึ้นไป หรือปฏิเสธการตรวจ","k":"text"},{"c":"fines","i":"","q":"A first DUI conviction with a BAL of .15 or higher (or a minor in the vehicle) carries a fine of:","qt":"ความผิด DUI ครั้งแรกที่ BAL .15 ขึ้นไป (หรือมีเด็กในรถ) โทษปรับ:","o":[["$1,000–$2,000","$1,000–$2,000"],["$500–$1,000","$500–$1,000"],["$2,000–$4,000","$2,000–$4,000"],["$250–$500","$250–$500"]],"e":"Handbook, First DUI: fine $500–$1,000; with BAL .15+ or a minor in the vehicle, not less than $1,000 or more than $2,000.","et":"คู่มือ: DUI ครั้งแรก ปรับ $500–$1,000; ถ้า .15+ หรือมีเด็ก $1,000–$2,000","k":"text"},{"c":"fines","i":"","q":"For a first DUI conviction, the minimum license revocation and community service are:","qt":"DUI ครั้งแรก การเพิกถอนใบขับขี่ขั้นต่ำและบริการสังคมคือ:","o":[["180 days revocation and 50 hours of community service","เพิกถอน 180 วัน และบริการสังคม 50 ชั่วโมง"],["90 days revocation and 20 hours","เพิกถอน 90 วัน และ 20 ชั่วโมง"],["1 year revocation and 100 hours","เพิกถอน 1 ปี และ 100 ชั่วโมง"],["30 days revocation and 10 hours","เพิกถอน 30 วัน และ 10 ชั่วโมง"]],"e":"Handbook, First DUI: community service 50 hours; license revocation minimum 180 days; DUI school 12 hours; probation up to 1 year.","et":"คู่มือ: DUI ครั้งแรก บริการสังคม 50 ชม. เพิกถอนอย่างน้อย 180 วัน อบรม DUI 12 ชม.","k":"text"},{"c":"fines","i":"","q":"An officer with reasonable cause asks you to take a breath test and you refuse for the FIRST time. Your license is suspended for:","qt":"ตำรวจที่มีเหตุอันควรขอให้เป่า คุณปฏิเสธเป็นครั้งแรก ใบขับขี่ถูกพัก:","o":[["1 year","1 ปี"],["6 months","6 เดือน"],["18 months","18 เดือน"],["180 days","180 วัน"]],"e":"Handbook, Implied Consent: refusal—license automatically suspended for one year; a second refusal—18 months and a first degree misdemeanor.","et":"คู่มือ: ปฏิเสธครั้งแรก พัก 1 ปี; ครั้งที่สอง 18 เดือน และเป็นความผิดลหุโทษขั้นที่หนึ่ง","k":"text"},{"c":"fines","i":"","q":"A driver who has refused a breath test once before refuses again. The result is:","qt":"ผู้ขับที่เคยปฏิเสธการเป่ามาแล้วปฏิเสธอีก ผลคือ:","o":[["An 18-month suspension and a first degree misdemeanor","พัก 18 เดือน และความผิดลหุโทษขั้นที่หนึ่ง"],["A 1-year suspension only","พัก 1 ปีเท่านั้น"],["A 2-year suspension only","พัก 2 ปีเท่านั้น"],["A 6-month suspension and DUI school","พัก 6 เดือนและอบรม DUI"]],"e":"Handbook, Implied Consent: a second refusal results in an 18 month suspension and a first degree misdemeanor.","et":"คู่มือ: ปฏิเสธครั้งที่สอง พัก 18 เดือนและความผิดลหุโทษขั้นที่หนึ่ง","k":"text"},{"c":"fines","i":"","q":"Under Florida's Implied Consent Law, you agreed to take a breath, blood, or urine test when:","qt":"ตามกฎ Implied Consent ของฟลอริดา คุณตกลงจะรับการตรวจลมหายใจ เลือด หรือปัสสาวะเมื่อ:","o":[["You signed for your driver license","คุณเซ็นรับใบขับขี่"],["You bought car insurance","คุณซื้อประกันรถ"],["You registered your vehicle","คุณจดทะเบียนรถ"],["You signed the traffic ticket","คุณเซ็นใบสั่ง"]],"e":"Handbook, Implied Consent Law: by law, you have agreed by signing your driver license to take these tests if asked.","et":"คู่มือ: เมื่อเซ็นรับใบขับขี่ คุณได้ตกลงตามกฎหมายที่จะรับการตรวจเมื่อถูกขอ","k":"text"},{"c":"fines","i":"","q":"In a DUI crash involving death or serious injury, a blood test:","qt":"ในอุบัติเหตุ DUI ที่มีผู้เสียชีวิตหรือบาดเจ็บสาหัส การตรวจเลือด:","o":[["May be taken with or without your consent, even if you are unconscious","ตรวจได้โดยไม่ต้องยินยอม แม้หมดสติ"],["Requires your written consent","ต้องได้รับความยินยอมเป็นลายลักษณ์อักษร"],["Can be refused with only a 1-year suspension","ปฏิเสธได้โดยถูกพักแค่ 1 ปี"],["Can only be taken by a police officer","เจ้าหน้าที่ตำรวจเท่านั้นเจาะได้"]],"e":"Handbook: in DUI cases involving death or serious injury, you will be required to take a blood test with or without your consent; drawn by a doctor, nurse, or other health professional, even if you are unconscious.","et":"คู่มือ: กรณีเสียชีวิต/บาดเจ็บสาหัส ต้องตรวจเลือดแม้ไม่ยินยอมหรือหมดสติ โดยบุคลากรการแพทย์","k":"text"},{"c":"fines","i":"","q":"If you are convicted of possessing, selling, or trafficking drugs (including marijuana) in Florida:","qt":"ถ้าถูกตัดสินว่ามีครอบครอง ขาย หรือค้ายาเสพติด (รวมกัญชา) ในฟลอริดา:","o":[["Your driver license must be suspended","ใบขับขี่ต้องถูกพัก"],["Your license is unaffected if you were not driving","ใบขับขี่ไม่กระทบถ้าไม่ได้ขับ"],["You only receive 3 points","ได้แค่ 3 แต้ม"],["You must only retake the TLSAE course","ต้องเรียน TLSAE ใหม่เท่านั้น"]],"e":"Handbook: if you are convicted of possessing, selling, or trafficking in drugs, including marijuana, your driver license must be suspended.","et":"คู่มือ: ถูกตัดสินคดียาเสพติด รวมกัญชา ใบขับขี่ต้องถูกพัก","k":"text"},{"c":"fines","i":"","q":"You are convicted of driving 15 mph over the posted limit (no crash). How many points?","qt":"คุณถูกตัดสินว่าขับเกินจำกัด 15 ไมล์/ชม. (ไม่มีอุบัติเหตุ) ได้กี่แต้ม?","o":[["3 points","3 แต้ม"],["4 points","4 แต้ม"],["2 points","2 แต้ม"],["6 points","6 แต้ม"]],"e":"Handbook, Points table: unlawful speed 15 MPH or less over—3 points; 16 MPH or more over—4 points; speed resulting in a crash—6 points.","et":"คู่มือ: เกิน 15 หรือน้อยกว่า—3 แต้ม; 16 ขึ้นไป—4 แต้ม; ทำให้ชน—6 แต้ม","k":"text"},{"c":"fines","i":"","q":"You are convicted of driving 16 mph over the posted limit (no crash). How many points?","qt":"คุณถูกตัดสินว่าขับเกินจำกัด 16 ไมล์/ชม. (ไม่มีอุบัติเหตุ) ได้กี่แต้ม?","o":[["4 points","4 แต้ม"],["3 points","3 แต้ม"],["5 points","5 แต้ม"],["6 points","6 แต้ม"]],"e":"Handbook, Points table: 16 MPH or more over the lawful or posted speed—4 points.","et":"คู่มือ: เกิน 16 ไมล์/ชม. ขึ้นไป—4 แต้ม","k":"text"},{"c":"fines","i":"","q":"Speeding that results in a crash adds how many points?","qt":"ขับเร็วเกินจนเกิดอุบัติเหตุได้กี่แต้ม?","o":[["6 points","6 แต้ม"],["4 points","4 แต้ม"],["3 points","3 แต้ม"],["8 points","8 แต้ม"]],"e":"Handbook, Points table: unlawful speed resulting in a crash—6 points.","et":"คู่มือ: ขับเร็วจนเกิดอุบัติเหตุ—6 แต้ม","k":"text"},{"c":"fines","i":"","q":"You are cited for texting while driving in a school zone. How many points are added to the texting violation?","qt":"คุณถูกใบสั่งส่งข้อความขณะขับในเขตโรงเรียน จะเพิ่มแต้มจากความผิดส่งข้อความกี่แต้ม?","o":[["3 more points (added to the primary offense)","เพิ่มอีก 3 แต้ม (บวกจากความผิดหลัก)"],["2 more points","เพิ่ม 2 แต้ม"],["6 more points","เพิ่ม 6 แต้ม"],["No extra points","ไม่เพิ่มแต้ม"]],"e":"Handbook, Points table: texting while driving 3 points; texting in a school zone +3; texting resulting in a crash +6.","et":"คู่มือ: ส่งข้อความ 3 แต้ม; ในเขตโรงเรียน +3; ทำให้ชน +6","k":"text"},{"c":"fines","i":"","q":"Texting while driving that results in a crash adds how many points to the primary offense?","qt":"ส่งข้อความขณะขับจนเกิดอุบัติเหตุ เพิ่มแต้มจากความผิดหลักกี่แต้ม?","o":[["6 points","6 แต้ม"],["3 points","3 แต้ม"],["4 points","4 แต้ม"],["2 points","2 แต้ม"]],"e":"Handbook, Points table: texting resulted in a crash +6 points.","et":"คู่มือ: ส่งข้อความจนชน +6 แต้ม","k":"text"},{"c":"fines","i":"","q":"Using a handheld wireless device while driving in an active work zone carries:","qt":"การใช้โทรศัพท์แบบถือขณะขับในเขตก่อสร้าง มีโทษ:","o":[["3 points","3 แต้ม"],["No points; it is only a warning","ไม่มีแต้ม แค่ตักเตือน"],["6 points","6 แต้ม"],["4 points","4 แต้ม"]],"e":"Handbook, Points table: using a handheld device in a school crossing, school zone, or work zone—3 points.","et":"คู่มือ: ใช้โทรศัพท์แบบถือในเขตโรงเรียน/ทางข้าม/เขตก่อสร้าง—3 แต้ม","k":"text"},{"c":"fines","i":"","q":"Which statement about Florida's wireless device rules is TRUE?","qt":"ข้อใดถูกต้องเกี่ยวกับกฎอุปกรณ์ไร้สายของฟลอริดา?","o":[["Texting while driving is illegal; ANY handheld use is illegal in school zones, school crossings, and work zones","ส่งข้อความขณะขับผิดกฎหมาย และใช้แบบถือทุกรูปแบบผิดในเขตโรงเรียน ทางข้ามโรงเรียน และเขตก่อสร้าง"],["Handheld calls are allowed in school zones if you drive under 20 mph","โทรแบบถือได้ในเขตโรงเรียนถ้าขับต่ำกว่า 20"],["Texting is legal on interstates but not on city streets","ส่งข้อความได้บนทางด่วนแต่ไม่ได้ในเมือง"],["The rules apply only to drivers under 18","กฎใช้เฉพาะผู้ขับต่ำกว่า 18"]],"e":"Handbook, Distracted Driving: it is illegal to operate a motor vehicle while texting; Florida prohibits using a wireless device in a handheld manner in a designated school crossing, school zone, or work zone.","et":"คู่มือ: ห้ามส่งข้อความขณะขับ และห้ามใช้อุปกรณ์แบบถือในเขตโรงเรียน ทางข้าม และเขตก่อสร้าง","k":"text"},{"c":"fines","i":"","q":"How many points within 12 months result in a 30-day suspension?","qt":"สะสมกี่แต้มภายใน 12 เดือนจะถูกพักใบขับขี่ 30 วัน?","o":[["12 points","12 แต้ม"],["6 points","6 แต้ม"],["18 points","18 แต้ม"],["24 points","24 แต้ม"]],"e":"Handbook: 12 points within 12 months—30 days; 18 points within 18 months—3 months; 24 points within 36 months—1 year.","et":"คู่มือ: 12 แต้มใน 12 เดือน—30 วัน; 18 ใน 18 เดือน—3 เดือน; 24 ใน 36 เดือน—1 ปี","k":"text"},{"c":"fines","i":"","q":"A driver accumulates 18 points within 18 months. The suspension is:","qt":"ผู้ขับสะสม 18 แต้มภายใน 18 เดือน ถูกพัก:","o":[["3 months","3 เดือน"],["30 days","30 วัน"],["6 months","6 เดือน"],["1 year","1 ปี"]],"e":"Handbook: 18 points within 18 months—3 months.","et":"คู่มือ: 18 แต้มใน 18 เดือน—พัก 3 เดือน","k":"text"},{"c":"fines","i":"","q":"A driver accumulates 24 points within 36 months. The suspension is:","qt":"ผู้ขับสะสม 24 แต้มภายใน 36 เดือน ถูกพัก:","o":[["1 year","1 ปี"],["3 months","3 เดือน"],["6 months","6 เดือน"],["2 years","2 ปี"]],"e":"Handbook: 24 points within 36 months—1 year.","et":"คู่มือ: 24 แต้มใน 36 เดือน—พัก 1 ปี","k":"text"},{"c":"fines","i":"","q":"A 17-year-old driver accumulates 6 points within 12 months. What happens?","qt":"ผู้ขับอายุ 17 สะสม 6 แต้มภายใน 12 เดือน จะเกิดอะไร?","o":[["The license is restricted to Business Purposes Only for one year","ใบขับขี่ถูกจำกัดเพื่อธุระเท่านั้นเป็นเวลา 1 ปี"],["Nothing until 12 points","ไม่มีอะไรจนถึง 12 แต้ม"],["The license is suspended for 30 days","ถูกพัก 30 วัน"],["The license is revoked until age 21","ถูกเพิกถอนจนอายุ 21"]],"e":"Handbook, Driving Record Points: drivers under 18 who accumulate six or more points within a 12-month period are automatically restricted to driving for Business Purposes ONLY for one year.","et":"คู่มือ: ผู้ขับต่ำกว่า 18 ที่ได้ 6 แต้มขึ้นไปใน 12 เดือน ถูกจำกัดขับเพื่อธุระเท่านั้น 1 ปี","k":"text"},{"c":"fines","i":"","q":"Running a red light (violation of a traffic signal) adds how many points?","qt":"ฝ่าไฟแดง (ฝ่าฝืนสัญญาณจราจร) ได้กี่แต้ม?","o":[["4 points","4 แต้ม"],["3 points","3 แต้ม"],["6 points","6 แต้ม"],["2 points","2 แต้ม"]],"e":"Handbook, Points table: violation of traffic signal/sign/device—4 points.","et":"คู่มือ: ฝ่าฝืนสัญญาณ/ป้าย—4 แต้ม","k":"text"},{"c":"fines","i":"","q":"Leaving the scene of a crash with property damage of more than $50 adds:","qt":"หนีจากที่เกิดเหตุที่มีความเสียหายทรัพย์สินเกิน $50 ได้:","o":[["6 points","6 แต้ม"],["4 points","4 แต้ม"],["3 points","3 แต้ม"],["8 points","8 แต้ม"]],"e":"Handbook, Points table: leaving the scene of a crash resulting in property damage of more than $50—6 points.","et":"คู่มือ: หนีที่เกิดเหตุ ความเสียหาย > $50—6 แต้ม","k":"text"},{"c":"fines","i":"","q":"The fine for exceeding the speed limit by more than 50 mph is:","qt":"ค่าปรับขับเร็วเกินจำกัดมากกว่า 50 ไมล์/ชม. คือ:","o":[["$1,000","$1,000"],["$500","$500"],["$250","$250"],["$2,500","$2,500"]],"e":"Handbook, Speeding: the fine for exceeding the speed limit by more than 50 MPH is $1,000.","et":"คู่มือ: เกิน 50 ไมล์/ชม. ปรับ $1,000","k":"text"},{"c":"fines","i":"","q":"Florida requires vehicle owners to carry at least:","qt":"ฟลอริดากำหนดให้เจ้าของรถมีประกันอย่างน้อย:","o":[["$10,000 PIP and $10,000 PDL","PIP $10,000 และ PDL $10,000"],["$10,000 PIP and $20,000 PDL","PIP $10,000 และ PDL $20,000"],["$20,000 PIP and $10,000 PDL","PIP $20,000 และ PDL $10,000"],["$5,000 PIP and $5,000 PDL","PIP $5,000 และ PDL $5,000"]],"e":"Handbook, Insurance: minimum of $10,000 in Personal Injury Protection (PIP) and $10,000 in Property Damage Liability (PDL).","et":"คู่มือ: PIP อย่างน้อย $10,000 และ PDL อย่างน้อย $10,000","k":"text"},{"c":"fines","i":"","q":"After a DUI conviction, Florida requires higher insurance. The minimum Bodily Injury Liability for injuries to one person is:","qt":"หลังถูกตัดสิน DUI ฟลอริดากำหนดประกันสูงขึ้น ความรับผิดต่อการบาดเจ็บขั้นต่ำต่อหนึ่งคนคือ:","o":[["$100,000","$100,000"],["$10,000","$10,000"],["$50,000","$50,000"],["$300,000","$300,000"]],"e":"Handbook, Insurance: after a DUI conviction coverage must be at least $100,000 BIL for one person, $300,000 BIL for two or more, and $50,000 PDL.","et":"คู่มือ: หลัง DUI ต้องมี BIL $100,000 ต่อคน, $300,000 สองคนขึ้นไป, PDL $50,000","k":"text"},{"c":"fines","i":"","q":"Your license and plate are suspended for not having insurance. To lift the suspension you must get insurance and pay a reinstatement fee of:","qt":"ใบขับขี่และป้ายทะเบียนถูกพักเพราะไม่มีประกัน เพื่อยกเลิกการพักต้องทำประกันและจ่ายค่าคืนสิทธิ์:","o":[["$150 to $500","$150 ถึง $500"],["$25 to $50","$25 ถึง $50"],["$1,000 to $2,000","$1,000 ถึง $2,000"],["Nothing; insurance alone is enough","ไม่ต้องจ่าย มีประกันก็พอ"]],"e":"Handbook, Insurance: you will have to get insurance and pay a reinstatement fee ($150 to $500).","et":"คู่มือ: ต้องทำประกันและจ่ายค่าคืนสิทธิ์ ($150–$500)","k":"text"},{"c":"fines","i":"","q":"Which persons must wear a safety belt in Florida?","qt":"ใครบ้างต้องคาดเข็มขัดนิรภัยในฟลอริดา?","o":[["All drivers, all front-seat passengers, and all passengers under 18","ผู้ขับทุกคน ผู้โดยสารหน้าทุกคน และผู้โดยสารอายุต่ำกว่า 18 ทุกคน"],["Drivers and passengers under 16 only","ผู้ขับและผู้โดยสารต่ำกว่า 16 เท่านั้น"],["Front-seat occupants only","คนนั่งหน้าเท่านั้น"],["Drivers and passengers under 13 only","ผู้ขับและผู้โดยสารต่ำกว่า 13 เท่านั้น"]],"e":"Handbook: all drivers, front seat passengers, and passengers under the age of 18 wear safety belts.","et":"คู่มือ: ผู้ขับ ผู้โดยสารหน้า และผู้โดยสารต่ำกว่า 18 ต้องคาดเข็มขัด","k":"text"},{"c":"fines","i":"","q":"Your 16-year-old nephew rides in the back seat without a seat belt. Who is charged with the violation?","qt":"หลานอายุ 16 นั่งหลังไม่คาดเข็มขัด ใครถูกปรับ?","o":[["The driver","ผู้ขับ"],["The nephew","หลาน"],["The nephew's parents","พ่อแม่ของหลาน"],["No one; back-seat passengers are exempt","ไม่มีใคร ผู้นั่งหลังได้รับยกเว้น"]],"e":"Handbook: drivers will be charged if any passenger under 18 is not properly restrained.","et":"คู่มือ: ผู้ขับถูกปรับถ้าผู้โดยสารต่ำกว่า 18 ไม่คาดเข็มขัด","k":"text"},{"c":"fines","i":"","q":"Your 25-year-old friend in the FRONT passenger seat refuses to buckle up. Who is charged?","qt":"เพื่อนอายุ 25 นั่งหน้าข้างคนขับไม่ยอมคาดเข็มขัด ใครถูกปรับ?","o":[["Your friend, the passenger","เพื่อน ซึ่งเป็นผู้โดยสาร"],["You, the driver","คุณ ผู้ขับ"],["Both of you","ทั้งสองคน"],["No one; adults may choose","ไม่มีใคร ผู้ใหญ่เลือกได้"]],"e":"Handbook: passengers 18 years old or older will be charged with the violation if they fail to wear a safety belt when required by law.","et":"คู่มือ: ผู้โดยสารอายุ 18 ขึ้นไปถูกปรับเองเมื่อไม่คาดเข็มขัดในกรณีที่กฎหมายบังคับ","k":"text"},{"c":"fines","i":"","q":"Your 3-year-old daughter is riding with you. Florida law requires her to be in:","qt":"ลูกสาวอายุ 3 ขวบนั่งรถกับคุณ กฎหมายฟลอริดากำหนดให้อยู่ใน:","o":[["A child safety seat (a booster seat is not enough)","คาร์ซีทเด็ก (บูสเตอร์ไม่พอ)"],["A booster seat or a safety seat","บูสเตอร์หรือคาร์ซีท"],["A regular seat belt in the back seat","เข็มขัดปกติที่เบาะหลัง"],["A booster seat in the front seat","บูสเตอร์ที่เบาะหน้า"]],"e":"Handbook: children under age 4 must be in a safety seat; children ages 4 and 5 must be in either a safety seat or a booster seat.","et":"คู่มือ: เด็กต่ำกว่า 4 ขวบต้องนั่งคาร์ซีท; อายุ 4–5 ใช้คาร์ซีทหรือบูสเตอร์","k":"text"},{"c":"fines","i":"","q":"You are driving your own 5-year-old son. Florida law requires him to use:","qt":"คุณขับรถพาลูกชายอายุ 5 ขวบ กฎหมายฟลอริดากำหนดให้ใช้:","o":[["A child safety seat or a booster seat","คาร์ซีทหรือบูสเตอร์"],["Only a regular seat belt","เข็มขัดปกติเท่านั้น"],["Only a rear-facing seat","คาร์ซีทหันหลังเท่านั้น"],["No restraint if he sits in the back","ไม่ต้องใช้ถ้านั่งหลัง"]],"e":"Handbook: children ages 4 and 5 must be in a safety seat or booster seat. A belt alone is allowed for ages 4–5 only when the driver is not immediate family and is transporting the child as a favor or in an emergency.","et":"คู่มือ: อายุ 4–5 ใช้คาร์ซีทหรือบูสเตอร์ ใช้เข็มขัดอย่างเดียวได้เฉพาะผู้ขับไม่ใช่ครอบครัวและช่วยเหลือ/ฉุกเฉิน","k":"text"},{"c":"fines","i":"","q":"EXCEPTION: When may a 4- or 5-year-old legally use only a safety belt (no booster)?","qt":"ข้อยกเว้น: เมื่อใดเด็กอายุ 4–5 ขวบใช้เพียงเข็มขัดนิรภัย (ไม่มีบูสเตอร์) ได้ตามกฎหมาย?","o":[["When the driver is not immediate family and is giving the child a ride as a favor or in an emergency","เมื่อผู้ขับไม่ใช่ครอบครัวใกล้ชิดและช่วยรับส่งหรือฉุกเฉิน"],["Whenever the child sits in the back seat","เมื่อเด็กนั่งเบาะหลัง"],["On trips shorter than 5 miles","เมื่อเดินทางไม่เกิน 5 ไมล์"],["When a parent is driving","เมื่อพ่อแม่เป็นผู้ขับ"]],"e":"Handbook, Exemptions: a safety belt (without booster seat) may only be used for children 4–5 years of age when the driver is not a member of the child's immediate family and the child is being transported as a favor or in an emergency.","et":"คู่มือ: ใช้เข็มขัดอย่างเดียวกับเด็ก 4–5 ขวบได้เมื่อผู้ขับไม่ใช่ครอบครัวและรับส่งเป็นการช่วยเหลือหรือฉุกเฉิน","k":"text"},{"c":"fines","i":"","q":"Where should children under 13 ride, according to the Florida handbook?","qt":"ตามคู่มือฟลอริดา เด็กอายุต่ำกว่า 13 ควรนั่งที่ใด?","o":[["In the rear seat, because airbags can injure or kill young children","เบาะหลัง เพราะถุงลมอาจทำร้ายเด็ก"],["In the front seat so the driver can watch them","เบาะหน้าเพื่อให้ผู้ขับดูแล"],["Anywhere, if they wear a belt","ที่ใดก็ได้ถ้าคาดเข็มขัด"],["In the front seat with the seat moved all the way back","เบาะหน้าโดยเลื่อนเบาะไปหลังสุด"]],"e":"Handbook: children under 13 should be secured in the rear seat; never place a rear-facing car seat in front of an airbag.","et":"คู่มือ: เด็กต่ำกว่า 13 ควรนั่งเบาะหลัง ห้ามวางคาร์ซีทหันหลังหน้าถุงลม","k":"text"},{"c":"fines","i":"","q":"After moving to a new address in Florida, you must update your driver license within:","qt":"หลังย้ายที่อยู่ในฟลอริดา ต้องเปลี่ยนที่อยู่ในใบขับขี่ภายใน:","o":[["30 days","30 วัน"],["10 days","10 วัน"],["60 days","60 วัน"],["90 days","90 วัน"]],"e":"Handbook, Change of Address: obtain a new driver license within 30 calendar days of any change to your mailing or residential address.","et":"คู่มือ: ต้องเปลี่ยนภายใน 30 วันหลังเปลี่ยนที่อยู่","k":"text"},{"c":"rules","i":"","q":"You are making a right turn on a green light and a pedestrian is starting to cross the street you are turning onto. You must:","qt":"คุณกำลังเลี้ยวขวาตอนไฟเขียว มีคนเดินเริ่มข้ามถนนที่คุณจะเลี้ยวเข้า ต้อง:","o":[["Yield and let the pedestrian cross","ให้ทางให้คนเดินข้าม"],["Go first because your light is green","ไปก่อนเพราะไฟเขียว"],["Tap your horn and turn behind the pedestrian","แตะแตรแล้วเลี้ยวผ่านหลังคนเดิน"],["Turn quickly before they reach your lane","เลี้ยวเร็วๆ ก่อนเขาถึงเลน"]],"e":"Handbook, Green Light: yield to pedestrians in the crosswalk and vehicles in the intersection.","et":"คู่มือ: ไฟเขียวต้องให้ทางคนเดินในทางม้าลายและรถในทางแยก","k":"text"},{"c":"rules","i":"","q":"Which vehicles are required to stop at railroad crossings, so you should leave extra space behind them?","qt":"รถประเภทใดต้องหยุดที่จุดตัดรถไฟ คุณจึงควรเว้นระยะข้างหลังมากขึ้น?","o":[["City and school buses and vehicles carrying hazardous materials","รถเมล์ รถโรงเรียน และรถขนวัตถุอันตราย"],["Motorcycles and mopeds","มอเตอร์ไซค์และโมเปด"],["Pickup trucks pulling trailers","รถกระบะลากพ่วง"],["Taxis and rental cars","แท็กซี่และรถเช่า"]],"e":"Handbook, Following: vehicles required to stop at railroad crossings include city and school buses and vehicles carrying hazardous materials.","et":"คู่มือ: รถเมล์ รถโรงเรียน และรถขนวัตถุอันตรายต้องหยุดที่จุดตัดรถไฟ","k":"text"},{"c":"rules","i":"","q":"A farm vehicle displaying the slow-moving vehicle emblem is designed to travel at less than:","qt":"รถเกษตรที่ติดสัญลักษณ์รถช้า ออกแบบให้วิ่งความเร็วต่ำกว่า:","o":[["25 mph","25 ไมล์/ชม."],["15 mph","15 ไมล์/ชม."],["35 mph","35 ไมล์/ชม."],["45 mph","45 ไมล์/ชม."]],"e":"Handbook, Slow Moving Vehicles: farm vehicles designed for operation at speeds less than 25 MPH must display this sign.","et":"คู่มือ: รถเกษตรที่ออกแบบให้วิ่งต่ำกว่า 25 ไมล์/ชม. ต้องติดป้ายนี้","k":"text"},{"c":"rules","i":"","q":"Your vehicle catches fire. Which is correct?","qt":"รถของคุณเกิดไฟไหม้ ข้อใดถูกต้อง?","o":[["Get out, call 911, and never use water on a gasoline or diesel fire","ออกจากรถ โทร 911 และห้ามใช้น้ำดับไฟน้ำมัน"],["Pour water on the engine immediately","ราดน้ำใส่เครื่องยนต์ทันที"],["Stay inside until help arrives","อยู่ในรถจนกว่าความช่วยเหลือจะมา"],["Open the hood wide to reach the fire","เปิดฝากระโปรงกว้างเพื่อดับไฟ"]],"e":"Handbook, Fire: exit the vehicle, call 911, use an extinguisher only if the fire is small, NEVER apply water to a gasoline or diesel fire, and get away if you can't put it out.","et":"คู่มือ: ออกจากรถ โทร 911 ใช้ถังดับเพลิงถ้าไฟเล็ก ห้ามใช้น้ำกับไฟน้ำมัน","k":"text"},{"c":"signs","i":"W4-2","q":"You are in the left lane and see this sign. What should you do?","qt":"คุณอยู่เลนซ้ายและเห็นป้ายนี้ ควรทำอย่างไร?","o":[["Your lane is ending; signal and merge right when there is a safe gap","เลนของคุณกำลังจะหมด เปิดไฟและเข้าเลนขวาเมื่อมีช่องปลอดภัย"],["Traffic from the right will merge into your lane; make room","รถทางขวาจะเข้ามาในเลนคุณ ให้เว้นที่"],["A new lane is being added on the right; no merging needed","มีเลนเพิ่มทางขวา ไม่ต้องเบี่ยง"],["The divided highway ends; keep right","ทางแบ่งสิ้นสุด ชิดขวา"]],"e":"Handbook, Warning Signs: Reduction of Lanes—a lane ends and traffic must merge; drivers in the continuing lane should allow others to merge smoothly. (Merging Traffic = another lane joins yours; Added Lane = entering traffic gets its own lane.)","et":"คู่มือ: ป้ายเลนสิ้นสุด—เลนที่แสดงกำลังหมด ให้เข้าเลนที่เหลือ","k":"text"},{"c":"signs","i":"W4-1","q":"You are driving in the right lane of a highway and see this sign. What does it warn you about?","qt":"คุณขับเลนขวาบนทางหลวงและเห็นป้ายนี้ ป้ายเตือนเรื่องอะไร?","o":[["Traffic may merge into your lane from the right; adjust speed to let it in","รถอาจเข้ามาในเลนคุณจากทางขวา ปรับความเร็วให้เข้า"],["Your lane ends; you must merge left","เลนคุณสิ้นสุด ต้องเข้าซ้าย"],["An added lane begins; entering traffic will not merge","เลนเพิ่ม รถที่เข้าจะไม่เบี่ยงเข้ามา"],["A side road enters from the right with a stop sign","ถนนรองเข้าทางขวามีป้ายหยุด"]],"e":"Handbook, Warning Signs: Merging Traffic—ahead another traffic lane joins the one you are on. Watch for other traffic and yield the right-of-way when necessary.","et":"คู่มือ: ป้ายรถรวมเลน—ข้างหน้ามีเลนอื่นมารวมกับเลนคุณ ระวังและให้ทางเมื่อจำเป็น","k":"text"},{"c":"signs","i":"W6-2","q":"What does this sign tell you?","qt":"ป้ายนี้บอกอะไร?","o":[["The divided highway ends; traffic will be two-way with no median ahead","ทางแบ่งสิ้นสุด ข้างหน้าเป็นถนนสองทางไม่มีเกาะกลาง"],["A divided highway begins; keep right of the median","ทางแบ่งเริ่มต้น ชิดขวาของเกาะกลาง"],["Two lanes merge into one","สองเลนรวมเป็นหนึ่ง"],["Road narrows from both sides","ถนนแคบลงทั้งสองข้าง"]],"e":"Handbook, Warning Signs: Divided Highway Ends—the divided highway ends 350 to 500 feet ahead; you will then be on a roadway with two-way traffic. Keep to the right.","et":"คู่มือ: ทางแบ่งสิ้นสุดในอีก 350–500 ฟุต จากนั้นเป็นถนนสองทาง ชิดขวา","k":"text"},{"c":"signs","i":"W14-3","q":"This pennant-shaped sign is posted on the LEFT side of a two-lane road. It means:","qt":"ป้ายรูปธงสามเหลี่ยมนี้ติดด้านซ้ายของถนนสองเลน หมายความว่า:","o":[["You are entering a no-passing zone","คุณกำลังเข้าเขตห้ามแซง"],["Yield to oncoming traffic","ให้ทางรถสวน"],["Passing is allowed with care","แซงได้อย่างระวัง"],["Road narrows on the left","ถนนแคบลงทางซ้าย"]],"e":"Handbook: the pennant-shaped No Passing Zone sign is placed on the left side of the road and marks the beginning of a no-passing zone.","et":"คู่มือ: ป้ายธงสามเหลี่ยมติดด้านซ้ายถนน แสดงจุดเริ่มเขตห้ามแซง","k":"text"},{"c":"signs","i":"W1-2L","q":"How is this sign different from a \"sharp turn\" sign?","qt":"ป้ายนี้ต่างจากป้าย \"เลี้ยวหักศอก\" อย่างไร?","o":[["It shows a gradual curve, so the road bends less sharply","แสดงทางโค้งค่อยๆ ถนนโค้งน้อยกว่า"],["It shows a winding road with three or more curves","แสดงทางคดเคี้ยวสามโค้งขึ้นไป"],["It means the road turns sharply and you must slow a lot","ถนนหักศอกต้องลดความเร็วมาก"],["It means a side road enters on the curve","มีถนนรองเข้ามาในโค้ง"]],"e":"Handbook, Warning Signs: a curved arrow = curve (gradual); a bent arrow = sharp turn; a squiggly arrow = winding road (series of curves).","et":"คู่มือ: ลูกศรโค้ง=ทางโค้ง; ลูกศรหักมุม=เลี้ยวหักศอก; ลูกศรคดเคี้ยว=ทางคดเคี้ยว","k":"text"},{"c":"signs","i":"W3-1","q":"You see this sign. What should you do?","qt":"คุณเห็นป้ายนี้ ควรทำอย่างไร?","o":[["Be prepared to stop at a stop sign ahead","เตรียมหยุดที่ป้ายหยุดข้างหน้า"],["Stop right at this sign","หยุดตรงป้ายนี้"],["Yield to traffic at the next intersection","ให้ทางรถที่ทางแยกถัดไป"],["A traffic signal is ahead","มีสัญญาณไฟข้างหน้า"]],"e":"Handbook, Warning Signs: Stop Ahead—a stop sign is ahead; slow down and be prepared to stop. You do not stop at the warning sign itself.","et":"คู่มือ: ป้ายหยุดข้างหน้า—เตรียมหยุด ไม่ต้องหยุดที่ป้ายเตือนนี้","k":"text"},{"c":"signs","i":"S1-1","q":"You see this fluorescent yellow-green pentagon sign. What should you do?","qt":"คุณเห็นป้ายห้าเหลี่ยมสีเหลืองเขียวสะท้อนแสงนี้ ควรทำอย่างไร?","o":[["Slow down and watch for children; you are near a school zone or crossing","ชะลอและระวังเด็ก ใกล้เขตโรงเรียนหรือทางข้าม"],["Watch for pedestrians crossing in the middle of a block only","ระวังคนข้ามกลางถนนเท่านั้น"],["Watch for a playground; no speed change needed","ระวังสนามเด็กเล่น ไม่ต้องเปลี่ยนความเร็ว"],["Stop for a school bus stop ahead","หยุดที่ป้ายรถโรงเรียนข้างหน้า"]],"e":"Handbook, School Signs: the pentagon (five-sided) shape marks school zones and school crossings; slow down and watch for children.","et":"คู่มือ: ป้ายห้าเหลี่ยมแสดงเขตโรงเรียนและทางข้าม ชะลอและระวังเด็ก","k":"text"},{"c":"signs","i":"W10-1","q":"You see this round yellow sign. It means:","qt":"คุณเห็นป้ายกลมสีเหลืองนี้ หมายความว่า:","o":[["A railroad crossing is ahead; slow down, look, and listen","มีจุดตัดทางรถไฟข้างหน้า ชะลอ มองและฟัง"],["You are at the railroad crossing; yield to trains now","อยู่ที่จุดตัดรถไฟ ให้ทางรถไฟตอนนี้"],["Railroad tracks cross a side road ahead","รางรถไฟตัดผ่านถนนรองข้างหน้า"],["Do not stop on the tracks","ห้ามหยุดบนราง"]],"e":"Handbook, Railroad: the round Advance Warning sign is usually the first sign you see approaching a crossing; the crossbuc
