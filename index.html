<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b5cab"><title>Florida Driver Test Practice</title>
<style>
:root{--b:#0b5cab;--bg:#f2f5fa;--ok:#18a058;--bad:#d03050;--card:#fff;--tx:#1b2430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx);font-size:17px}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
.hb{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600}
.hb.on{background:#fff;color:var(--b)}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,40,80,.07);margin-bottom:14px}
.big{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,40,80,.07);font-size:17px;color:var(--tx)}
.big b{display:block;font-size:18px;margin-bottom:3px}.big small{color:#5b6675}
.big .ic{float:left;font-size:30px;margin-right:12px;line-height:44px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{font-size:24px;display:block;color:var(--b)}
.bar{height:8px;background:#dfe6f0;border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--b);transition:width .3s}
.qn{font-size:14px;color:#5b6675;display:flex;justify-content:space-between}
.q{font-size:19px;font-weight:600;margin:8px 0 12px;line-height:1.35}
.th{color:#7a3fb0;font-weight:500;font-size:16px;margin-top:4px}
.pic{border-radius:12px;overflow:hidden;margin-bottom:12px;background:#eef2f7}
.pic svg{display:block;width:100%;height:auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid #dbe2ec;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;font-size:17px;min-height:56px;color:var(--tx)}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:#e8eef7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--b);background:#eef5ff}
.opt.ok{border-color:var(--ok);background:#e9f8ef}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fdecef}.opt.bad .l{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .opt{flex-direction:column;align-items:center;justify-content:center;min-height:150px}
.grid .opt .l{flex:0 0 28px;width:28px}.grid .opt img{width:110px;height:110px;object-fit:contain}
.opt .tag{display:block;font-size:13px;font-weight:800;margin-top:4px;letter-spacing:.2px}
.opt.ok .tag{color:#137a3a}.opt.bad .tag{color:#c0182b}
.opt.ok{border-width:3px;box-shadow:0 0 0 2px #2fb36a55}.opt.bad{border-width:3px}
.opt.dim{opacity:.55}
.grid .opt .tag{text-align:center}
.exp{border-radius:12px;padding:12px;margin-top:4px;font-size:16px;line-height:1.4}
.exp.ok{background:#e9f8ef}.exp.bad{background:#fdecef}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e8ef;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.btn{border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:700;background:var(--b);color:#fff;flex:1;max-width:610px}
.btn.g{background:#e8eef7;color:var(--tx)}
.btn:disabled{opacity:.4}
.fc{perspective:1000px;height:360px;margin-bottom:12px}
.fci{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.f .fci{transform:rotateY(180deg)}
.fcs{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(20,40,80,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.fcs img{max-width:70%;max-height:230px}
.fcb{transform:rotateY(180deg);font-size:22px;font-weight:700}
.tag{display:inline-block;background:#e8eef7;border-radius:8px;padding:3px 8px;font-size:13px;margin-top:8px}
.res{font-size:46px;font-weight:800;text-align:center}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.rv{border-left:5px solid var(--bad);padding-left:10px;margin:12px 0}
.rv.okk{border-color:var(--ok)}
.muted{color:#5b6675;font-size:14px}
h2{font-size:20px;margin:6px 0 12px}
</style></head><body>
<header><button class="hb" id="home" onclick="go()">⌂</button><h1 id="ttl">FL Driver Test Practice</h1><button class="hb" id="thb" onclick="tgTh()">ไทย</button></header>

hould:","qt":"\"กฎความเร็วพื้นฐาน\" หมายความว่าคุณควร:","o":[["Drive at a speed that is safe for current conditions, even if below the limit","ขับด้วยความเร็วที่ปลอดภัยตามสภาพ แม้จะต่ำกว่าที่จำกัด"],["Always drive at the posted limit","ขับเท่าที่จำกัดเสมอ"],["Drive 5 mph over the limit","ขับเกินที่จำกัด 5 ไมล์/ชม."],["Match the speed of the fastest car","ขับให้เร็วเท่ารถที่เร็วที่สุด"]],"e":"Handbook, Speed: you must drive at a speed that is reasonable for conditions (rain, fog, traffic).","et":"คู่มือ: ต้องขับด้วยความเร็วที่เหมาะสมกับสภาพ (ฝน หมอก การจราจร)","k":"text"},{"c":"rules","i":"","q":"You should increase your following distance when:","qt":"คุณควรเพิ่มระยะห่างจากรถข้างหน้าเมื่อ:","o":[["The road is wet, it is dark, or you are behind a large truck or motorcycle","ถนนเปียก มืด หรืออยู่หลังรถบรรทุกใหญ่หรือมอเตอร์ไซค์"],["Traffic is light","รถน้อย"],["You are in a hurry","คุณรีบ"],["The car ahead is going fast","รถข้างหน้าขับเร็ว"]],"e":"Handbook, Following Distance: add space in bad weather, at night, and behind trucks and motorcycles.","et":"คู่มือ: เพิ่มระยะเมื่อสภาพอากาศไม่ดี กลางคืน และหลังรถบรรทุก/มอเตอร์ไซค์","k":"text"},{"c":"rules","i":"","q":"At an intersection with no signs or signals, two cars arrive at the same time. Who has the right-of-way?","qt":"ที่ทางแยกไม่มีป้ายหรือไฟ รถสองคันมาถึงพร้อมกัน ใครมีสิทธิ์ไปก่อน?","o":[["The vehicle on the right","รถที่อยู่ทางขวา"],["The vehicle on the left","รถที่อยู่ทางซ้าย"],["The larger vehicle","รถคันใหญ่กว่า"],["The faster vehicle","รถที่เร็วกว่า"]],"e":"Handbook, Right-of-Way: at an uncontrolled intersection, yield to the vehicle on your right if you arrive at the same time.","et":"คู่มือ สิทธิ์ทาง: ทางแยกไม่มีป้าย ให้ทางรถทางขวาถ้ามาถึงพร้อมกัน","k":"text"},{"c":"rules","i":"","q":"When turning left at an intersection, you must yield to:","qt":"เมื่อเลี้ยวซ้ายที่ทางแยก คุณต้องให้ทาง:","o":[["Oncoming traffic and pedestrians","รถที่วิ่งสวนมาและคนเดินเท้า"],["Only pedestrians","คนเดินเท้าเท่านั้น"],["Only vehicles behind you","รถข้างหลังเท่านั้น"],["No one if you have a green light","ไม่ต้องให้ใครถ้าไฟเขียว"]],"e":"Handbook, Right-of-Way: left-turning drivers yield to oncoming vehicles and pedestrians.","et":"คู่มือ: รถเลี้ยวซ้ายต้องให้ทางรถสวนและคนเดินเท้า","k":"text"},{"c":"rules","i":"","q":"If you are in an intersection when an emergency vehicle approaches, you should:","qt":"ถ้าคุณอยู่ในทางแยกขณะรถฉุกเฉินเข้ามา คุณควร:","o":[["Continue through the intersection, then pull to the right and stop","ขับผ่านทางแยกไปก่อน แล้วชิดขวาและหยุด"],["Stop immediately in the intersection","หยุดทันทีในทางแยก"],["Back up","ถอยหลัง"],["Turn left","เลี้ยวซ้าย"]],"e":"Handbook, Right-of-Way: never stop in an intersection; clear it first.","et":"คู่มือ: ห้ามหยุดในทางแยก ให้ผ่านออกไปก่อน","k":"text"},{"c":"rules","i":"","q":"The Move Over Law applies to stopped vehicles such as:","qt":"กฎหมาย Move Over ใช้กับรถที่จอดอยู่ เช่น:","o":[["Police, fire, ambulance, tow trucks, sanitation, utility and road maintenance vehicles","รถตำรวจ ดับเพลิง พยาบาล รถลาก รถเก็บขยะ รถสาธารณูปโภค และรถซ่อมถนน"],["Only police cars","รถตำรวจเท่านั้น"],["Only ambulances","รถพยาบาลเท่านั้น"],["Only school buses","รถโรงเรียนเท่านั้น"]],"e":"Handbook, Move Over Act: covers emergency, wrecker, sanitation, utility and road/bridge maintenance vehicles (and disabled vehicles showing hazard lights since 2024).","et":"คู่มือ: ครอบคลุมรถฉุกเฉิน รถลาก รถขยะ รถสาธารณูปโภค และรถซ่อมถนน (และรถเสียที่เปิดไฟฉุกเฉินตั้งแต่ปี 2024)","k":"text"},{"c":"rules","i":"","q":"Pedestrians in a marked crosswalk:","qt":"คนเดินเท้าในทางม้าลาย:","o":[["Have the right-of-way; you must stop for them","มีสิทธิ์ทาง คุณต้องหยุดให้"],["Must yield to cars","ต้องให้ทางรถ"],["Only have right-of-way at night","มีสิทธิ์ทางเฉพาะกลางคืน"],["Must run across","ต้องวิ่งข้าม"]],"e":"Handbook, Pedestrians: drivers must stop for pedestrians in crosswalks.","et":"คู่มือ: ผู้ขับต้องหยุดให้คนเดินเท้าในทางม้าลาย","k":"text"},{"c":"rules","i":"","q":"Funeral processions:","qt":"ขบวนแห่ศพ:","o":[["Have the right-of-way; do not cut into or join the procession","มีสิทธิ์ทาง ห้ามแทรกหรือเข้าร่วมขบวน"],["Must yield to all traffic","ต้องให้ทางรถทุกคัน"],["Must stop at every light","ต้องหยุดทุกไฟแดง"],["Can be passed on the right only","แซงได้ทางขวาเท่านั้น"]],"e":"Handbook, Right-of-Way: funeral processions have the right-of-way; do not drive between vehicles in the procession.","et":"คู่มือ: ขบวนแห่ศพมีสิทธิ์ทาง ห้ามขับแทรก","k":"text"},{"c":"rules","i":"","q":"A solid red traffic light means:","qt":"ไฟแดงนิ่งหมายถึง:","o":[["Come to a complete stop behind the stop line and wait for green","หยุดสนิทหลังเส้นหยุดและรอไฟเขียว"],["Slow down and go","ชะลอแล้วไป"],["Stop only if cars are coming","หยุดเฉพาะเมื่อมีรถมา"],["Go if turning left","ไปได้ถ้าเลี้ยวซ้าย"]],"e":"Handbook, Traffic Signals: red means stop; remain stopped until green (except legal turns on red).","et":"คู่มือ ไฟจราจร: ไฟแดงต้องหยุด รอจนไฟเขียว (ยกเว้นการเลี้ยวที่อนุญาต)","k":"text"},{"c":"rules","i":"","q":"A steady yellow light means:","qt":"ไฟเหลืองนิ่งหมายถึง:","o":[["The light is about to turn red; stop if you can do so safely","ไฟกำลังจะเปลี่ยนเป็นแดง หยุดถ้าทำได้อย่างปลอดภัย"],["Speed up to beat the red","เร่งให้ทันก่อนไฟแดง"],["Stop immediately even if unsafe","หยุดทันทีแม้ไม่ปลอดภัย"],["Go, the road is clear","ไปได้ ทางว่าง"]],"e":"Handbook, Traffic Signals: yellow warns that red is coming.","et":"คู่มือ: ไฟเหลืองเตือนว่าจะเป็นไฟแดง","k":"text"},{"c":"rules","i":"","q":"A flashing red light means:","qt":"ไฟแดงกะพริบหมายถึง:","o":[["Stop completely, then go when safe (same as a stop sign)","หยุดสนิท แล้วไปเมื่อปลอดภัย (เหมือนป้ายหยุด)"],["Slow down","ชะลอ"],["The light is broken; go","ไฟเสีย ไปได้"],["Yield only","ให้ทางเท่านั้น"]],"e":"Handbook, Traffic Signals: flashing red = stop sign.","et":"คู่มือ: ไฟแดงกะพริบ = ป้ายหยุด","k":"text"},{"c":"rules","i":"","q":"A flashing yellow light means:","qt":"ไฟเหลืองกะพริบหมายถึง:","o":[["Slow down and proceed with caution","ชะลอและไปอย่างระมัดระวัง"],["Stop completely","หยุดสนิท"],["Speed up","เร่งความเร็ว"],["Road closed","ถนนปิด"]],"e":"Handbook, Traffic Signals: flashing yellow means caution.","et":"คู่มือ: ไฟเหลืองกะพริบหมายถึงระวัง","k":"text"},{"c":"rules","i":"","q":"A green arrow means:","qt":"ลูกศรเขียวหมายถึง:","o":[["You may go in the direction of the arrow (protected turn) after yielding to anyone still in the intersection","ไปตามทิศลูกศรได้ (เลี้ยวแบบมีสิทธิ์) หลังให้ทางผู้ที่ยังอยู่ในทางแยก"],["Wait for oncoming traffic always","รอรถสวนเสมอ"],["Stop","หยุด"],["Turn is not allowed","ห้ามเลี้ยว"]],"e":"Handbook, Traffic Signals: green arrow = protected movement in that direction.","et":"คู่มือ: ลูกศรเขียว = เคลื่อนที่ตามทิศได้อย่างมีสิทธิ์","k":"text"},{"c":"rules","i":"","q":"A flashing yellow arrow for left turns means:","qt":"ลูกศรเหลืองกะพริบสำหรับเลี้ยวซ้ายหมายถึง:","o":[["You may turn left after yielding to oncoming traffic and pedestrians","เลี้ยวซ้ายได้หลังให้ทางรถสวนและคนเดินเท้า"],["Left turns are prohibited","ห้ามเลี้ยวซ้าย"],["You have a protected turn","เลี้ยวได้โดยมีสิทธิ์ทาง"],["Stop and wait","หยุดรอ"]],"e":"Handbook, Traffic Signals: flashing yellow arrow = permitted (unprotected) turn; yield first.","et":"คู่มือ: ลูกศรเหลืองกะพริบ = เลี้ยวได้แต่ต้องให้ทางก่อน","k":"text"},{"c":"rules","i":"","q":"A steady green light means:","qt":"ไฟเขียวนิ่งหมายถึง:","o":[["Go if the intersection is clear, yielding to pedestrians and vehicles already in it","ไปได้ถ้าทางแยกว่าง ให้ทางคนเดินและรถที่อยู่ในทางแยก"],["Go without looking","ไปได้โดยไม่ต้องมอง"],["You have the right-of-way over everyone","คุณมีสิทธิ์ทางเหนือทุกคน"],["Stop","หยุด"]],"e":"Handbook, Traffic Signals: green means go when the way is clear.","et":"คู่มือ: ไฟเขียว ไปได้เมื่อทางว่าง","k":"text"},{"c":"rules","i":"","q":"The hand signal for a LEFT turn is:","qt":"สัญญาณมือสำหรับเลี้ยวซ้ายคือ:","o":[["Left arm extended straight out","ยื่นแขนซ้ายออกไปตรงๆ"],["Left arm bent up","งอแขนซ้ายขึ้น"],["Left arm bent down","งอแขนซ้ายลง"],["Waving the arm","โบกแขน"]],"e":"Handbook, Hand Signals: arm straight out = left turn.","et":"คู่มือ สัญญาณมือ: แขนเหยียดตรง = เลี้ยวซ้าย","k":"text"},{"c":"rules","i":"","q":"The hand signal for a RIGHT turn is:","qt":"สัญญาณมือสำหรับเลี้ยวขวาคือ:","o":[["Left arm bent upward at the elbow","งอแขนซ้ายขึ้นที่ข้อศอก"],["Left arm straight out","ยื่นแขนซ้ายตรง"],["Left arm pointing down","ชี้แขนซ้ายลง"],["Right arm out the window","ยื่นแขนขวาออก"]],"e":"Handbook, Hand Signals: arm bent up = right turn.","et":"คู่มือ: แขนงอขึ้น = เลี้ยวขวา","k":"text"},{"c":"rules","i":"","q":"The hand signal for STOP or SLOW is:","qt":"สัญญาณมือสำหรับหยุดหรือชะลอคือ:","o":[["Left arm bent downward","งอแขนซ้ายลง"],["Left arm bent upward","งอแขนซ้ายขึ้น"],["Left arm straight out","ยื่นแขนซ้ายตรง"],["Thumb up","ยกนิ้วโป้ง"]],"e":"Handbook, Hand Signals: arm bent down = stop/slow.","et":"คู่มือ: แขนงอลง = หยุด/ชะลอ","k":"text"},{"c":"rules","i":"","q":"When making a right turn, you should:","qt":"เมื่อเลี้ยวขวา คุณควร:","o":[["Stay close to the right curb and turn into the right lane","ชิดขอบขวาและเลี้ยวเข้าเลนขวาสุด"],["Swing wide to the left first","เบี่ยงไปทางซ้ายก่อน"],["Turn into the left lane","เลี้ยวเข้าเลนซ้าย"],["Turn from the center lane","เลี้ยวจากเลนกลาง"]],"e":"Handbook, Turns: right turns are made from the right lane into the right lane.","et":"คู่มือ: เลี้ยวขวาจากเลนขวาเข้าเลนขวา","k":"text"},{"c":"rules","i":"","q":"When turning left from a two-way street onto a two-way street, you should:","qt":"เมื่อเลี้ยวซ้ายจากถนนสองทิศทางไปถนนสองทิศทาง คุณควร:","o":[["Start from the lane closest to the center line and end just right of the center line","เริ่มจากเลนที่ใกล้เส้นกึ่งกลางที่สุด และเข้าเลนทางขวาของเส้นกึ่งกลาง"],["Start from the right lane","เริ่มจากเลนขวา"],["Cut the corner","ตัดมุม"],["End in the far right lane","เข้าเลนขวาสุด"]],"e":"Handbook, Turns: left turns go from the left-most lane to the lane just right of center.","et":"คู่มือ: เลี้ยวซ้ายจากเลนซ้ายสุดเข้าเลนที่อยู่ขวาของเส้นกลาง","k":"text"},{"c":"rules","i":"","q":"The center lane marked with yellow lines and left-turn arrows (two-way left turn lane) is used for:","qt":"เลนกลางที่มีเส้นเหลืองและลูกศรเลี้ยวซ้าย (เลนเลี้ยวซ้ายสองทิศทาง) ใช้สำหรับ:","o":[["Making left turns from both directions","เลี้ยวซ้ายจากทั้งสองทิศทาง"],["Passing other vehicles","แซงรถอื่น"],["Driving long distances","ขับระยะไกล"],["Parking","จอดรถ"]],"e":"Handbook, Lane Markings: shared center lanes are only for left turns (including U-turns where allowed).","et":"คู่มือ: เลนกลางร่วมใช้สำหรับเลี้ยวซ้ายเท่านั้น","k":"text"},{"c":"rules","i":"","q":"Before turning right across a bike lane, you should:","qt":"ก่อนเลี้ยวขวาผ่านเลนจักรยาน คุณควร:","o":[["Yield to bicyclists, then merge into the bike lane only when clear (if allowed) and turn","ให้ทางจักรยาน แล้วเข้าเลนจักรยานเมื่อว่าง (ถ้าอนุญาต) แล้วเลี้ยว"],["Speed up ahead of the bicycle","เร่งแซงจักรยาน"],["Honk at the bicycle","บีบแตรใส่จักรยาน"],["Turn from the left lane","เลี้ยวจากเลนซ้าย"]],"e":"Handbook, Bicycles: yield to bicycles in the bike lane before turning.","et":"คู่มือ: ให้ทางจักรยานในเลนจักรยานก่อนเลี้ยว","k":"text"},{"c":"rules","i":"","q":"Motorcycles are entitled to:","qt":"รถจักรยานยนต์มีสิทธิ์:","o":[["A full lane width; do not share the lane with them","ใช้เลนเต็มความกว้าง ห้ามขับร่วมเลน"],["Half a lane","ครึ่งเลน"],["Only the shoulder","ไหล่ทางเท่านั้น"],["Ride between cars","ขี่ระหว่างรถ"]],"e":"Handbook, Motorcycles: motorcycles get the full use of a lane.","et":"คู่มือ: มอเตอร์ไซค์มีสิทธิ์ใช้เลนเต็ม","k":"text"},{"c":"rules","i":"","q":"Large trucks have big blind spots called \"No-Zones\". You should:","qt":"รถบรรทุกใหญ่มีจุดบอดกว้างเรียกว่า \"No-Zone\" คุณควร:","o":[["Avoid lingering beside or close behind them; if you can't see the driver in their mirror, they can't see you","ไม่ขับค้างข้างหรือชิดหลัง ถ้าคุณไม่เห็นคนขับในกระจก เขาก็ไม่เห็นคุณ"],["Drive right beside them","ขับข้างๆ"],["Follow closely to save fuel","ตามติดเพื่อประหยัดน้ำมัน"],["Cut in front closely after passing","ตัดหน้าใกล้ๆ หลังแซง"]],"e":"Handbook, Sharing the Road – Trucks: stay out of No-Zones.","et":"คู่มือ รถบรรทุก: อยู่ห่างจากจุดบอด","k":"text"},{"c":"rules","i":"","q":"When a large truck is making a wide right turn, you should:","qt":"เมื่อรถบรรทุกใหญ่เลี้ยวขวาแบบกว้าง คุณควร:","o":[["Stay back and do not try to squeeze in on its right side","อยู่ห่างและไม่แทรกทางขวาของมัน"],["Pass on the right","แซงทางขวา"],["Honk","บีบแตร"],["Drive beside it","ขับข้างๆ"]],"e":"Handbook, Trucks: trucks swing wide; never get between a turning truck and the curb.","et":"คู่มือ: รถบรรทุกเลี้ยวกว้าง ห้ามแทรกระหว่างรถกับขอบทาง","k":"text"},{"c":"rules","i":"","q":"When should you use your headlights?","qt":"ควรเปิดไฟหน้าเมื่อใด?","o":[["From sunset to sunrise, and in rain, smoke or fog","ตั้งแต่พระอาทิตย์ตกถึงขึ้น และเมื่อฝนตก มีควันหรือหมอก"],["Only after midnight","หลังเที่ยงคืนเท่านั้น"],["Only on highways","บนทางหลวงเท่านั้น"],["Only when it is completely dark","เมื่อมืดสนิทเท่านั้น"]],"e":"Handbook, Headlights: required sunset to sunrise and during rain, smoke or fog.","et":"คู่มือ ไฟหน้า: ต้องเปิดตั้งแต่พระอาทิตย์ตกถึงขึ้น และเมื่อฝน ควัน หมอก","k":"text"},{"c":"rules","i":"","q":"If an oncoming driver does not dim their high beams, you should:","qt":"ถ้ารถสวนไม่ลดไฟสูง คุณควร:","o":[["Look toward the right edge of your lane","มองไปที่ขอบขวาของเลนคุณ"],["Look directly at the lights","มองตรงไปที่ไฟ"],["Turn on your high beams too","เปิดไฟสูงตอบ"],["Close your eyes briefly","หลับตาชั่วครู่"]],"e":"Handbook, Night Driving: avoid glare by looking to the right side of the road.","et":"คู่มือ: หลีกเลี่ยงแสงจ้าโดยมองขอบขวาของถนน","k":"text"},{"c":"rules","i":"","q":"Hazard (emergency flashing) lights should be used:","qt":"ไฟฉุกเฉิน (ไฟกะพริบ) ควรใช้:","o":[["When your vehicle is stopped or disabled on or near the road","เมื่อรถจอดเสียบนหรือใกล้ถนน"],["To signal that you are about to turn","เพื่อบอกว่าจะเลี้ยว"],["When parking illegally","เมื่อจอดผิดที่"],["When driving fast","เมื่อขับเร็ว"]],"e":"Handbook, Hazard Lights: use when stopped/disabled; Florida generally prohibits using flashers while driving (allowed in limited cases since 2021 on high-speed roads in very heavy rain/fog).","et":"คู่มือ: ใช้เมื่อรถจอดหรือเสีย ฟลอริดาจำกัดการใช้ขณะขับ","k":"text"},{"c":"rules","i":"","q":"If your vehicle breaks down on the highway, you should first:","qt":"ถ้ารถเสียบนทางหลวง สิ่งแรกที่ควรทำคือ:","o":[["Pull as far off the road as possible and turn on hazard lights","จอดชิดออกนอกถนนให้มากที่สุดและเปิดไฟฉุกเฉิน"],["Stop in your lane","หยุดในเลน"],["Walk along the highway","เดินไปตามทางหลวง"],["Open all doors","เปิดประตูทุกบาน"]],"e":"Handbook, Emergencies: get off the road and warn others.","et":"คู่มือ เหตุฉุกเฉิน: ออกนอกถนนและเตือนผู้อื่น","k":"text"},{"c":"rules","i":"","q":"If a tire blows out while driving, you should:","qt":"ถ้ายางระเบิดขณะขับ คุณควร:","o":[["Hold the steering wheel firmly, ease off the gas, and slow down gradually","จับพวงมาลัยแน่น ถอนคันเร่ง และชะลออย่างค่อยเป็นค่อยไป"],["Brake hard immediately","เบรกแรงทันที"],["Turn sharply to the shoulder","หักเข้าไหล่ทาง"],["Accelerate","เร่งความเร็ว"]],"e":"Handbook, Emergencies – Blowouts: don't brake hard; let the car slow, then pull off.","et":"คู่มือ: ห้ามเบรกแรง ให้รถชะลอเองแล้วจอดข้างทาง","k":"text"},{"c":"rules","i":"","q":"Hydroplaning is most likely when:","qt":"การเหินน้ำ (hydroplaning) เกิดได้ง่ายที่สุดเมื่อ:","o":[["Driving fast on wet roads, especially at the start of a rain","ขับเร็วบนถนนเปียก โดยเฉพาะตอนฝนเริ่มตก"],["Driving slowly on dry roads","ขับช้าบนถนนแห้ง"],["Parking","จอดรถ"],["Driving on gravel","ขับบนกรวด"]],"e":"Handbook, Wet Roads: tires can ride on water at higher speeds; slow down in rain.","et":"คู่มือ ถนนเปียก: ยางอาจลอยบนน้ำเมื่อเร็ว ให้ชะลอเมื่อฝนตก","k":"text"},{"c":"rules","i":"","q":"Roads are most slippery:","qt":"ถนนลื่นที่สุดเมื่อ:","o":[["During the first few minutes of a rain","ช่วงไม่กี่นาทีแรกที่ฝนตก"],["After hours of heavy rain","หลังฝนตกหนักหลายชั่วโมง"],["When dry","เมื่อแห้ง"],["At noon","ตอนเที่ยง"]],"e":"Handbook, Wet Roads: oil and dirt mix with the first rain, making roads slick.","et":"คู่มือ: น้ำมันและฝุ่นผสมกับฝนแรกทำให้ถนนลื่น","k":"text"},{"c":"rules","i":"","q":"If your brakes fail, you should first:","qt":"ถ้าเบรกเสีย สิ่งแรกที่ควรทำคือ:","o":[["Pump the brake pedal quickly, then use the parking brake and shift to a lower gear","ปั๊มเบรกเร็วๆ แล้วใช้เบรกมือและเปลี่ยนเกียร์ต่ำ"],["Turn off the engine","ดับเครื่อง"],["Jump out","กระโดดออกจากรถ"],["Speed up","เร่งความเร็ว"]],"e":"Handbook, Emergencies – Brake Failure: pump brakes, use parking brake gradually, downshift.","et":"คู่มือ เบรกเสีย: ปั๊มเบรก ใช้เบรกมือทีละน้อย เปลี่ยนเกียร์ต่ำ","k":"text"},{"c":"rules","i":"","q":"Before driving across a railroad crossing, you should:","qt":"ก่อนขับข้ามทางรถไฟ คุณควร:","o":[["Slow down, look both ways and listen for trains","ชะลอ มองทั้งสองทาง และฟังเสียงรถไฟ"],["Speed up","เร่ง"],["Stop on the tracks to look","หยุดบนรางเพื่อมอง"],["Shift gears while on the tracks","เปลี่ยนเกียร์บนราง"]],"e":"Handbook, Railroad Crossings: always look, listen and be ready to stop.","et":"คู่มือ ทางรถไฟ: มอง ฟัง และพร้อมหยุดเสมอ","k":"text"},{"c":"rules","i":"","q":"If your vehicle stalls on railroad tracks and a train is coming, you should:","qt":"ถ้ารถดับบนรางรถไฟและมีรถไฟมา คุณควร:","o":[["Get everyone out immediately and move away from the tracks toward the train at an angle","พาทุกคนออกทันทีและเดินห่างจากรางเฉียงไปทางที่รถไฟมา"],["Try to restart the engine","พยายามสตาร์ทรถ"],["Stay in the car","อยู่ในรถ"],["Push the car","เข็นรถ"]],"e":"Handbook, Railroad Crossings: leave the vehicle immediately; move away at an angle toward the train so debris doesn't hit you.","et":"คู่มือ: ออกจากรถทันที เดินเฉียงไปทางที่รถไฟมาเพื่อหลบเศษชิ้นส่วน","k":"text"},{"c":"rules","i":"","q":"Which vehicles must always stop at railroad crossings, even if no train is coming?","qt":"รถประเภทใดต้องหยุดที่ทางรถไฟเสมอ แม้ไม่มีรถไฟ?","o":[["School buses, and vehicles carrying passengers for hire or hazardous materials","รถโรงเรียน รถรับจ้างโดยสาร และรถบรรทุกวัตถุอันตราย"],["Motorcycles","มอเตอร์ไซค์"],["All cars","รถยนต์ทุกคัน"],["Pickup trucks","รถกระบะ"]],"e":"Handbook, Railroad Crossings: be ready to stop behind buses and hazmat trucks.","et":"คู่มือ: เตรียมหยุดเมื่ออยู่หลังรถโรงเรียนและรถวัตถุอันตราย","k":"text"},{"c":"rules","i":"","q":"Parking in a space reserved for persons with disabilities without a permit can result in a fine of:","qt":"การจอดในที่ผู้พิการโดยไม่มีใบอนุญาตอาจถูกปรับ:","o":[["Up to $250","สูงสุด $250"],["$10","$10"],["$25","$25"],["No fine","ไม่มีค่าปรับ"]],"e":"Handbook, Parking: illegally parking in a disabled space is a $250 fine.","et":"คู่มือ: จอดในที่ผู้พิการผิดกฎหมายปรับ $250","k":"text"},{"c":"fines","i":"","q":"In Florida, a driver 21 or older is considered DUI with a blood or breath alcohol level of:","qt":"ในฟลอริดา ผู้ขับอายุ 21 ปีขึ้นไปถือว่าเมาแล้วขับเมื่อมีระดับแอลกอฮอล์ในเลือดหรือลมหายใจ:","o":[["0.08 or higher","0.08 ขึ้นไป"],["0.10 or higher","0.10 ขึ้นไป"],["0.05 or higher","0.05 ขึ้นไป"],["0.15 or higher","0.15 ขึ้นไป"]],"e":"Handbook, Alcohol & Drugs: DUI at .08 BAC or higher, or when normal faculties are impaired.","et":"คู่มือ แอลกอฮอล์: เมาแล้วขับเมื่อ BAC 0.08 ขึ้นไป หรือเมื่อความสามารถลดลง","k":"text"},{"c":"fines","i":"","q":"For a driver under 21, Florida's \"Zero Tolerance\" law sets the BAC limit at:","qt":"สำหรับผู้ขับอายุต่ำกว่า 21 ปี กฎหมาย \"Zero Tolerance\" กำหนด BAC ไว้ที่:","o":[["0.02","0.02"],["0.08","0.08"],["0.05","0.05"],["0.10","0.10"]],"e":"Handbook, Zero Tolerance: under 21 with .02 or more = license suspended 6 months.","et":"คู่มือ: อายุต่ำกว่า 21 ปี BAC 0.02 ขึ้นไป ถูกพักใบขับขี่ 6 เดือน","k":"text"},{"c":"fines","i":"","q":"Florida's Implied Consent Law means that by driving, you have agreed to:","qt":"กฎหมายยินยอมโดยปริยาย (Implied Consent) ของฟลอริดาหมายความว่า เมื่อขับรถ คุณยินยอม:","o":[["Take a breath, blood or urine test if lawfully asked by an officer","ตรวจลมหายใจ เลือด หรือปัสสาวะ เมื่อเจ้าหน้าที่ขอโดยชอบด้วยกฎหมาย"],["Let police search your home","ให้ตำรวจค้นบ้าน"],["Pay all tickets without court","จ่ายค่าปรับโดยไม่ขึ้นศาล"],["Carry a passenger","รับผู้โดยสาร"]],"e":"Handbook, Implied Consent: refusing a lawful test results in license suspension.","et":"คู่มือ: ปฏิเสธการตรวจทำให้ถูกพักใบขับขี่","k":"text"},{"c":"fines","i":"","q":"Which contains the same amount of alcohol?","qt":"ข้อใดมีปริมาณแอลกอฮอล์เท่ากัน?","o":[["12 oz of beer, 5 oz of wine, and 1.5 oz of 80-proof liquor","เบียร์ 12 ออนซ์ ไวน์ 5 ออนซ์ และเหล้า 80 ดีกรี 1.5 ออนซ์"],["12 oz of beer and 12 oz of wine","เบียร์ 12 ออนซ์และไวน์ 12 ออนซ์"],["1 oz of beer and 12 oz of liquor","เบียร์ 1 ออนซ์และเหล้า 12 ออนซ์"],["Beer has no alcohol","เบียร์ไม่มีแอลกอฮอล์"]],"e":"Handbook, Alcohol: a standard drink of each contains about the same alcohol.","et":"คู่มือ: เครื่องดื่มมาตรฐานแต่ละชนิดมีแอลกอฮอล์ใกล้เคียงกัน","k":"text"},{"c":"fines","i":"","q":"After a first DUI conviction, a court may order your vehicle impounded for:","qt":"หลังความผิดเมาแล้วขับครั้งแรก ศาลอาจสั่งยึดรถ:","o":[["10 days","10 วัน"],["1 day","1 วัน"],["1 year","1 ปี"],["Never","ไม่ยึด"]],"e":"Handbook, DUI Penalties: vehicle impoundment/immobilization 10 days for a first conviction.","et":"คู่มือ: ยึดรถ 10 วันสำหรับครั้งแรก","k":"text"},{"c":"fines","i":"","q":"A moving violation that results in a crash adds how many points?","qt":"การทำผิดกฎจราจรที่ทำให้เกิดอุบัติเหตุได้กี่แต้ม?","o":[["4 points","4 แต้ม"],["1 point","1 แต้ม"],["2 points","2 แต้ม"],["12 points","12 แต้ม"]],"e":"Handbook, Point System: moving violation resulting in a crash = 4 points.","et":"คู่มือ: ทำผิดจนเกิดอุบัติเหตุ = 4 แต้ม","k":"text"},{"c":"fines","i":"","q":"Most other moving violations (such as an improper turn or failure to yield) add:","qt":"การทำผิดกฎจราจรอื่นๆ ส่วนใหญ่ (เช่น เลี้ยวผิด ไม่ให้ทาง) ได้:","o":[["3 points","3 แต้ม"],["0 points","0 แต้ม"],["6 points","6 แต้ม"],["10 points","10 แต้ม"]],"e":"Handbook, Point System: other moving violations = 3 points.","et":"คู่มือ: ความผิดอื่นๆ = 3 แต้ม","k":"text"},{"c":"fines","i":"","q":"Traffic fines are doubled in:","qt":"ค่าปรับจราจรเพิ่มเป็นสองเท่าใน:","o":[["School zones and work zones when workers are present","เขตโรงเรียนและเขตก่อสร้างเมื่อมีคนงาน"],["Parking lots","ลานจอดรถ"],["All residential streets","ถนนในหมู่บ้านทั้งหมด"],["Rural roads","ถนนชนบท"]],"e":"Handbook, Fines: speeding fines are doubled in school zones and in work zones with workers present.","et":"คู่มือ: ค่าปรับขับเร็วเป็นสองเท่าในเขตโรงเรียนและเขตก่อสร้างที่มีคนงาน","k":"text"},{"c":"fines","i":"","q":"Who is responsible for making sure passengers under 18 wear seat belts?","qt":"ใครรับผิดชอบให้ผู้โดยสารอายุต่ำกว่า 18 คาดเข็มขัด?","o":[["The driver","ผู้ขับ"],["The passenger","ผู้โดยสาร"],["The passenger's parents only","พ่อแม่ของผู้โดยสารเท่านั้น"],["No one","ไม่มีใคร"]],"e":"Handbook, Safety Belts: the driver gets the ticket for unbelted passengers under 18.","et":"คู่มือ: ผู้ขับถูกปรับถ้าผู้โดยสารต่ำกว่า 18 ไม่คาดเข็มขัด","k":"text"},{"c":"fines","i":"","q":"If you fail to maintain required insurance, your:","qt":"ถ้าคุณไม่มีประกันตามกฎหมาย:","o":[["Driver license and registration can be suspended (for up to 3 years)","ใบขับขี่และทะเบียนรถอาจถูกพัก (นานถึง 3 ปี)"],["Car gets free insurance","ได้ประกันฟรี"],["Nothing happens","ไม่มีอะไรเกิดขึ้น"],["Taxes go down","ภาษีลดลง"]],"e":"Handbook, Insurance: lapse can suspend license and registration.","et":"คู่มือ: ขาดประกันอาจถูกพักใบขับขี่และทะเบียน","k":"text"},{"c":"fines","i":"","q":"You must report a crash to police if it involves:","qt":"คุณต้องแจ้งตำรวจเรื่องอุบัติเหตุถ้า:","o":[["Injury, death, or property damage of $500 or more","มีผู้บาดเจ็บ เสียชีวิต หรือความเสียหาย $500 ขึ้นไป"],["Only death","มีผู้เสียชีวิตเท่านั้น"],["Only damage over $10,000","ความเสียหายเกิน $10,000 เท่านั้น"],["Never","ไม่ต้องแจ้ง"]],"e":"Handbook, Crashes: report crashes with injury, death or $500+ damage.","et":"คู่มือ อุบัติเหตุ: แจ้งเมื่อมีผู้บาดเจ็บ เสียชีวิต หรือเสียหาย $500 ขึ้นไป","k":"text"},{"c":"fines","i":"","q":"New Florida residents with a valid out-of-state license must get a Florida license within:","qt":"ผู้อยู่อาศัยใหม่ในฟลอริดาที่มีใบขับขี่รัฐอื่นต้องทำใบขับขี่ฟลอริดาภายใน:","o":[["30 days of becoming a resident","30 วันหลังเป็นผู้อยู่อาศัย"],["1 year","1 ปี"],["6 months","6 เดือน"],["They never need one","ไม่ต้องทำ"]],"e":"Handbook, Licensing: new residents must obtain a FL license within 30 days.","et":"คู่มือ: ผู้อยู่อาศัยใหม่ต้องทำใบขับขี่ภายใน 30 วัน","k":"text"},{"c":"fines","i":"","q":"What course must first-time Florida drivers complete before applying for a license?","qt":"ผู้ขับครั้งแรกในฟลอริดาต้องเรียนหลักสูตรใดก่อนสมัครใบขับขี่?","o":[["The Traffic Law and Substance Abuse Education (TLSAE / DATA) course","หลักสูตรกฎจราจรและการศึกษาเรื่องสารเสพติด (TLSAE / DATA)"],["A first-aid course","หลักสูตรปฐมพยาบาล"],["A mechanic course","หลักสูตรช่าง"],["No course is needed","ไม่ต้องเรียน"]],"e":"Handbook, Licensing: TLSAE (Drug and Alcohol Traffic Awareness) course is required for first-time drivers.","et":"คู่มือ: ผู้ขับครั้งแรกต้องเรียน TLSAE","k":"text"},{"c":"fines","i":"","q":"What is the minimum age to get a Florida learner's license?","qt":"อายุขั้นต่ำในการทำใบขับขี่ฝึกหัด (learner's) ในฟลอริดาคือ?","o":[["15","15 ปี"],["14","14 ปี"],["16","16 ปี"],["18","18 ปี"]],"e":"Handbook, Learner's License: minimum age 15.","et":"คู่มือ: อายุขั้นต่ำ 15 ปี","k":"text"},{"c":"fines","i":"","q":"A learner's license holder must always drive with a licensed driver who is at least:","qt":"ผู้ถือใบขับขี่ฝึกหัดต้องขับกับผู้มีใบขับขี่อายุอย่างน้อย:","o":[["21 years old, in the front passenger seat","21 ปี นั่งเบาะหน้าข้างคนขับ"],["16 years old","16 ปี"],["18 years old in the back seat","18 ปี นั่งเบาะหลัง"],["Any age","อายุเท่าใดก็ได้"]],"e":"Handbook, Learner's License: accompanied by a licensed driver 21+ in the front seat.","et":"คู่มือ: ต้องมีผู้ขับอายุ 21+ นั่งเบาะหน้า","k":"text"},{"c":"fines","i":"","q":"During the first 3 months, a learner's license holder may drive only:","qt":"ใน 3 เดือนแรก ผู้ถือใบขับขี่ฝึกหัดขับได้เฉพาะ:","o":[["During daylight hours","ช่วงกลางวัน"],["At night","กลางคืน"],["On interstates","บนทางหลวง Interstate"],["Alone","ขับคนเดียว"]],"e":"Handbook, Learner's License: daylight only for 3 months, then until 10 p.m.","et":"คู่มือ: 3 เดือนแรกกลางวันเท่านั้น หลังจากนั้นถึง 4 ทุ่ม","k":"text"},{"c":"fines","i":"","q":"After the first 3 months, a learner's license holder may drive until:","qt":"หลัง 3 เดือนแรก ผู้ถือใบขับขี่ฝึกหัดขับได้ถึง:","o":[["10 p.m.","4 ทุ่ม (22:00)"],["Midnight","เที่ยงคืน"],["8 p.m.","2 ทุ่ม"],["2 a.m.","ตี 2"]],"e":"Handbook, Learner's License: after 3 months, until 10 p.m.","et":"คู่มือ: หลัง 3 เดือน ขับได้ถึง 22:00","k":"text"},{"c":"fines","i":"","q":"To get a Class E license under 18, a learner must have held the learner's license for at least:","qt":"ผู้ที่อายุต่ำกว่า 18 จะได้ใบขับขี่ Class E ต้องถือใบฝึกหัดอย่างน้อย:","o":[["12 months (with no convictions) and log 50 hours of driving, 10 at night","12 เดือน (ไม่มีความผิด) และบันทึกการขับ 50 ชม. รวมกลางคืน 10 ชม."],["1 month","1 เดือน"],["3 months","3 เดือน"],["No minimum","ไม่มีขั้นต่ำ"]],"e":"Handbook, GDL: 12 months, 50 hours (10 at night) certified by a parent.","et":"คู่มือ: 12 เดือน ขับ 50 ชม. (กลางคืน 10) รับรองโดยผู้ปกครอง","k":"text"},{"c":"fines","i":"","q":"A 16-year-old with a Class E license may not drive between:","qt":"ผู้ขับอายุ 16 ที่มีใบ Class E ห้ามขับระหว่าง:","o":[["11 p.m. and 6 a.m. (unless with a licensed driver 21+ or going to/from work)","23:00 ถึง 06:00 (เว้นแต่มีผู้ขับอายุ 21+ หรือไป/กลับที่ทำงาน)"],["Noon and 6 p.m.","เที่ยงถึง 18:00"],["8 p.m. and 10 p.m.","20:00 ถึง 22:00"],["Any time","ตลอดเวลา"]],"e":"Handbook, GDL: 16-year-olds 11 p.m.–6 a.m. restriction.","et":"คู่มือ: อายุ 16 ห้ามขับ 23:00–06:00","k":"text"},{"c":"fines","i":"","q":"A 17-year-old with a Class E license may not drive between:","qt":"ผู้ขับอายุ 17 ที่มีใบ Class E ห้ามขับระหว่าง:","o":[["1 a.m. and 5 a.m. (unless with a licensed driver 21+ or going to/from work)","01:00 ถึง 05:00 (เว้นแต่มีผู้ขับ 21+ หรือไป/กลับที่ทำงาน)"],["11 p.m. and 6 a.m.","23:00 ถึง 06:00"],["Midnight and 8 a.m.","เที่ยงคืนถึง 08:00"],["Any time","ตลอดเวลา"]],"e":"Handbook, GDL: 17-year-olds 1 a.m.–5 a.m. restriction.","et":"คู่มือ: อายุ 17 ห้ามขับ 01:00–05:00","k":"text"},{"c":"fines","i":"","q":"The Class E knowledge exam has how many questions, and what score passes?","qt":"การสอบข้อเขียน Class E มีกี่ข้อ และผ่านเท่าไร?","o":[["50 questions; 40 correct (80%) to pass","50 ข้อ ต้องถูก 40 ข้อ (80%)"],["20 questions; 15 to pass","20 ข้อ ผ่าน 15"],["100 questions; 50 to pass","100 ข้อ ผ่าน 50"],["30 questions; 20 to pass","30 ข้อ ผ่าน 20"]],"e":"FLHSMV: Class E knowledge exam is 50 questions on road rules and signs; 80% to pass.","et":"FLHSMV: 50 ข้อเรื่องกฎและป้าย ผ่าน 80%","k":"text"},{"c":"fines","i":"","q":"If a police officer signals you to pull over, you should:","qt":"ถ้าตำรวจส่งสัญญาณให้จอด คุณควร:","o":[["Signal, pull safely to the right, stop, stay in the car with hands visible","เปิดไฟเลี้ยว จอดชิดขวาอย่างปลอดภัย อยู่ในรถและให้เห็นมือ"],["Speed up","เร่งหนี"],["Get out and walk toward the officer","ลงจากรถเดินไปหาตำรวจ"],["Stop in your lane immediately","หยุดในเลนทันที"]],"e":"Handbook, Traffic Stops: pull over safely, stay in the vehicle, keep hands visible.","et":"คู่มือ: จอดอย่างปลอดภัย อยู่ในรถ ให้เห็นมือ","k":"text"},{"c":"fines","i":"","q":"Leaving a child under 6 alone in a car is illegal if:","qt":"การทิ้งเด็กอายุต่ำกว่า 6 ไว้ในรถคนเดียวผิดกฎหมายถ้า:","o":[["It is for more than 15 minutes, or for any time if the engine is running or the child is in danger","นานเกิน 15 นาที หรือเมื่อใดก็ตามที่เครื่องยนต์ติดอยู่หรือเด็กตกอยู่ในอันตราย"],["Only overnight","เฉพาะข้ามคืน"],["It is never illegal","ไม่ผิดเลย"],["Only in winter","เฉพาะหน้าหนาว"]],"e":"Florida law (s. 316.6135): no child under 6 left unattended over 15 minutes, or at all if the motor is running or health is at risk.","et":"กฎหมายฟลอริดา: ห้ามทิ้งเด็กต่ำกว่า 6 ขวบเกิน 15 นาที หรือเลยถ้าเครื่องติดหรือเป็นอันตราย","k":"text"},{"c":"rules","i":"sc_bus2way","q":"You are driving on this two-lane, two-way road. The school bus ahead (coming toward you) has stopped with its stop arm out. What must you do?","qt":"คุณขับบนถนนสองเลนสองทิศทางนี้ รถโรงเรียนที่วิ่งสวนมาหยุดและกางป้ายหยุด คุณต้องทำอย่างไร?","o":[["Stop and remain stopped until the stop arm is withdrawn","หยุดและรอจนป้ายหยุดหุบ"],["Slow down and pass carefully","ชะลอและผ่านอย่างระวัง"],["Continue; only traffic behind the bus must stop","ไปต่อได้ เฉพาะรถข้างหลังต้องหยุด"],["Honk and pass","บีบแตรแล้วผ่าน"]],"e":"Handbook, School Buses: on two-way roads, traffic in both directions stops.","et":"คู่มือ: ถนนสองทิศทาง รถทั้งสองทิศต้องหยุด","k":"text"},{"c":"rules","i":"sc_uncontrolled","q":"You (blue car) and the red car reach this intersection with no signs at the same time. The red car is on your right. Who goes first?","qt":"คุณ (รถสีน้ำเงิน) และรถสีแดงถึงทางแยกไม่มีป้ายพร้อมกัน รถแดงอยู่ทางขวาของคุณ ใครไปก่อน?","o":[["The red car (on your right)","รถสีแดง (ทางขวาของคุณ)"],["You (blue car)","คุณ (รถน้ำเงิน)"],["Whoever is faster","คันที่เร็วกว่า"],["Both at once","ไปพร้อมกัน"]],"e":"Handbook, Right-of-Way: yield to the vehicle on your right.","et":"คู่มือ: ให้ทางรถทางขวา","k":"text"},{"c":"rules","i":"sc_leftturn","q":"You (blue car) want to turn left on a green light. A car is coming straight from the opposite direction. You must:","qt":"คุณ (รถน้ำเงิน) ต้องการเลี้ยวซ้ายตอนไฟเขียว มีรถวิ่งตรงสวนมา คุณต้อง:","o":[["Yield and wait until the oncoming car passes","ให้ทางและรอจนรถสวนผ่านไป"],["Turn first because you were there first","เลี้ยวก่อนเพราะมาถึงก่อน"],["Honk and turn","บีบแตรแล้วเลี้ยว"],["Flash your lights and turn","กะพริบไฟแล้วเลี้ยว"]],"e":"Handbook, Right-of-Way: left turns yield to oncoming traffic.","et":"คู่มือ: เลี้ยวซ้ายต้องให้ทางรถสวน","k":"text"},{"c":"rules","i":"sc_roundabout","q":"In a roundabout, pedestrians in the crosswalk at the entry or exit:","qt":"ในวงเวียน คนเดินเท้าบนทางม้าลายที่ทางเข้าหรือทางออก:","o":[["Must be yielded to","ต้องได้รับการให้ทาง"],["Must wait for all cars","ต้องรอรถทั้งหมด"],["May not cross","ห้ามข้าม"],["Should run","ควรวิ่ง"]],"e":"Handbook, Roundabouts: yield to pedestrians at crosswalks.","et":"คู่มือ: ให้ทางคนเดินที่ทางม้าลาย","k":"text"},{"c":"rules","i":"sc_ped","q":"A pedestrian has stepped into the crosswalk in front of you. You must:","qt":"คนเดินเท้าก้าวเข้าทางม้าลายข้างหน้าคุณ คุณต้อง:","o":[["Stop and let the pedestrian cross","หยุดและให้คนเดินข้าม"],["Honk so they hurry","บีบแตรให้รีบ"],["Drive around them","ขับอ้อม"],["Speed up before they reach your lane","เร่งก่อนเขาถึงเลนคุณ"]],"e":"Handbook, Pedestrians: stop for pedestrians in crosswalks.","et":"คู่มือ: หยุดให้คนเดินในทางม้าลาย","k":"text"},{"c":"rules","i":"sig_red","q":"What does this signal mean?","qt":"สัญญาณนี้หมายถึงอะไร?","o":[["Stop; wait behind the stop line","หยุด รอหลังเส้นหยุด"],["Go","ไป"],["Slow down","ชะลอ"],["Yield","ให้ทาง"]],"e":"Handbook, Traffic Signals: steady red = stop.","et":"คู่มือ: ไฟแดง = หยุด","k":"text"},{"c":"rules","i":"sig_yellow","q":"What does this signal mean?","qt":"สัญญาณนี้หมายถึงอะไร?","o":[["The light will soon turn red; stop if you can do so safely","ไฟจะเปลี่ยนเป็นแดง หยุดถ้าทำได้อย่างปลอดภัย"],["Speed up","เร่ง"],["Go freely","ไปได้เลย"],["Stop sign","ป้ายหยุด"]],"e":"Handbook, Traffic Signals: steady yellow = caution, red coming.","et":"คู่มือ: ไฟเหลือง = ระวัง กำลังจะแดง","k":"text"},{"c":"rules","i":"sig_green","q":"What does this signal mean?","qt":"สัญญาณนี้หมายถึงอะไร?","o":[["Go if the way is clear, yielding to pedestrians and vehicles in the intersection","ไปได้ถ้าทางว่าง ให้ทางคนเดินและรถในทางแยก"],["Stop","หยุด"],["Protected left turn","เลี้ยวซ้ายแบบมีสิทธิ์"],["Road closed","ถนนปิด"]],"e":"Handbook, Traffic Signals: green = go when clear.","et":"คู่มือ: ไฟเขียว = ไปเมื่อทางว่าง","k":"text"},{"c":"rules","i":"sig_flashred","q":"The red light is FLASHING. You must:","qt":"ไฟแดงกำลังกะพริบ คุณต้อง:","o":[["Come to a full stop, then proceed when safe","หยุดสนิท แล้วไปเมื่อปลอดภัย"],["Slow down only","ชะลอเท่านั้น"],["Keep going","ขับต่อไป"],["Wait for green","รอไฟเขียว"]],"e":"Handbook, Traffic Signals: flashing red = stop sign.","et":"คู่มือ: ไฟแดงกะพริบ = ป้ายหยุด","k":"text"},{"c":"rules","i":"sig_flashyellow","q":"The yellow light is FLASHING. You must:","qt":"ไฟเหลืองกำลังกะพริบ คุณต้อง:","o":[["Slow down and proceed with caution","ชะลอและไปอย่างระมัดระวัง"],["Stop completely","หยุดสนิท"],["Wait for green","รอไฟเขียว"],["Speed up","เร่ง"]],"e":"Handbook, Traffic Signals: flashing yellow = caution.","et":"คู่มือ: ไฟเหลืองกะพริบ = ระวัง","k":"text"},{"c":"rules","i":"sig_greenarrow","q":"What does this green arrow mean?","qt":"ลูกศรเขียวนี้หมายถึงอะไร?","o":[["You may turn left; oncoming traffic is stopped (protected turn)","เลี้ยวซ้ายได้ รถสวนถูกหยุดอยู่ (เลี้ยวแบบมีสิทธิ์)"],["No left turn","ห้ามเลี้ยวซ้าย"],["Turn only after yielding to oncoming traffic, which has a green","เลี้ยวหลังให้ทางรถสวนที่ได้ไฟเขียว"],["Stop","หยุด"]],"e":"Handbook, Traffic Signals: green arrow = protected turn.","et":"คู่มือ: ลูกศรเขียว = เลี้ยวแบบมีสิทธิ์","k":"text"},{"c":"rules","i":"sig_fya","q":"What does this flashing yellow arrow mean?","qt":"ลูกศรเหลืองกะพริบนี้หมายถึงอะไร?","o":[["Left turns are allowed, but you must yield to oncoming traffic and pedestrians","เลี้ยวซ้ายได้ แต่ต้องให้ทางรถสวนและคนเดินเท้า"],["Left turn is protected","เลี้ยวซ้ายแบบมีสิทธิ์"],["Left turns prohibited","ห้ามเลี้ยวซ้าย"],["Stop and wait for green","หยุดรอไฟเขียว"]],"e":"Handbook, Traffic Signals: flashing yellow arrow = permissive turn.","et":"คู่มือ: ลูกศรเหลืองกะพริบ = เลี้ยวได้แต่ต้องให้ทาง","k":"text"},{"c":"rules","i":"sig_redarrow","q":"What does a steady red arrow mean?","qt":"ลูกศรแดงนิ่งหมายถึงอะไร?","o":[["Do not turn in that direction until the arrow changes","ห้ามเลี้ยวในทิศนั้นจนกว่าลูกศรจะเปลี่ยน"],["Turn after stopping","เลี้ยวหลังหยุด"],["Turn freely","เลี้ยวได้เลย"],["Slow down","ชะลอ"]],"e":"Handbook, Traffic Signals: red arrow = stop; turn not allowed (unless a sign permits).","et":"คู่มือ: ลูกศรแดง = หยุด ห้ามเลี้ยว","k":"text"},{"c":"rules","i":"sig_pedwalk","q":"A pedestrian signal shows a walking person. This means:","qt":"สัญญาณคนข้ามแสดงรูปคนเดิน หมายถึง:","o":[["Pedestrians may cross; turning drivers must yield to them","คนเดินข้ามได้ รถที่เลี้ยวต้องให้ทาง"],["Cars have the right-of-way","รถมีสิทธิ์ทาง"],["Pedestrians must wait","คนเดินต้องรอ"],["The road is closed","ถนนปิด"]],"e":"Handbook, Pedestrian Signals: WALK = pedestrians may cross.","et":"คู่มือ: สัญญาณคนเดิน = ข้ามได้","k":"text"},{"c":"rules","i":"sig_peddont","q":"A pedestrian signal shows a raised hand (Don't Walk). This means:","qt":"สัญญาณคนข้ามแสดงรูปมือ (ห้ามเดิน) หมายถึง:","o":[["Pedestrians should not start crossing","คนเดินไม่ควรเริ่มข้าม"],["Pedestrians may start crossing","คนเดินเริ่มข้ามได้"],["Cars must stop","รถต้องหยุด"],["Bicycles may cross","จักรยานข้ามได้"]],"e":"Handbook, Pedestrian Signals: hand = do not start to cross.","et":"คู่มือ: รูปมือ = ห้ามเริ่มข้าม","k":"text"},{"c":"rules","i":"pm_dyellow","q":"What does this pavement marking (double solid yellow center line) mean?","qt":"เส้นจราจรนี้ (เส้นเหลืองทึบคู่) หมายถึงอะไร?","o":[["No passing in either direction","ห้ามแซงทั้งสองทิศทาง"],["Passing allowed both ways","แซงได้ทั้งสองทาง"],["One-way street","ถนนทางเดียว"],["Bike lane","เลนจักรยาน"]],"e":"Handbook, Pavement Markings: double solid yellow = no passing for either side.","et":"คู่มือ เส้นจราจร: เหลืองทึบคู่ = ห้ามแซงทั้งสองฝั่ง","k":"text"},{"c":"rules","i":"pm_brokenyellow","q":"A single broken (dashed) yellow center line means:","qt":"เส้นเหลืองประเส้นเดียวกลางถนนหมายถึง:","o":[["Two-way traffic; you may pass when it is safe","ถนนสองทิศทาง แซงได้เมื่อปลอดภัย"],["One-way traffic","ทางเดียว"],["No passing","ห้ามแซง"],["Bike lane","เลนจักรยาน"]],"e":"Handbook, Pavement Markings: broken yellow = passing permitted with care.","et":"คู่มือ: เหลืองประ = แซงได้อย่างระวัง","k":"text"},{"c":"rules","i":"pm_whitebroken","q":"Broken white lines between lanes mean:","qt":"เส้นขาวประระหว่างเลนหมายถึง:","o":[["Traffic goes the same direction; you may change lanes when safe","รถวิ่งทิศเดียวกัน เปลี่ยนเลนได้เมื่อปลอดภัย"],["Opposite directions","สวนทางกัน"],["Never change lanes","ห้ามเปลี่ยนเลน"],["Edge of road","ขอบถนน"]],"e":"Handbook, Pavement Markings: white lines separate lanes going the same direction.","et":"คู่มือ: เส้นขาวแบ่งเลนทิศเดียวกัน","k":"text"},{"c":"rules","i":"pm_whitesolid","q":"A solid white line between lanes means:","qt":"เส้นขาวทึบระหว่างเลนหมายถึง:","o":[["Lane changes are discouraged; stay in your lane","ไม่ควรเปลี่ยนเลน ให้อยู่ในเลน"],["Passing is required","ต้องแซง"],["Opposite-direction traffic","รถสวนทาง"],["Parking allowed","จอดได้"]],"e":"Handbook, Pavement Markings: solid white = change lanes only if necessary / discourages crossing.","et":"คู่มือ: เส้นขาวทึบ = ไม่ควรข้ามเส้น","k":"text"},{"c":"rules","i":"pm_twltl","q":"The center lane with solid and broken yellow lines on both sides and left arrows is:","qt":"เลนกลางที่มีเส้นเหลืองทึบและประทั้งสองข้างและลูกศรเลี้ยวซ้ายคือ:","o":[["A two-way left-turn lane, used only for left turns","เลนเลี้ยวซ้ายสองทิศทาง ใช้เฉพาะเลี้ยวซ้าย"],["A passing lane","เลนแซง"],["A parking lane","เลนจอดรถ"],["A bus lane","เลนรถเมล์"]],"e":"Handbook, Pavement Markings: shared center turn lane.","et":"คู่มือ: เลนเลี้ยวซ้ายร่วม","k":"text"},{"c":"rules","i":"pm_stopline","q":"At a stop sign with a white stop line, you must stop:","qt":"ที่ป้ายหยุดที่มีเส้นหยุดสีขาว คุณต้องหยุด:","o":[["Before the stop line","ก่อนเส้นหยุด"],["On the stop line","บนเส้นหยุด"],["Past the crosswalk","เลยทางม้าลาย"],["In the intersection","ในทางแยก"]],"e":"Handbook, Stop Signs: stop at the marked stop line; if none, before the crosswalk; if none, where you can see traffic.","et":"คู่มือ: หยุดที่เส้นหยุด ถ้าไม่มีหยุดก่อนทางม้าลาย ถ้าไม่มีหยุดจุดที่เห็นรถ","k":"text"},{"c":"rules","i":"pm_hov","q":"A white diamond marked on a lane means:","qt":"รูปเพชรสีขาวบนเลนหมายถึง:","o":[["A reserved lane, such as an HOV (carpool) lane","เลนพิเศษ เช่น เลน HOV (รถหลายคน)"],["A bike lane","เลนจักรยาน"],["A school zone","เขตโรงเรียน"],["Railroad ahead","ทางรถไฟข้างหน้า"]],"e":"Handbook, Pavement Markings: diamond = HOV/reserved lane.","et":"คู่มือ: รูปเพชร = เลน HOV/เลนพิเศษ","k":"text"},{"c":"rules","i":"pm_bikelane","q":"This marked lane with a bicycle symbol is:","qt":"เลนที่มีสัญลักษณ์จักรยานนี้คือ:","o":[["A bike lane; do not drive in it except to turn or park where allowed","เลนจักรยาน ห้ามขับเข้าเว้นแต่เลี้ยวหรือจอดที่อนุญาต"],["An extra car lane","เลนรถเพิ่ม"],["A parking lane","เลนจอด"],["A sidewalk","ทางเท้า"]],"e":"Handbook, Bicycles: bike lanes are for bicycles.","et":"คู่มือ: เลนจักรยานสำหรับจักรยาน","k":"text"},{"c":"rules","i":"pm_rrx","q":"The large \"X\" with \"RR\" painted on the road means:","qt":"ตัว \"X\" ใหญ่และ \"RR\" ที่ทาบนถนนหมายถึง:","o":[["A railroad crossing is ahead","ข้างหน้ามีทางข้ามรถไฟ"],["Road closed","ถนนปิด"],["No parking","ห้ามจอด"],["Rest area","จุดพักรถ"]],"e":"Handbook, Pavement Markings: RR X = railroad crossing ahead.","et":"คู่มือ: RR X = ทางรถไฟข้างหน้า","k":"text"},{"c":"rules","i":"pm_yellowedge","q":"Which color line marks the LEFT edge of a divided highway or one-way road?","qt":"เส้นสีใดแสดงขอบซ้ายของถนนที่มีเกาะกลางหรือถนนทางเดียว?","o":[["Yellow","เหลือง"],["White","ขาว"],["Red","แดง"],["Blue","น้ำเงิน"]],"e":"Handbook, Pavement Markings: yellow edge line on the left; white edge line on the right.","et":"คู่มือ: เส้นขอบซ้ายสีเหลือง ขอบขวาสีขาว","k":"text"},{"c":"rules","i":"","q":"Yellow center lines separate:","qt":"เส้นกึ่งกลางสีเหลืองแบ่ง:","o":[["Traffic moving in opposite directions","รถที่วิ่งสวนทางกัน"],["Traffic moving in the same direction","รถทิศเดียวกัน"],["Parking spaces","ช่องจอด"],["Bike lanes","เลนจักรยาน"]],"e":"Handbook, Pavement Markings: yellow = opposite directions.","et":"คู่มือ: เหลือง = สวนทางกัน","k":"text"},{"c":"rules","i":"","q":"White lane lines separate:","qt":"เส้นแบ่งเลนสีขาวแบ่ง:","o":[["Lanes of traffic moving in the same direction","เลนที่รถวิ่งทิศเดียวกัน"],["Traffic moving in opposite directions","รถที่วิ่งสวนทาง"],["School zones","เขตโรงเรียน"],["Toll lanes only","เลนเก็บเงินเท่านั้น"]],"e":"Handbook, Pavement Markings: white = same direction.","et":"คู่มือ: ขาว = ทิศเดียวกัน","k":"text"},{"c":"rules","i":"","q":"When entering an interstate from an on-ramp, you should:","qt":"เมื่อเข้าทางหลวงจากทางขึ้น คุณควร:","o":[["Use the acceleration lane to reach highway speed and merge into a gap","ใช้เลนเร่งความเร็วให้เท่ารถบนทางหลวงแล้วแทรกเข้าช่องว่าง"],["Stop at the end of the ramp","หยุดที่ปลายทางขึ้น"],["Merge slowly at 20 mph","แทรกช้าๆ 20 ไมล์/ชม."],["Drive on the shoulder","ขับบนไหล่ทาง"]],"e":"Handbook, Expressway Driving: use the acceleration lane to match speed.","et":"คู่มือ: ใช้เลนเร่งให้ความเร็วเท่ากัน","k":"text"},{"c":"rules","i":"","q":"When leaving an interstate, you should slow down:","qt":"เมื่อออกจากทางหลวง คุณควรชะลอ:","o":[["After you move into the deceleration (exit) lane","หลังจากเข้าเลนชะลอความเร็ว (ทางออก)"],["While still in the main traffic lane","ขณะยังอยู่ในเลนหลัก"],["Before signaling","ก่อนเปิดไฟเลี้ยว"],["Never","ไม่ต้องชะลอ"]],"e":"Handbook, Expressway Driving: signal, move into the exit lane, then slow down.","et":"คู่มือ: เปิดไฟ เข้าเลนทางออก แล้วชะลอ","k":"text"},{"c":"rules","i":"","q":"On a multi-lane highway, the left lane is mainly for:","qt":"บนทางหลวงหลายเลน เลนซ้ายใช้เป็นหลักสำหรับ:","o":[["Passing","การแซง"],["Slow driving","การขับช้า"],["Parking","การจอด"],["Trucks only","รถบรรทุกเท่านั้น"]],"e":"Handbook, Lanes: keep right except to pass; Florida law prohibits driving in the left lane when being overtaken (on roads 55+ mph).","et":"คู่มือ: ชิดขวาเว้นแต่จะแซง","k":"text"},{"c":"rules","i":"","q":"When driving at night, you should drive slower than in the day because:","qt":"เมื่อขับกลางคืน ควรขับช้ากว่ากลางวันเพราะ:","o":[["You cannot see as far ahead, so you need to be able to stop within the distance lit by headlights","มองเห็นได้ไม่ไกล ต้องหยุดได้ภายในระยะที่ไฟหน้าส่อง"],["Roads are wider","ถนนกว้างกว่า"],["There are more police","มีตำรวจมากกว่า"],["Your car is slower at night","รถช้ากว่าตอนกลางคืน"]],"e":"Handbook, Night Driving: don't overdrive your headlights.","et":"คู่มือ: อย่าขับเร็วเกินระยะไฟหน้า","k":"text"},{"c":"rules","i":"","q":"In a work zone, you should:","qt":"ในเขตก่อสร้าง คุณควร:","o":[["Slow down, obey flaggers and signs, and watch for workers","ชะลอ ทำตามเจ้าหน้าที่ธงและป้าย และระวังคนงาน"],["Speed up to get through","เร่งผ่านไปเร็วๆ"],["Change lanes often","เปลี่ยนเลนบ่อยๆ"],["Ignore orange signs at night","ไม่สนใจป้ายสีส้มตอนกลางคืน"]],"e":"Handbook, Work Zones: fines double when workers are present.","et":"คู่มือ เขตก่อสร้าง: ค่าปรับสองเท่าเมื่อมีคนงาน","k":"text"},{"c":"rules","i":"","q":"A flagger in a work zone holds a sign showing \"STOP\". You must:","qt":"เจ้าหน้าที่ธงในเขตก่อสร้างถือป้าย \"STOP\" คุณต้อง:","o":[["Stop and wait until the flagger shows \"SLOW\" or waves you on","หยุดและรอจนเจ้าหน้าที่แสดง \"SLOW\" หรือโบกให้ไป"],["Go around","ขับอ้อม"],["Slow down only","ชะลอเท่านั้น"],["Honk","บีบแตร"]],"e":"Handbook, Work Zones: flaggers' signals must be obeyed.","et":"คู่มือ: ต้องทำตามเจ้าหน้าที่ธง","k":"text"},{"c":"rules","i":"","q":"You should stop your car at a STOP sign:","qt":"คุณควรหยุดรถที่ป้ายหยุด:","o":[["At the marked stop line; if none, before the crosswalk; if none, before entering the intersection","ที่เส้นหยุด ถ้าไม่มีก่อนทางม้าลาย ถ้าไม่มีก่อนเข้าทางแยก"],["In the middle of the intersection","กลางทางแยก"],["Only if cars are coming","เฉพาะเมื่อมีรถมา"],["After the crosswalk","เลยทางม้าลาย"]],"e":"Handbook, Stop Signs.","et":"คู่มือ: ป้ายหยุด","k":"text"},{"c":"rules","i":"","q":"A \"rolling stop\" at a stop sign is:","qt":"การ \"หยุดไม่สนิท\" ที่ป้ายหยุดคือ:","o":[["Illegal; you must come to a complete stop","ผิดกฎหมาย ต้องหยุดสนิท"],["Legal if no one is coming","ถูกถ้าไม่มีรถ"],["Legal at night","ถูกตอนกลางคืน"],["Legal for right turns","ถูกสำหรับเลี้ยวขวา"]],"e":"Handbook, Stop Signs: wheels must stop completely.","et":"คู่มือ: ล้อต้องหยุดสนิท","k":"text"},{"c":"rules","i":"","q":"At a YIELD sign, you must:","qt":"ที่ป้ายให้ทาง คุณต้อง:","o":[["Slow down and give the right-of-way to traffic and pedestrians; stop if necessary","ชะลอและให้ทางรถและคนเดินเท้า หยุดถ้าจำเป็น"],["Always stop completely","หยุดสนิทเสมอ"],["Speed up to merge","เร่งเพื่อแทรก"],["Ignore it if you're in a hurry","ไม่ต้องสนใจถ้ารีบ"]],"e":"Handbook, Yield Signs.","et":"คู่มือ: ป้ายให้ทาง","k":"text"},{"c":"rules","i":"","q":"The safest way to drive through deep standing water is:","qt":"วิธีปลอดภัยที่สุดในการขับผ่านน้ำท่วมลึกคือ:","o":[["Avoid it; if you must, drive slowly and test your brakes afterward","หลีกเลี่ยง ถ้าจำเป็นให้ขับช้าและทดสอบเบรกหลังผ่าน"],["Drive fast to splash through","ขับเร็วเพื่อลุยผ่าน"],["Turn off headlights","ปิดไฟหน้า"],["Shift to neutral","เข้าเกียร์ว่าง"]],"e":"Handbook, Wet Roads: water can affect brakes; test them gently after.","et":"คู่มือ: น้ำทำให้เบรกไม่ดี ทดสอบเบรกหลังผ่าน","k":"text"},{"c":"rules","i":"","q":"Brake lights must be visible from how far in normal sunlight?","qt":"ไฟเบรกต้องมองเห็นได้จากระยะเท่าไรในแสงแดดปกติ?","o":[["300 feet","300 ฟุต"],["50 feet","50 ฟุต"],["100 feet","100 ฟุต"],["1 mile","1 ไมล์"]],"e":"Handbook, Equipment: stop lamps visible from 300 feet.","et":"คู่มือ: ไฟเบรกมองเห็นได้จาก 300 ฟุต","k":"text"},{"c":"rules","i":"","q":"Your horn must be audible from at least:","qt":"แตรรถต้องได้ยินได้จากระยะอย่างน้อย:","o":[["200 feet","200 ฟุต"],["20 feet","20 ฟุต"],["50 feet","50 ฟุต"],["2 miles","2 ไมล์"]],"e":"Handbook, Equipment: horn audible at 200 feet.","et":"คู่มือ: แตรได้ยินจาก 200 ฟุต","k":"text"},{"c":"rules","i":"","q":"Florida law allows you to drive with sunscreening (tint) on the windshield:","qt":"กฎหมายฟลอริดาอนุญาตให้ติดฟิล์มกรองแสงที่กระจกหน้า:","o":[["Only on the top strip above the manufacturer's AS-1 line","เฉพาะแถบด้านบนเหนือเส้น AS-1 ของผู้ผลิต"],["Fully dark","มืดทั้งแผ่น"],["Any amount","เท่าใดก็ได้"],["Never on cars","ไม่ได้เลย"]],"e":"Handbook, Equipment: windshield tint only above the AS-1 line.","et":"คู่มือ: ฟิล์มกระจกหน้าเฉพาะเหนือเส้น AS-1","k":"text"},{"c":"rules","i":"","q":"When can you drive on the shoulder of the road?","qt":"คุณขับบนไหล่ทางได้เมื่อใด?","o":[["Only in an emergency or when directed by an officer/sign","เฉพาะเหตุฉุกเฉินหรือเมื่อเจ้าหน้าที่/ป้ายสั่ง"],["To pass traffic on the right","เพื่อแซงทางขวา"],["When in a hurry","เมื่อรีบ"],["Any time","ตลอดเวลา"]],"e":"Handbook, Passing: never drive on the shoulder to pass.","et":"คู่มือ: ห้ามขับบนไหล่ทางเพื่อแซง","k":"text"},{"c":"rules","i":"","q":"If someone is tailgating you, you should:","qt":"ถ้ามีคนขับจี้ท้ายคุณ คุณควร:","o":[["Move to another lane or slow down slightly to let them pass","เปลี่ยนเลนหรือชะลอเล็กน้อยให้เขาแซง"],["Brake suddenly","เบรกกะทันหัน"],["Speed up a lot","เร่งความเร็วมาก"],["Turn on high beams","เปิดไฟสูง"]],"e":"Handbook, Following Distance: let tailgaters pass.","et":"คู่มือ: ให้คนจี้ท้ายแซงไป","k":"text"},{"c":"rules","i":"","q":"The total stopping distance is made up of:","qt":"ระยะหยุดรถทั้งหมดประกอบด้วย:","o":[["Perception distance, reaction distance, and braking distance","ระยะรับรู้ ระยะตอบสนอง และระยะเบรก"],["Only braking distance","ระยะเบรกเท่านั้น"],["Only reaction time","เวลาตอบสนองเท่านั้น"],["Car length","ความยาวรถ"]],"e":"Handbook, Stopping Distance.","et":"คู่มือ: ระยะหยุดรถ","k":"text"},{"c":"rules","i":"","q":"Anti-lock brakes (ABS): in an emergency stop you should:","qt":"ระบบเบรก ABS: ในการหยุดฉุกเฉินคุณควร:","o":[["Press the brake firmly and hold it; do not pump","เหยียบเบรกแรงและค้างไว้ ห้ามปั๊ม"],["Pump the brakes","ปั๊มเบรก"],["Release the brake","ปล่อยเบรก"],["Use the parking brake","ใช้เบรกมือ"]],"e":"Handbook, Braking: with ABS, apply steady firm pressure.","et":"คู่มือ: ABS ให้เหยียบแรงค้างไว้","k":"text"},{"c":"rules","i":"","q":"Where must you yield to pedestrians, even if there is no crosswalk painted?","qt":"คุณต้องให้ทางคนเดินเท้าที่ใด แม้ไม่มีทางม้าลาย?","o":[["At intersections (unmarked crosswalks exist at intersections)","ที่ทางแยก (มีทางข้ามโดยไม่มีเส้นที่ทางแยก)"],["Nowhere","ไม่มีที่ไหน"],["Only at schools","เฉพาะที่โรงเรียน"],["Only downtown","เฉพาะในเมือง"]],"e":"Handbook, Pedestrians: intersections have unmarked crosswalks.","et":"คู่มือ: ทางแยกมีทางข้ามที่ไม่มีเส้น","k":"text"},{"c":"rules","i":"","q":"When a car ahead is stopped at a crosswalk, you should:","qt":"เมื่อรถข้างหน้าหยุดที่ทางม้าลาย คุณควร:","o":[["Stop too; do not pass it","หยุดด้วย ห้ามแซง"],["Pass it on the left","แซงทางซ้าย"],["Pass it on the right","แซงทางขวา"],["Honk","บีบแตร"]],"e":"Handbook, Pedestrians: never pass a vehicle stopped for a pedestrian.","et":"คู่มือ: ห้ามแซงรถที่หยุดให้คนเดิน","k":"text"},{"c":"rules","i":"","q":"A school crossing guard holds up a STOP sign. You must:","qt":"เจ้าหน้าที่ข้ามถนนโรงเรียนยกป้าย STOP คุณต้อง:","o":[["Stop and obey the guard","หยุดและทำตามเจ้าหน้าที่"],["Slow down","ชะลอ"],["Continue if no children are visible","ไปต่อถ้าไม่เห็นเด็ก"],["Honk","บีบแตร"]],"e":"Handbook, School Zones: obey crossing guards.","et":"คู่มือ: ทำตามเจ้าหน้าที่ข้ามถนน","k":"text"},{"c":"rules","i":"","q":"A school zone speed limit applies:","qt":"ความเร็วจำกัดในเขตโรงเรียนใช้:","o":[["During the times posted or when the lights are flashing","ในเวลาที่ป้ายระบุหรือเมื่อไฟกะพริบ"],["24 hours a day always","ตลอด 24 ชั่วโมง"],["Only on weekends","เฉพาะวันหยุด"],["Only in summer","เฉพาะฤดูร้อน"]],"e":"Handbook, School Zones.","et":"คู่มือ: เขตโรงเรียน","k":"text"},{"c":"rules","i":"","q":"A slow-moving vehicle has an orange-red triangle on the back. You should:","qt":"รถที่เคลื่อนช้ามีสามเหลี่ยมสีส้มแดงด้านหลัง คุณควร:","o":[["Slow down and be patient; pass only when safe and legal","ชะลอและอดทน แซงเมื่อปลอดภัยและถูกกฎหมาย"],["Tailgate it","ขับจี้ท้าย"],["Honk continuously","บีบแตรตลอด"],["Pass on a curve","แซงตรงโค้ง"]],"e":"Handbook, Slow-Moving Vehicles: emblem means 25 mph or less.","et":"คู่มือ: สัญลักษณ์หมายถึงความเร็ว 25 ไมล์/ชม. หรือน้อยกว่า","k":"text"},{"c":"rules","i":"","q":"Which lane should you use on a road with 3 or more lanes in your direction if you are driving slower than others?","qt":"ถนนที่มี 3 เลนขึ้นไปในทิศของคุณ ถ้าขับช้ากว่าคนอื่นควรใช้เลนใด?","o":[["The right lane","เลนขวา"],["The left lane","เลนซ้าย"],["The center lane always","เลนกลางเสมอ"],["The shoulder","ไหล่ทาง"]],"e":"Handbook, Lanes: slower traffic keep right.","et":"คู่มือ: รถช้าชิดขวา","k":"text"},{"c":"rules","i":"","q":"Florida's \"Steer It, Clear It\" law means after a minor crash with no injuries, you should:","qt":"กฎหมาย \"Steer It, Clear It\" หมายถึงหลังอุบัติเหตุเล็กน้อยไม่มีผู้บาดเจ็บ คุณควร:","o":[["Move the vehicles out of the travel lanes if they can be driven","ย้ายรถออกจากเลนถ้ายังขับได้"],["Leave the cars where they are","ปล่อยรถไว้ที่เดิม"],["Drive away without stopping","ขับหนีไป"],["Wait in the lane for police","รอตำรวจในเลน"]],"e":"Florida law s. 316.061: move damaged vehicles from the road when no injuries.","et":"กฎหมายฟลอริดา: ย้ายรถออกเมื่อไม่มีผู้บาดเจ็บ","k":"text"},{"c":"rules","i":"","q":"When you see a \"HOV 2+\" lane, it means:","qt":"เมื่อเห็นเลน \"HOV 2+\" หมายถึง:","o":[["Only vehicles with 2 or more people may use it (during posted times)","เฉพาะรถที่มีคน 2 คนขึ้นไปใช้ได้ (ในเวลาที่กำหนด)"],["Two lanes ahead","ข้างหน้ามี 2 เลน"],["Trucks only","รถบรรทุกเท่านั้น"],["No passing","ห้ามแซง"]],"e":"Handbook, HOV Lanes.","et":"คู่มือ: เลน HOV","k":"text"},{"c":"signs","i":"","q":"An eight-sided (octagon) sign always means:","qt":"ป้ายแปดเหลี่ยมหมายถึงเสมอ:","o":[["Stop","หยุด"],["Yield","ให้ทาง"],["Railroad ahead","ทางรถไฟข้างหน้า"],["School zone","เขตโรงเรียน"]],"e":"Handbook, Sign Shapes: octagon = stop.","et":"คู่มือ รูปทรงป้าย: แปดเหลี่ยม = หยุด","k":"text"},{"c":"signs","i":"","q":"A downward-pointing triangle sign means:","qt":"ป้ายสามเหลี่ยมหัวกลับหมายถึง:","o":[["Yield","ให้ทาง"],["Stop","หยุด"],["No passing","ห้ามแซง"],["Warning","เตือน"]],"e":"Handbook, Sign Shapes: triangle = yield.","et":"คู่มือ: สามเหลี่ยม = ให้ทาง","k":"text"},{"c":"signs","i":"","q":"A round (circular) yellow sign warns of:","qt":"ป้ายวงกลมสีเหลืองเตือนเรื่อง:","o":[["A railroad crossing ahead","ทางรถไฟข้างหน้า"],["A school","โรงเรียน"],["A hospital","โรงพยาบาล"],["A stop sign","ป้ายหยุด"]],"e":"Handbook, Sign Shapes: round = railroad advance warning.","et":"คู่มือ: วงกลม = เตือนทางรถไฟ","k":"text"},{"c":"signs","i":"","q":"A five-sided (pentagon) sign means:","qt":"ป้ายห้าเหลี่ยมหมายถึง:","o":[["School zone / school crossing","เขตโรงเรียน / ทางข้ามโรงเรียน"],["Stop","หยุด"],["Hospital","โรงพยาบาล"],["No passing","ห้ามแซง"]],"e":"Handbook, Sign Shapes: pentagon = school.","et":"คู่มือ: ห้าเหลี่ยม = โรงเรียน","k":"text"},{"c":"signs","i":"","q":"A pennant-shaped (sideways triangle) sign means:","qt":"ป้ายรูปธงสามเหลี่ยมแนวนอนหมายถึง:","o":[["No passing zone","เขตห้ามแซง"],["Yield","ให้ทาง"],["Stop","หยุด"],["Speed limit","จำกัดความเร็ว"]],"e":"Handbook, Sign Shapes: pennant = no passing zone (left side of road).","et":"คู่มือ: ธงสามเหลี่ยม = เขตห้ามแซง (อยู่ซ้ายถนน)","k":"text"},{"c":"signs","i":"","q":"Vertical rectangular (white) signs usually give:","qt":"ป้ายสี่เหลี่ยมผืนผ้าแนวตั้ง (ขาว) มักแสดง:","o":[["Regulatory information (laws), like speed limits","ข้อบังคับ (กฎหมาย) เช่น จำกัดความเร็ว"],["Warnings","คำเตือน"],["Directions to cities","ทิศทางไปเมือง"],["Hospital locations","ที่ตั้งโรงพยาบาล"]],"e":"Handbook, Sign Shapes: vertical rectangle = regulatory.","et":"คู่มือ: สี่เหลี่ยมแนวตั้ง = ข้อบังคับ","k":"text"},{"c":"signs","i":"","q":"Horizontal rectangular signs are usually:","qt":"ป้ายสี่เหลี่ยมผืนผ้าแนวนอนมักเป็น:","o":[["Guide signs (directions/information)","ป้ายแนะนำ (ทิศทาง/ข้อมูล)"],["Stop signs","ป้ายหยุด"],["Yield signs","ป้ายให้ทาง"],["Railroad signs","ป้ายรถไฟ"]],"e":"Handbook, Sign Shapes: horizontal rectangle = guide.","et":"คู่มือ: สี่เหลี่ยมแนวนอน = ป้ายแนะนำ","k":"text"},{"c":"signs","i":"","q":"What does the color RED on a sign usually mean?","qt":"สีแดงบนป้ายมักหมายถึง:","o":[["Stop, yield, or prohibited (do not)","หยุด ให้ทาง หรือห้าม"],["Warning","เตือน"],["Services","บริการ"],["Recreation","นันทนาการ"]],"e":"Handbook, Sign Colors: red = stop/yield/prohibition.","et":"คู่มือ สีป้าย: แดง = หยุด/ห้าม","k":"text"},{"c":"signs","i":"","q":"What does the color YELLOW on a sign mean?","qt":"สีเหลืองบนป้ายหมายถึง:","o":[["General warning","คำเตือนทั่วไป"],["Construction","ก่อสร้าง"],["Directions","ทิศทาง"],["Motorist services","บริการผู้ขับ"]],"e":"Handbook, Sign Colors: yellow = general warning.","et":"คู่มือ: เหลือง = เตือนทั่วไป","k":"text"},{"c":"signs","i":"","q":"What does the color ORANGE on a sign mean?","qt":"สีส้มบนป้ายหมายถึง:","o":[["Construction and maintenance (work zone) warning","เตือนงานก่อสร้างและซ่อมบำรุง"],["School zone","เขตโรงเรียน"],["Hospital","โรงพยาบาล"],["Parks","สวนสาธารณะ"]],"e":"Handbook, Sign Colors: orange = work zones.","et":"คู่มือ: ส้ม = เขตก่อสร้าง","k":"text"},{"c":"signs","i":"","q":"What does the color GREEN on a sign mean?","qt":"สีเขียวบนป้ายหมายถึง:","o":[["Guide information: directions and distances (also permitted movements)","ข้อมูลแนะนำ: ทิศทางและระยะทาง (และการเคลื่อนที่ที่อนุญาต)"],["Stop","หยุด"],["Warning","เตือน"],["Construction","ก่อสร้าง"]],"e":"Handbook, Sign Colors: green = guide/directions.","et":"คู่มือ: เขียว = แนะนำทิศทาง","k":"text"},{"c":"signs","i":"","q":"What does the color BLUE on a sign mean?","qt":"สีน้ำเงินบนป้ายหมายถึง:","o":[["Motorist services (gas, food, hospital) and disabled parking","บริการผู้ขับ (ปั๊ม อาหาร โรงพยาบาล) และที่จอดผู้พิการ"],["Warning","เตือน"],["Construction","ก่อสร้าง"],["Stop","หยุด"]],"e":"Handbook, Sign Colors: blue = services.","et":"คู่มือ: น้ำเงิน = บริการ","k":"text"},{"c":"signs","i":"","q":"What does the color BROWN on a sign mean?","qt":"สีน้ำตาลบนป้ายหมายถึง:","o":[["Recreation and cultural/scenic areas (parks)","สถานที่พักผ่อน วัฒนธรรม และทิวทัศน์ (สวนสาธารณะ)"],["Warning","เตือน"],["Stop","หยุด"],["Interstate","ทางหลวง Interstate"]],"e":"Handbook, Sign Colors: brown = recreation.","et":"คู่มือ: น้ำตาล = นันทนาการ","k":"text"},{"c":"signs","i":"","q":"Fluorescent yellow-green signs are used for:","qt":"ป้ายสีเหลืองเขียวสะท้อนแสงใช้สำหรับ:","o":[["School zones, pedestrian and bicycle crossings","เขตโรงเรียน ทางข้ามคนเดินและจักรยาน"],["Construction","ก่อสร้าง"],["Hospitals","โรงพยาบาล"],["Freeway exits","ทางออกทางด่วน"]],"e":"Handbook, Sign Colors: fluorescent yellow-green = school/ped/bike.","et":"คู่มือ: เหลืองเขียว = โรงเรียน/คนเดิน/จักรยาน","k":"text"},{"c":"signs","i":"","q":"Which shape is used only for STOP signs?","qt":"รูปทรงใดใช้เฉพาะป้ายหยุด?","o":[["Octagon (8 sides)","แปดเหลี่ยม"],["Triangle","สามเหลี่ยม"],["Circle","วงกลม"],["Diamond","ข้าวหลามตัด"]],"e":"Handbook, Sign Shapes.","et":"คู่มือ: รูปทรงป้าย","k":"text"},{"c":"signs","i":"","q":"Even-numbered interstate highways (like I-10, I-4) generally run:","qt":"ทางหลวง Interstate เลขคู่ (เช่น I-10, I-4) โดยทั่วไปวิ่ง:","o":[["East and west","ตะวันออก-ตะวันตก"],["North and south","เหนือ-ใต้"],["In circles","เป็นวงกลม"],["Only in cities","เฉพาะในเมือง"]],"e":"Handbook, Guide Signs: even = east–west; odd (I-95, I-75) = north–south.","et":"คู่มือ: เลขคู่ = ตะวันออก-ตก เลขคี่ (I-95, I-75) = เหนือ-ใต้","k":"text"},{"c":"signs","i":"","q":"Mile marker signs (small green posts) on interstates help you:","qt":"ป้ายหลักไมล์ (เสาเขียวเล็ก) บนทางหลวงช่วยให้:","o":[["Know your location, e.g., to report a crash","รู้ตำแหน่ง เช่น เพื่อแจ้งอุบัติเหตุ"],["Know the speed limit","รู้ความเร็วจำกัด"],["Find parking","หาที่จอด"],["Know the weather","รู้สภาพอากาศ"]],"e":"Handbook, Guide Signs: mile markers show distance/location.","et":"คู่มือ: หลักไมล์บอกตำแหน่ง","k":"text"},{"c":"signs","i":"","q":"A sign with a red circle and a red slash over a symbol means:","qt":"ป้ายที่มีวงกลมแดงและขีดแดงทับสัญลักษณ์หมายถึง:","o":[["The action shown is NOT allowed","ห้ามทำสิ่งที่แสดง"],["The action is required","ต้องทำสิ่งที่แสดง"],["Warning","เตือน"],["Services ahead","บริการข้างหน้า"]],"e":"Handbook, Regulatory Signs: red circle with slash = prohibited.","et":"คู่มือ: วงกลมแดงมีขีด = ห้าม","k":"text"},{"c":"signs","i":"","q":"Advisory speed plaques (yellow, e.g. \"35 MPH\") under a curve sign mean:","qt":"ป้ายเสริมความเร็วแนะนำ (สีเหลือง เช่น \"35 MPH\") ใต้ป้ายทางโค้งหมายถึง:","o":[["The recommended safe speed for that curve","ความเร็วที่แนะนำสำหรับโค้งนั้น"],["The minimum speed","ความเร็วขั้นต่ำ"],["The legal limit for the whole road","ความเร็วจำกัดตามกฎหมายทั้งถนน"],["The exit number","หมายเลขทางออก"]],"e":"Handbook, Warning Signs: advisory speeds.","et":"คู่มือ: ความเร็วแนะนำ","k":"text"},{"c":"rules","i":"","q":"Can you be ticketed for driving under the posted speed limit?","qt":"คุณถูกปรับได้ไหมถ้าขับต่ำกว่าความเร็วที่จำกัด?","o":[["Yes, if it is too fast for conditions or so slow it blocks traffic","ได้ ถ้าเร็วเกินไปสำหรับสภาพ หรือช้าจนขวางการจราจร"],["No, never","ไม่ได้เลย"],["Only at night","เฉพาะกลางคืน"],["Only in school zones","เฉพาะในเขตโรงเรียน"]],"e":"Handbook, Speed: both \"too fast for conditions\" and impeding traffic are violations.","et":"คู่มือ: ทั้งเร็วเกินสภาพและขวางการจราจรผิดกฎ","k":"text"},{"c":"rules","i":"","q":"Turning right on red is NOT allowed when:","qt":"ห้ามเลี้ยวขวาตอนไฟแดงเมื่อ:","o":[["A \"No Turn on Red\" sign is posted","มีป้าย \"No Turn on Red\""],["There is no traffic","ไม่มีรถ"],["It is daytime","เป็นกลางวัน"],["You have stopped","คุณหยุดแล้ว"]],"e":"Handbook, Traffic Signals: obey NO TURN ON RED signs.","et":"คู่มือ: ปฏิบัติตามป้ายห้ามเลี้ยวตอนไฟแดง","k":"text"},{"c":"rules","i":"","q":"When two vehicles meet on a steep narrow road where neither can pass, who should back up?","qt":"เมื่อรถสองคันเจอกันบนถนนชันแคบที่ผ่านกันไม่ได้ ใครควรถอย?","o":[["The vehicle facing downhill","รถที่หันลงเขา"],["The vehicle facing uphill","รถที่หันขึ้นเขา"],["The smaller car","รถคันเล็ก"],["Neither","ไม่มีใคร"]],"e":"General rule: the downhill vehicle backs up because it is easier to control.","et":"กฎทั่วไป: รถที่หันลงเขาถอยเพราะควบคุมง่ายกว่า","k":"text"},{"c":"rules","i":"","q":"When driving in heavy rain, you should:","qt":"เมื่อขับในฝนหนัก คุณควร:","o":[["Slow down, turn on low beam headlights, and increase following distance","ชะลอ เปิดไฟต่ำ และเพิ่มระยะห่าง"],["Use high beams","ใช้ไฟสูง"],["Drive faster to get home","ขับเร็วเพื่อถึงบ้าน"],["Turn off headlights","ปิดไฟหน้า"]],"e":"Handbook, Wet Weather Driving.","et":"คู่มือ: การขับในฝน","k":"text"},{"c":"rules","i":"","q":"If visibility becomes so bad in fog or smoke that you can't see, you should:","qt":"ถ้าทัศนวิสัยแย่จนมองไม่เห็นในหมอกหรือควัน คุณควร:","o":[["Pull completely off the road, turn off driving lights, and turn on hazard lights","จอดออกนอกถนนทั้งหมด ปิดไฟขับขี่ และเปิดไฟฉุกเฉิน"],["Stop in your lane","หยุดในเลน"],["Speed up to get out","เร่งออกไป"],["Follow the taillights of the car ahead closely","ขับตามไฟท้ายรถข้างหน้าใกล้ๆ"]],"e":"Handbook, Fog/Smoke: get off the road and wait.","et":"คู่มือ: ออกนอกถนนและรอ","k":"text"},{"c":"rules","i":"","q":"When driving down a long steep hill, you should:","qt":"เมื่อขับลงเขาชันยาว คุณควร:","o":[["Shift to a lower gear to help control speed","เปลี่ยนเป็นเกียร์ต่ำเพื่อช่วยควบคุมความเร็ว"],["Shift to neutral","เข้าเกียร์ว่าง"],["Turn off the engine","ดับเครื่อง"],["Ride the brakes the entire way","แตะเบรกตลอดทาง"]],"e":"Handbook, Hills: use lower gear; avoid overheating brakes.","et":"คู่มือ: ใช้เกียร์ต่ำ ไม่ให้เบรกร้อนเกินไป","k":"text"},{"c":"rules","i":"","q":"What should you do at a stop sign where your view of cross traffic is blocked?","qt":"ควรทำอย่างไรที่ป้ายหยุดที่มองไม่เห็นรถทางขวาง?","o":[["Stop at the line, then creep forward slowly until you can see","หยุดที่เส้น แล้วค่อยๆ เคลื่อนไปจนมองเห็น"],["Go fast","ไปเร็วๆ"],["Honk and go","บีบแตรแล้วไป"],["Back up","ถอยหลัง"]],"e":"Handbook, Intersections: stop, then edge forward to see.","et":"คู่มือ: หยุด แล้วค่อยๆ เคลื่อนไปมอง","k":"text"},{"c":"rules","i":"","q":"On a one-way street, you may turn left:","qt":"บนถนนทางเดียว คุณเลี้ยวซ้ายได้:","o":[["From the left-most lane","จากเลนซ้ายสุด"],["From the right lane","จากเลนขวา"],["From any lane","จากเลนใดก็ได้"],["Never","ไม่ได้เลย"]],"e":"Handbook, Turns: on one-way streets, turn left from the left lane.","et":"คู่มือ: ถนนทางเดียว เลี้ยวซ้ายจากเลนซ้ายสุด","k":"text"},{"c":"rules","i":"","q":"When the road has a \"Lane Ends\" sign, the driver in the ending lane should:","qt":"เมื่อมีป้าย \"เลนสิ้นสุด\" ผู้ขับในเลนที่สิ้นสุดควร:","o":[["Signal and merge into the continuing lane when there is a safe gap","เปิดไฟและแทรกเข้าเลนที่ต่อเนื่องเมื่อมีช่องปลอดภัย"],["Stop at the end of the lane","หยุดที่ปลายเลน"],["Speed up and force in","เร่งและแทรกบังคับ"],["Drive on the shoulder","ขับบนไหล่ทาง"]],"e":"Handbook, Merging.","et":"คู่มือ: การแทรกเลน","k":"text"},{"c":"rules","i":"","q":"Who has the right-of-way at a T-intersection with no signs?","qt":"ใครมีสิทธิ์ทางที่สามแยกรูปตัว T ที่ไม่มีป้าย?","o":[["Traffic on the through road (the driver on the ending road yields)","รถบนถนนหลัก (รถบนถนนที่สิ้นสุดต้องให้ทาง)"],["The driver on the ending road","รถบนถนนที่สิ้นสุด"],["The faster driver","ผู้ขับที่เร็วกว่า"],["The driver turning left","ผู้ที่เลี้ยวซ้าย"]],"e":"General right-of-way rule: the terminating road yields to the through road.","et":"กฎทั่วไป: ถนนที่สิ้นสุดต้องให้ทางถนนหลัก","k":"text"},{"c":"rules","i":"","q":"A car is stopped on a two-lane road with its left turn signal on. You want to go straight. You may:","qt":"มีรถหยุดเปิดไฟเลี้ยวซ้ายบนถนนสองเลน คุณต้องการตรงไป คุณ:","o":[["Wait, or pass on the right only if there is enough paved road and it is safe","รอ หรือแซงขวาเฉพาะเมื่อมีถนนลาดยางพอและปลอดภัย"],["Pass on the left","แซงซ้าย"],["Drive on the dirt shoulder","ขับบนไหล่ทางดิน"],["Honk until it moves","บีบแตรจนเขาไป"]],"e":"Handbook, Passing on the Right.","et":"คู่มือ: การแซงขวา","k":"text"},{"c":"rules","i":"","q":"You may NOT drive with headphones covering both ears in Florida because:","qt":"ในฟลอริดา ห้ามใส่หูฟังปิดหูทั้งสองข้างขณะขับเพราะ:","o":[["You might not hear sirens, horns, or trains","อาจไม่ได้ยินไซเรน แตร หรือรถไฟ"],["It is bad for the radio","ไม่ดีต่อวิทยุ"],["It wastes battery","เปลืองแบตเตอรี่"],["It is allowed","อนุญาต"]],"e":"Florida law (s. 316.304) prohibits headsets while driving (one-ear hands-free phone allowed).","et":"กฎหมายฟลอริดาห้ามใส่หูฟังขณะขับ (หูฟังข้างเดียวสำหรับโทรได้)","k":"text"},{"c":"rules","i":"","q":"Under favorable weather and traffic conditions, the Florida handbook says to keep a following distance of at least:","qt":"ในสภาพอากาศและการจราจรที่ดี คู่มือฟลอริดาให้เว้นระยะตามหลังอย่างน้อยเท่าไร?","o":[["4 seconds","4 วินาที"],["2 seconds","2 วินาที"],["3 seconds","3 วินาที"],["1 car length for every 10 mph","1 คันรถต่อทุก 10 ไมล์/ชม."]],"e":"Handbook, Following Distance: keep a minimum of four seconds in favorable conditions; increase it in bad conditions.","et":"คู่มือ: เว้นระยะอย่างน้อย 4 วินาทีในสภาพดี และเพิ่มเมื่อสภาพไม่ดี","k":"text"},{"c":"rules","i":"","q":"You count the seconds after the car ahead passes a sign and reach the sign at \"one thousand three.\" What should you do?","qt":"คุณนับวินาทีหลังรถคันหน้าผ่านป้าย และถึงป้ายเมื่อนับ \"หนึ่งพันสาม\" ควรทำอย่างไร?","o":[["Slow down and count again until you are at least four seconds behind","ลดความเร็วและนับใหม่จนห่างอย่างน้อย 4 วินาที"],["Nothing; three seconds is the legal minimum","ไม่ต้องทำอะไร 3 วินาทีคือขั้นต่ำตามกฎหมาย"],["Change lanes and pass the vehicle immediately","เปลี่ยนเลนแซงทันที"],["Flash your headlights so the driver ahead speeds up","กะพริบไฟให้คันหน้าเร่ง"]],"e":"Handbook: if you reach the object before counting four, you are following too closely; reduce speed and count again.","et":"คู่มือ: ถ้าถึงจุดก่อนนับถึงสี่ แปลว่าตามใกล้เกินไป ให้ลดความเร็วแล้วนับใหม่","k":"text"},{"c":"rules","i":"","q":"On a Florida highway with a posted speed limit of 70 mph, the minimum speed limit is:","qt":"บนทางหลวงฟลอริดาที่จำกัด 70 ไมล์/ชม. ความเร็วขั้นต่ำคือ:","o":[["50 mph","50 ไมล์/ชม."],["40 mph","40 ไมล์/ชม."],["45 mph","45 ไมล์/ชม."],["55 mph","55 ไมล์/ชม."]],"e":"Handbook, Speed Limits: when the posted speed limit is 70 MPH, the minimum speed limit is 50 MPH.","et":"คู่มือ: เมื่อจำกัด 70 ไมล์/ชม. ความเร็วขั้นต่ำคือ 50 ไมล์/ชม.","k":"text"},{"c":"rules","i":"","q":"Unless otherwise posted, which pair of Florida speed limits is correct?","qt":"ถ้าไม่มีป้ายกำหนด ข้อใดถูกต้องเกี่ยวกับความเร็วจำกัดในฟลอริดา?","o":[["School zone 20 mph; business or residential area 30 mph","เขตโรงเรียน 20; ย่านธุรกิจ/ที่พัก 30 ไมล์/ชม."],["School zone 15 mph; business or residential area 25 mph","เขตโรงเรียน 15; ย่านธุรกิจ/ที่พัก 25"],["School zone 25 mph; business or residential area 35 mph","เขตโรงเรียน 25; ย่านธุรกิจ/ที่พัก 35"],["School zone 20 mph; business or residential area 35 mph","เขตโรงเรียน 20; ย่านธุรกิจ/ที่พัก 35"]],"e":"Handbook, Florida Standard Speed Limits: school zones 20 MPH; municipal, business or residential 30 MPH; streets and highways 55 MPH; limited access 70 MPH.","et":"คู่มือ: เขตโรงเรียน 20, ย่านเมือง/ธุรกิจ/ที่พัก 30, ถนนและทางหลวง 55, ทางด่วน 70 ไมล์/ชม.","k":"text"},{"c":"rules","i":"","q":"When you double your speed, the force of impact in a crash becomes about:","qt":"เมื่อคุณเพิ่มความเร็วเป็นสองเท่า แรงกระแทกเมื่อชนจะเพิ่มประมาณ:","o":[["Four times greater","4 เท่า"],["Two times greater","2 เท่า"],["Three times greater","3 เท่า"],["The same, if you wear a seat belt","เท่าเดิมถ้าคาดเข็มขัด"]],"e":"Handbook, Speed Limits: when you double the speed of a car, you increase its force of impact four times.","et":"คู่มือ: เพิ่มความเร็วสองเท่า แรงกระแทกเพิ่มสี่เท่า","k":"text"},{"c":"rules","i":"","q":"A truck or a vehicle towing another vehicle, outside cities and towns, must not follow another truck or towed vehicle within:","qt":"รถบรรทุกหรือรถที่ลากรถอื่น นอกเขตเมือง ห้ามตามรถบรรทุก/รถลากคันอื่นในระยะ:","o":[["300 feet","300 ฟุต"],["100 feet","100 ฟุต"],["200 feet","200 ฟุต"],["500 feet","500 ฟุต"]],"e":"Handbook, Following Distance for Trucks: must not follow within 300 feet (does not apply when passing or within cities/towns).","et":"คู่มือ: ห้ามตามในระยะ 300 ฟุต (ยกเว้นขณะแซงหรือในเมือง)","k":"text"},{"c":"rules","i":"","q":"It is against the law to follow a fire truck that is responding to an emergency closer than:","qt":"การขับตามรถดับเพลิงที่กำลังไปเหตุฉุกเฉินใกล้กว่าระยะใดผิดกฎหมาย?","o":[["500 feet","500 ฟุต"],["300 feet","300 ฟุต"],["200 feet","200 ฟุต"],["100 feet","100 ฟุต"]],"e":"Handbook, Following: it is against the law to follow a fire truck responding to an emergency closer than 500 feet.","et":"คู่มือ: ห้ามตามรถดับเพลิงที่ไปเหตุฉุกเฉินใกล้กว่า 500 ฟุต","k":"text"},{"c":"rules","i":"","q":"You are driving in heavy rain on I-95. Which action is BEST?","qt":"คุณขับบน I-95 ขณะฝนตกหนัก ข้อใดดีที่สุด?","o":[["Turn on low-beam headlights, slow down, and increase your following distance","เปิดไฟต่ำ ลดความเร็ว และเพิ่มระยะตาม"],["Turn on your hazard lights and keep driving at the speed limit","เปิดไฟฉุกเฉินและขับที่ความเร็วจำกัด"],["Use high beams so other drivers can see you","ใช้ไฟสูงให้คนอื่นเห็น"],["Use parking lights only to reduce glare","ใช้ไฟหรี่อย่างเดียวลดแสงจ้า"]],"e":"Handbook, Rain/Low Visibility: turn on headlights when using wipers (parking lights are not a substitute), use low beams, slow down and increase following distance.","et":"คู่มือ: เปิดไฟหน้าเมื่อใช้ที่ปัดน้ำฝน (ไฟหรี่ใช้แทนไม่ได้) ใช้ไฟต่ำ ลดความเร็ว เพิ่มระยะตาม","k":"text"},{"c":"rules","i":"","q":"Rain has just started after a long dry spell. Why is the road especially dangerous?","qt":"ฝนเพิ่งเริ่มตกหลังแล้งมานาน ทำไมถนนจึงอันตรายเป็นพิเศษ?","o":[["Oil that built up on the pavement mixes with water and makes it slick","คราบน้ำมันบนถนนผสมน้ำทำให้ลื่น"],["Rain makes the pavement rougher and tires grip too much","ฝนทำให้ถนนหยาบจนยางเกาะแน่นเกินไป"],["Other drivers are required to turn on hazard lights","คนอื่นต้องเปิดไฟฉุกเฉิน"],["Traffic signals stop working in rain","สัญญาณไฟหยุดทำงานเมื่อฝนตก"]],"e":"Handbook, Rain: roads become slick, especially if it has not rained in a while (oil build-up on the highway).","et":"คู่มือ: ถนนลื่นโดยเฉพาะเมื่อไม่มีฝนมานาน (คราบน้ำมันสะสม)","k":"text"},{"c":"rules","i":"","q":"Your car begins to hydroplane on a wet highway. What should you do?","qt":"รถของคุณเริ่มเหินน้ำบนทางหลวงเปียก ควรทำอย่างไร?","o":[["Take your foot off the gas, avoid braking if possible, and steer in the direction you want to go","ถอนเท้าจากคันเร่ง เลี่ยงการเบรก และหักพวงมาลัยไปทิศที่ต้องการ"],["Brake hard and hold the pedal down","เบรกแรงและกดค้าง"],["Accelerate to push through the water","เร่งเพื่อผ่านน้ำ"],["Steer sharply toward the shoulder","หักพวงมาลัยแรงไปไหล่ทาง"]],"e":"Handbook, Skidding/Hydroplaning: take foot off gas, do not use brakes if possible, turn front tires in the direction you want to go.","et":"คู่มือ: ถอนคันเร่ง ไม่เบรกถ้าเป็นไปได้ หันล้อหน้าไปทิศที่ต้องการ","k":"text"},{"c":"rules","i":"","q":"Your right wheels drop off the pavement onto a low shoulder. What is the correct order?","qt":"ล้อขวาตกออกจากผิวถนนลงไหล่ทางต่ำ ลำดับที่ถูกต้องคือ?","o":[["Ease off the gas, hold the wheel firmly and steer straight, brake lightly, then return slowly when clear","ถอนคันเร่ง จับพวงมาลัยให้แน่นตรง เบรกเบาๆ แล้วกลับขึ้นถนนช้าๆ เมื่อปลอดภัย"],["Jerk the wheel left right away to get back on the road","หักพวงมาลัยซ้ายทันทีเพื่อกลับขึ้นถนน"],["Brake hard, then steer back at highway speed","เบรกแรงแล้วหักกลับที่ความเร็วทางหลวง
